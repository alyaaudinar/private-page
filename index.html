<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Private Page</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
rel="stylesheet">


<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: 'Poppins', sans-serif;

    background: #f7f5f2;

    color: #333;

    overflow-x: hidden;
}


/* =========================
   PAGE SYSTEM
========================= */

.page {

    display: none;

    min-height: 100vh;

    width: 100%;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    text-align: center;

    padding: 30px;
}

.page.active {

    display: flex;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {

    position: fixed;

    top: 20px;

    left: 20px;

    width: auto;

    padding: 8px 18px;

    margin: 0;

    background: #36454F;

    color: white;

    border: none;

    border-radius: 8px;

    font-family: 'Poppins', sans-serif;

    font-weight: 700;

    cursor: pointer;

    z-index: 9999;
}


/* =========================
   GENERAL BUTTON
========================= */

.main-button {

    width: min(90%, 400px);

    padding: 14px 20px;

    margin: 8px;

    border: none;

    border-radius: 10px;

    background: #555;

    color: white;

    font-family: 'Poppins', sans-serif;

    font-weight: 700;

    font-size: 15px;

    cursor: pointer;

    transition: 0.25s ease;
}

.main-button:hover {

    background: #333;

    transform: scale(1.05);
}


/* =========================
   INPUT
========================= */

input,
textarea {

    font-family: 'Poppins', sans-serif;

}


/* =========================
   PAGE 1
========================= */

#page1 {

    background: #f7f5f2;
}


/* =========================
   PAGE 3
========================= */

#page3 {

    background: #f7f5f2;
}

#page3 h1 {

    font-weight: 700;

    margin-bottom: 25px;
}


/* =========================
   RANDOM DAY LETTER
========================= */

#L1 {

    background: #f7f5f2;
}


/* =========================
   WRITE LETTER
========================= */

#LT1 {

    background: #e8dfd3;
}

.letter-paper {

    width: min(90%, 600px);

    background: #f8efd9;

    padding: 30px;

    border-radius: 5px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.2);

    text-align: left;
}

.letter-paper input,
.letter-paper textarea {

    width: 100%;

    margin: 8px 0 15px;

    padding: 10px;

    border: 1px solid #c7b99f;

    background: #fffaf0;

    border-radius: 5px;
}

.letter-paper textarea {

    min-height: 200px;

    resize: vertical;
}


/* =========================
   READ LETTER
========================= */

#LB1 {

    background: #e8dfd3;
}

.letter-list {

    width: min(90%, 600px);

    display: flex;

    flex-direction: column;

    align-items: center;
}

.letter-card {

    width: 100%;

    padding: 20px;

    margin: 8px;

    background: #8b6b4a;

    color: #fff3d6;

    border-radius: 8px;

    box-shadow:
        0 6px 15px rgba(0,0,0,0.25);

    cursor: pointer;

    font-weight: 700;

    transition: 0.25s;
}

.letter-card:hover {

    transform: scale(1.03);

    background: #705338;
}


/* =========================
   BIRTHDAY PAGE
========================= */

#B1 {

    background: #f7f5f2;

}

.birthday-title {

    font-size: clamp(28px, 6vw, 55px);

    font-weight: 700;

    color: #e8c9a9;

    text-shadow:
        3px 3px 0 #36454F;

}


/* =========================
   PHOTO
========================= */

.birthday-photo {

    width: min(80vw, 400px);

    max-height: 400px;

    object-fit: cover;

    margin: 20px;

    border-radius: 12px;

    box-shadow:
        8px 8px 0 #36454F;
}


/* =========================
   LETTER LINK BOX
========================= */

.letter-link {

    padding: 18px 25px;

    background: rgba(0, 0, 0, 0.7);

    color: white;

    font-weight: 700;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.25s;

    max-width: 90%;
}

.letter-link:hover {

    transform: scale(1.08);

    background: rgba(0, 0, 0, 0.85);
}

</style>

</head>


<body>


<!-- ==================================================
     PAGE UTAMA
================================================== -->

<section id="home" class="page active">

    <h1>Access Password</h1>

    <p>clue: tanggal lahir</p>

    <input
        id="password"
        type="password"
        placeholder="enter password"
    >

    <button
        class="main-button"
        onclick="checkMainPassword()"
    >
        Unlock
    </button>

    <p id="message"></p>

</section>


<!-- ==================================================
     PAGE 1
================================================== -->

<section id="page1" class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        Back
    </button>

    <h1>PAGE 1</h1>

    <p>
        OG LETTER
    </p>

    <button
        class="main-button"
        onclick="showPage('page3')"
    >
        click here to read the OG LETTER from Alya Audinar
    </button>

</section>


<!-- ==================================================
     PAGE 3
================================================== -->

<section id="page3" class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        Back
    </button>

    <h1>
        which stuffs do u want to read?
    </h1>

    <button class="main-button">
        JACKET
    </button>

    <button class="main-button">
        BOOKS
    </button>

    <button class="main-button">
        FRAME FOTO
    </button>

    <button class="main-button">
        KEYCHAIN
    </button>

    <button class="main-button">
        OUR PHOTOS
    </button>

    <button
        class="main-button"
        onclick="showPage('L1')"
    >
        RANDOM DAY LETTER
    </button>

</section>


<!-- ==================================================
     B1
================================================== -->

<section id="B1" class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        Back
    </button>

    <h1 class="birthday-title">
        SELAMAT ULANG TAHUN JAFAR
    </h1>

    <img
        src="BIRTHDAY.PNG"
        class="birthday-photo"
        alt="Birthday"
    >

    <div
        class="letter-link"
        onclick="openBirthdayLetter()"
    >
        click here to read YOUR BIRTHDAY LETTER
        from Alya Audinar
    </div>

</section>


<!-- ==================================================
     L1
================================================== -->

<section id="L1" class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        Back
    </button>

    <h1>
        pilih salah satu
    </h1>

    <button
        class="main-button"
        onclick="showPage('LB1')"
    >
        ingin membaca random day letter
    </button>

    <button
        class="main-button"
        onclick="showPage('LT1')"
    >
        ingin menulis random day letter
    </button>

</section>


<!-- ==================================================
     LT1
================================================== -->

<section id="LT1" class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        Back
    </button>

    <div class="letter-paper">

        <h1>
            Write Your Random Day Letter
        </h1>

        <label>
            Tanggal / Bulan / Tahun
        </label>

        <input
            id="letterDate"
            type="date"
        >


        <label>
            Jam
        </label>

        <input
            id="letterTime"
            type="time"
        >


        <label>
            Isi pesan
        </label>

        <textarea
            id="letterMessage"
            placeholder="tulis suratmu di sini..."
        ></textarea>


        <label>
            Nama penulis
        </label>

        <input
            id="letterAuthor"
            type="text"
            placeholder="nama kamu"
        >


        <button
            class="main-button"
            onclick="sendLetter()"
        >
            KIRIM
        </button>

    </div>

</section>


<!-- ==================================================
     LB1
================================================== -->

<section id="LB1" class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        Back
    </button>

    <h1>
        Random Day Letters
    </h1>

    <div
        id="letterList"
        class="letter-list"
    >

        <p>
            Belum ada surat.
        </p>

    </div>

</section>


<script>

/* ==================================================
   PAGE NAVIGATION
================================================== */

let pageHistory = [];


function showPage(pageId) {

    const current =
        document.querySelector(".page.active");

    if (current) {

        pageHistory.push(current.id);

        current.classList.remove("active");

    }

    document
        .getElementById(pageId)
        .classList.add("active");
}


function goBack() {

    if (pageHistory.length === 0) {

        return;

    }

    const current =
        document.querySelector(".page.active");

    current.classList.remove("active");


    const previous =
        pageHistory.pop();

    document
        .getElementById(previous)
        .classList.add("active");

}


/* ==================================================
   MAIN PASSWORD
================================================== */

function checkMainPassword() {

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    /*
       PASSWORD 1
       → PAGE 1
    */

    if (password === "24122006") {

        showPage("page1");

        return;

    }


    /*
       PASSWORD 2
       → B1
    */

    if (password === "20061215") {

        showPage("B1");

        return;

    }


    /*
       WRONG PASSWORD
    */

    message.innerText =
        "astaga? kok salah?";

}


/* ==================================================
   BIRTHDAY LETTER
================================================== */

function openBirthdayLetter() {

    window.location.href =
        "MASUKKAN_LINK_GOOGLE_DRIVE_BIRTHDAY_DI_SINI";

}


/* ==================================================
   RANDOM DAY LETTER
================================================== */

function sendLetter() {

    const date =
        document.getElementById("letterDate").value;

    const time =
        document.getElementById("letterTime").value;

    const message =
        document.getElementById("letterMessage").value;

    const author =
        document.getElementById("letterAuthor").value;


    if (
        !date ||
        !time ||
        !message ||
        !author
    ) {

        alert("lengkapi suratnya dulu ya");

        return;

    }


    /*
       UNTUK SEKARANG:
       data hanya disimpan di browser.

       NANTI KITA GANTI DENGAN DATABASE
       AGAR BISA DILIHAT ORANG LAIN.
    */

    const letters =
        JSON.parse(
            localStorage.getItem("letters") || "[]"
        );


    letters.push({

        date: date,

        time: time,

        message: message,

        author: author

    });


    localStorage.setItem(
        "letters",
        JSON.stringify(letters)
    );


    document
        .getElementById("letterDate")
        .value = "";

    document
        .getElementById("letterTime")
        .value = "";

    document
        .getElementById("letterMessage")
        .value = "";

    document
        .getElementById("letterAuthor")
        .value = "";


    loadLetters();

    showPage("LB1");

}


/* ==================================================
   LOAD LETTERS
================================================== */

function loadLetters() {

    const container =
        document.getElementById("letterList");


    const letters =
        JSON.parse(
            localStorage.getItem("letters") || "[]"
        );


    container.innerHTML = "";


    if (letters.length === 0) {

        container.innerHTML =
            "<p>Belum ada surat.</p>";

        return;

    }


    letters.forEach(function(letter, index) {

        const card =
            document.createElement("div");

        card.className =
            "letter-card";


        card.innerHTML =
            `
            ${letter.date}
            <br>
            ${letter.author}
            `;


        card.onclick =
            function() {

                alert(
                    letter.message
                );

            };


        container.appendChild(card);

    });

}


loadLetters();

</script>


</body>

</html>
