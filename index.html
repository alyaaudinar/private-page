<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday</title>

    <!-- POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #f7f5f2;

            font-family: 'Poppins', sans-serif;

            overflow: hidden;

            color: #333;

        }


        /* =========================
           PAGE UTAMA
        ========================= */

        .page {

            width: 100vw;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            position: fixed;

            top: 20px;

            left: 20px;

            z-index: 1000;

            border: none;

            background: rgba(54, 69, 79, 0.8);

            color: white;

            padding: 9px 18px;

            border-radius: 8px;

            font-family: 'Poppins', sans-serif;

            font-weight: 700;

            font-size: 13px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .back-button:hover {

            background: #36454F;

            transform: scale(1.08);

        }


        /* =========================
           B1 CONTENT
        ========================= */

        #pageB1 {

            flex-direction: column;

            text-align: center;

        }


        /* =========================
           TITLE
        ========================= */

        #birthdayTitle {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            max-width: 90vw;

            margin-bottom: 25px;

            font-family: 'Poppins', sans-serif;

            font-size: clamp(24px, 5vw, 44px);

            font-weight: 700;

            color: #e6b8c2;

            text-shadow:
                3px 3px 0 #ffffff,
                5px 5px 0 rgba(54, 69, 79, 0.25);

        }


        /* EACH LETTER */

        .letter {

            display: inline-block;

            opacity: 0;

            transform: scale(0);

            animation: letterPop 0.6s
                cubic-bezier(0.34, 1.56, 0.64, 1)
                forwards;

        }


        @keyframes letterPop {

            0% {

                opacity: 0;

                transform:
                    scale(0)
                    rotate(-15deg);

            }

            70% {

                opacity: 1;

                transform:
                    scale(1.2)
                    rotate(5deg);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);

            }

        }


        /* =========================
           PHOTO AREA
        ========================= */

        .birthday-stage {

            position: relative;

            width: min(80vw, 430px);

            height: min(60vh, 430px);

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =========================
           BIRTHDAY PHOTO
        ========================= */

        #birthdayPhoto {

            position: relative;

            z-index: 10;

            width: min(65vw, 300px);

            height: min(65vw, 300px);

            object-fit: cover;

            border-radius: 10px;

            box-shadow:
                8px 8px 0 #d6c7b8,
                12px 12px 20px rgba(0,0,0,0.15);

            opacity: 0;

            transform:
                scale(0)
                rotate(-8deg);

            animation:
                scrapbookPop
                1.5s
                0.8s
                cubic-bezier(0.34,1.56,0.64,1)
                forwards;

        }


        @keyframes scrapbookPop {

            0% {

                opacity: 0;

                transform:
                    scale(0)
                    rotate(-12deg);

            }

            45% {

                opacity: 1;

                transform:
                    scale(1.15)
                    rotate(5deg);

            }

            65% {

                transform:
                    scale(0.92)
                    rotate(-3deg);

            }

            80% {

                transform:
                    scale(1.05)
                    rotate(2deg);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);

            }

        }


        /* =========================
           CONFETTI
        ========================= */

        .confetti {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 10px;

            height: 18px;

            border-radius: 2px;

            z-index: 5;

            opacity: 1;

            animation:
                confettiBurst
                var(--duration)
                var(--delay)
                cubic-bezier(0.15,0.8,0.2,1)
                forwards;

        }


        @keyframes confettiBurst {

            0% {

                transform:
                    translate(-50%, -50%)
                    translate(0,0)
                    scale(0.2)
                    rotate(0deg);

            }

            45% {

                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--x) * 0.65),
                        calc(var(--y) * 0.65)
                    )
                    scale(1.8)
                    rotate(var(--rotation));

            }

            100% {

                transform:
                    translate(-50%, -50%)
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(2.5)
                    rotate(var(--rotation));

            }

        }


        /* =========================
           BIRTHDAY LETTER BUTTON
        ========================= */

        #birthdayLetterButton {

            position: relative;

            z-index: 20;

            margin-top: 15px;

            padding: 15px 25px;

            max-width: 90vw;

            border: none;

            border-radius: 10px;

            background: rgba(20, 39, 74, 0.7);

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 700;

            line-height: 1.5;

            text-align: center;

            cursor: pointer;

            box-shadow:
                3px 3px 0 rgba(0,0,0,0.25);

            opacity: 0;

            transform: scale(0.8);

            animation:
                buttonAppear
                0.8s
                4.8s
                cubic-bezier(0.34,1.56,0.64,1)
                forwards;

            transition:
                transform 0.25s ease,
                background 0.25s ease;

        }


        @keyframes buttonAppear {

            0% {

                opacity: 0;

                transform: scale(0.8);

            }

            100% {

                opacity: 1;

                transform: scale(1);

            }

        }


        #birthdayLetterButton:hover {

            background: rgba(10, 25, 55, 0.9);

            transform: scale(1.08);

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #birthdayTitle {

                font-size: 25px;

                padding: 0 15px;

            }

            #birthdayPhoto {

                width: 240px;

                height: 240px;

            }

            #birthdayLetterButton {

                font-size: 13px;

                padding: 13px 18px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         B1
    ========================= -->

    <div
        id="pageB1"
        class="page"
    >


        <!-- BACK -->

        <button
            class="back-button"
            onclick="goBack()"
        >
            BACK
        </button>


        <!-- TITLE -->

        <div id="birthdayTitle"></div>


        <!-- PHOTO + CONFETTI -->

        <div
            class="birthday-stage"
            id="birthdayStage"
        >

            <img
                id="birthdayPhoto"
                src="BIRTHDAY.PNG"
                alt="Birthday Photo"
            >

        </div>


        <!-- LETTER BUTTON -->

        <button
            id="birthdayLetterButton"
            onclick="openBirthdayLetter()"
        >

            CLICK HERE TO READ YOUR BIRTHDAY LETTER
            FROM ALYA AUDINAR

        </button>


    </div>


    <script>


        /* =========================
           CREATE TITLE LETTER BY LETTER
        ========================= */

        function createBirthdayTitle() {

            const title =
                "SELAMAT ULANG TAHUN JAFAR";

            const container =
                document.getElementById("birthdayTitle");


            title.split("").forEach(
                function(character, index) {

                    const span =
                        document.createElement("span");

                    span.classList.add("letter");

                    span.innerText =
                        character === " "
                        ? "\u00A0"
                        : character;

                    span.style.animationDelay =
                        (index * 0.08) + "s";

                    container.appendChild(span);

                }
            );

        }


        /* =========================
           PASTEL COLORS
        ========================= */

        const pastelColors = [

            "#F6E7A1",

            "#F7C6C7",

            "#C6DEF1",

            "#C9E4C5",

            "#E2C6F1",

            "#F9D5A7",

            "#F5B7C8",

            "#D8C4E8"

        ];


        /* =========================
           CONFETTI BURST
        ========================= */

        function createConfetti() {

            const stage =
                document.getElementById("birthdayStage");


            const amount = 80;


            for (
                let i = 0;
                i < amount;
                i++
            ) {


                const confetti =
                    document.createElement("div");


                confetti.classList.add(
                    "confetti"
                );


                /* RANDOM COLOR */

                const color =
                    pastelColors[
                        Math.floor(
                            Math.random()
                            * pastelColors.length
                        )
                    ];


                confetti.style.background =
                    color;


                /* RANDOM DIRECTION */

                const angle =
                    Math.random()
                    * Math.PI
                    * 2;


                const distance =
                    150
                    + Math.random() * 220;


                const x =
                    Math.cos(angle)
                    * distance;


                const y =
                    Math.sin(angle)
                    * distance;


                confetti.style.setProperty(
                    "--x",
                    x + "px"
                );


                confetti.style.setProperty(
                    "--y",
                    y + "px"
                );


                /* RANDOM ROTATION */

                const rotation =
                    (Math.random() * 1000 - 500)
                    + "deg";


                confetti.style.setProperty(
                    "--rotation",
                    rotation
                );


                /* DIFFERENT SPEED */

                const duration =
                    2.8
                    + Math.random() * 2.2;


                confetti.style.setProperty(
                    "--duration",
                    duration + "s"
                );


                /* SMALL STAGGER */

                const delay =
                    Math.random() * 0.35;


                confetti.style.setProperty(
                    "--delay",
                    delay + "s"
                );


                /* RANDOM SIZE */

                confetti.style.width =
                    (7 + Math.random() * 7)
                    + "px";


                confetti.style.height =
                    (10 + Math.random() * 10)
                    + "px";


                stage.appendChild(
                    confetti
                );

            }

        }


        /* =========================
           OPEN BIRTHDAY LETTER
        ========================= */

        function openBirthdayLetter() {

            /*
                NANTI GANTI LINK INI
                DENGAN LINK GOOGLE DRIVE
                PDF SURAT BIRTHDAY
            */

            window.location.href =
                "https://drive.google.com/";

        }


        /* =========================
           BACK
        ========================= */

        function goBack() {

            window.history.back();

        }


        /* =========================
           START B1
        ========================= */

        createBirthdayTitle();

        createConfetti();


    </script>


</body>

</html>
