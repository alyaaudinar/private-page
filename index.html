<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f7f5f2;
    overflow: hidden;
}


/* =====================================================
   PAGE SYSTEM
===================================================== */

.page {
    width: 100%;
    min-height: 100vh;

    display: none;

    position: relative;

    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.page.active {
    display: flex;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 9999;

    padding: 9px 18px;

    border: none;
    border-radius: 10px;

    background: rgba(54, 69, 79, 0.7);

    color: white;

    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.back-button:hover {

    background: #36454F;

    transform: scale(1.08);
}


/* =====================================================
   HOME
===================================================== */

#home {
    background: #f7f5f2;
}

.login-box {

    width: 90%;
    max-width: 400px;

    text-align: center;

    position: relative;

    z-index: 20;
}

.login-box h1 {

    font-size: 24px;

    font-weight: 700;

    color: #333;

    margin-bottom: 10px;
}

.clue {

    color: #888;

    font-size: 14px;

    margin-bottom: 25px;
}

.password-input {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    background: white;

    text-align: center;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    outline: none;
}

.unlock-button {

    width: 100%;

    margin-top: 12px;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #A6A6A6;

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.25s ease,
        transform 0.25s ease;
}

.unlock-button:hover {

    background: #777;

    transform: scale(1.05);
}

#message {

    margin-top: 18px;

    font-size: 14px;

    color: #555;
}


/* =====================================================
   STARS
===================================================== */

.star {

    position: fixed;

    width: var(--size);
    height: var(--size);

    left: var(--left);
    top: var(--top);

    background: var(--color);

    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    opacity: 0.65;

    pointer-events: none;

    animation:
        starMovement var(--duration)
        ease-in-out
        infinite
        alternate;
}

@keyframes starMovement {

    0% {
        transform:
            translate(var(--x1), var(--y1))
            rotate(0deg);
    }

    50% {
        transform:
            translate(var(--x2), var(--y2))
            rotate(8deg);
    }

    100% {
        transform:
            translate(var(--x3), var(--y3))
            rotate(-8deg);
    }
}


/* =====================================================
   B1
===================================================== */

#pageB1 {

    background: #f7f5f2;

    flex-direction: column;

    text-align: center;
}


/* TITLE */

.birthday-title {

    position: relative;

    z-index: 50;

    margin: 0 20px 20px;

    font-size: clamp(28px, 7vw, 52px);

    line-height: 1.2;

    font-weight: 700;

    color: #373757;

    /*
       BLACK SHADOW
       NON-BLUR
       APPROX 20% OPACITY
    */

    text-shadow:
        2px 2px 0 rgba(0, 0, 0, 0.2);
}


/* PHOTO */

.birthday-photo {

    position: relative;

    z-index: 50;

    width: min(520px, 82vw);

    max-height: 55vh;

    height: auto;

    object-fit: contain;

    display: block;

    border: none;

    background: transparent;

    box-shadow: none;

    animation:
        heartbeat
        2.2s
        ease-in-out
        infinite;
}


@keyframes heartbeat {

    0% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.04);
    }

    40% {
        transform: scale(1);
    }

    60% {
        transform: scale(1.045);
    }

    100% {
        transform: scale(1);
    }
}


/* BIRTHDAY BUTTON */

.birthday-letter-button {

    position: relative;

    z-index: 60;

    margin-top: 25px;

    padding: 16px 25px;

    max-width: 90%;

    border: none;

    border-radius: 12px;

    background: rgba(20, 38, 70, 0.5);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    text-align: center;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

    text-shadow: none;

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.birthday-letter-button:hover {

    transform: scale(1.08);

    background: rgba(20, 38, 70, 0.75);
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {

    position: fixed;

    left: 50%;
    top: 50%;

    width: var(--width);
    height: var(--height);

    background: var(--color);

    border-radius: 2px;

    z-index: 30;

    pointer-events: none;

    animation:
        confettiMovement
        var(--duration)
        cubic-bezier(0.15, 0.8, 0.2, 1)
        infinite
        alternate;
}

@keyframes confettiMovement {

    0% {

        transform:
            translate(-50%, -50%)
            translate(0, 0)
            rotate(0deg)
            scale(0.5);

    }

    60% {

        transform:
            translate(-50%, -50%)
            translate(var(--x), var(--y))
            rotate(var(--rotation))
            scale(1.5);

    }

    100% {

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x) * 1.12),
                calc(var(--y) * 1.12)
            )
            rotate(var(--rotation))
            scale(1.8);

    }
}


/* =====================================================
   PAGE 1
===================================================== */

#page1 {

    background: #f7f5f2;

    flex-direction: column;

    text-align: center;
}

.og-title {

    font-size: 30px;

    color: #373757;

    font-weight: 700;
}

.og-text {

    color: #555;

    font-size: 15px;
}


/* OG BUTTON */

.og-letter-button {

    margin-top: 20px;

    padding: 16px 25px;

    border: none;

    border-radius: 12px;

    background: rgba(54, 54, 54, 0.7);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.og-letter-button:hover {

    transform: scale(1.08);

    background: rgba(30,30,30,0.9);
}


/* =====================================================
   PAGE 3
===================================================== */

#page3 {

    background: #f7f5f2;

    flex-direction: column;

    padding: 80px 20px 40px;

    overflow-y: auto;

    text-align: center;
}

.stuffs-title {

    font-size: 30px;

    color: #373757;

    font-weight: 700;

    margin-bottom: 30px;
}


/* BUTTON CONTAINER */

.stuffs-container {

    width: min(500px, 90vw);

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}


/* GENERAL STUFF BUTTON */

.stuff-button {

    min-height: 70px;

    border: none;

    border-radius: 12px;

    background: rgba(54, 54, 54, 0.75);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 7px 15px rgba(0,0,0,0.2);

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        font-weight 0.25s ease;
}

.stuff-button:hover {

    background: #252525;

    transform: scale(1.07);

    font-weight: 700;
}


/* RANDOM DAY LETTER */

.random-button {

    background: rgba(120, 100, 80, 0.75);
}

.random-button:hover {

    background: #80694F;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .birthday-title {

        font-size: 30px;

    }

    .birthday-photo {

        width: 85vw;

        max-height: 48vh;

    }

    .birthday-letter-button {

        font-size: 12px;

        padding: 14px 17px;

    }

    .stuffs-container {

        grid-template-columns: 1fr;

    }

}

</style>
</head>


<body>


<!-- =====================================================
     HOME
===================================================== -->

<section id="home" class="page active">

    <div id="stars"></div>

    <div class="login-box">

        <h1>
            Access Password
        </h1>

        <p class="clue">
            clue: tanggal lahir pemilik website (misal: 12152006)
        </p>

        <input
            id="password"
            class="password-input"
            type="password"
            placeholder="enter password"
        >

        <button
            class="unlock-button"
            onclick="checkPassword()"
        >
            Unlock
        </button>

        <p id="message"></p>

    </div>

</section>



<!-- =====================================================
     B1
===================================================== -->

<section id="pageB1" class="page">

    <button
        class="back-button"
        onclick="goHome()"
    >
        BACK
    </button>

    <h1 class="birthday-title">
        SELAMAT ULANG TAHUN JAFAR!!!
    </h1>

    <img
        src="BIRTHDAY.PNG"
        alt="Birthday"
        class="birthday-photo"
    >

    <button
        class="birthday-letter-button"
        onclick="openBirthdayLetter()"
    >
        CLICK HERE TO READ YOUR BIRTHDAY LETTER FROM ALYA AUDINAR
    </button>

</section>



<!-- =====================================================
     PAGE 1
===================================================== -->

<section id="page1" class="page">

    <button
        class="back-button"
        onclick="goHome()"
    >
        BACK
    </button>

    <h1 class="og-title">
        OG LETTER
    </h1>

    <p class="og-text">
        your original letter is waiting here
    </p>

    <button
        class="og-letter-button"
        onclick="showPage('page3')"
    >
        CLICK HERE TO READ THE OG LETTER FROM ALYA AUDINAR
    </button>

</section>



<!-- =====================================================
     PAGE 3
===================================================== -->

<section id="page3" class="page">

    <button
        class="back-button"
        onclick="showPage('page1')"
    >
        BACK
    </button>

    <h1 class="stuffs-title">
        WHICH STUFFS DO U WANT TO READ?
    </h1>

    <div class="stuffs-container">

        <button
            class="stuff-button"
            onclick="openPDF('JACKET_LINK')"
        >
            JACKET
        </button>

        <button
            class="stuff-button"
            onclick="openPDF('BOOKS_LINK')"
        >
            BOOKS
        </button>

        <button
            class="stuff-button"
            onclick="openPDF('FRAME_FOTO_LINK')"
        >
            FRAME FOTO
        </button>

        <button
            class="stuff-button"
            onclick="openPDF('KEYCHAIN_LINK')"
        >
            KEYCHAIN
        </button>

        <button
            class="stuff-button"
            onclick="openPDF('OUR_PHOTOS_LINK')"
        >
            OUR PHOTOS
        </button>

        <button
            class="stuff-button random-button"
            onclick="showPage('pageL1')"
        >
            RANDOM DAY LETTER
        </button>

    </div>

</section>



<!-- =====================================================
     L1 — TEMPORARY PLACEHOLDER
===================================================== -->

<section id="pageL1" class="page">

    <button
        class="back-button"
        onclick="showPage('page3')"
    >
        BACK
    </button>

    <h1>
        PILIH SALAH SATU
    </h1>

    <button
        class="stuff-button"
        onclick="alert('LT1 akan kita buat di tahap berikutnya')"
    >
        INGIN MENULIS RANDOM DAY LETTER
    </button>

    <button
        class="stuff-button"
        onclick="alert('LB1 akan kita buat di tahap berikutnya')"
    >
        INGIN MEMBACA RANDOM DAY LETTER
    </button>

</section>



<script>


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(pageId) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

        });

    document
        .getElementById(pageId)
        .classList.add("active");

}


/* =====================================================
   HOME
===================================================== */

function goHome() {

    showPage("home");

    document
        .getElementById("password")
        .value = "";

    document
        .getElementById("message")
        .innerText = "";

}


/* =====================================================
   PASSWORD
===================================================== */

function checkPassword() {

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    /* 20061215 → B1 */

    if (password === "20061215") {

        showPage("pageB1");

        createConfetti();

        return;

    }


    /* 24122006 → PAGE 1 */

    if (password === "24122006") {

        showPage("page1");

        return;

    }


    /* WRONG */

    message.innerText =
        "coba lagi ...";

}


/* =====================================================
   ENTER PASSWORD
===================================================== */

document
    .getElementById("password")
    .addEventListener("focus", function() {

        this.placeholder = "";

    });


document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            checkPassword();

        }

    });


/* =====================================================
   CREATE STARS
===================================================== */

function createStars() {

    const container =
        document.getElementById("stars");

    const colors = [

        "#F6E7A1",
        "#F7C6C7",
        "#C6DEF1",
        "#C9E4C5",
        "#E2C6F1",
        "#F9D5A7"

    ];


    for (let i = 0; i < 30; i++) {

        const star =
            document.createElement("div");

        star.classList.add("star");


        const size =
            18 + Math.random() * 25;

        star.style.setProperty(
            "--size",
            size + "px"
        );


        star.style.setProperty(
            "--left",
            Math.random() * 100 + "vw"
        );


        star.style.setProperty(
            "--top",
            Math.random() * 100 + "vh"
        );


        star.style.setProperty(
            "--color",
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ]
        );


        /*
           Gerakan kecil di sekitar
           posisi awal.
        */

        star.style.setProperty(
            "--x1",
            (-18 + Math.random() * 36) + "px"
        );

        star.style.setProperty(
            "--x2",
            (-35 + Math.random() * 70) + "px"
        );

        star.style.setProperty(
            "--x3",
            (-18 + Math.random() * 36) + "px"
        );


        star.style.setProperty(
            "--y1",
            (-12 + Math.random() * 24) + "px"
        );

        star.style.setProperty(
            "--y2",
            (-20 + Math.random() * 40) + "px"
        );

        star.style.setProperty(
            "--y3",
            (-12 + Math.random() * 24) + "px"
        );


        star.style.setProperty(
            "--duration",
            (8 + Math.random() * 7) + "s"
        );


        container.appendChild(star);

    }

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti() {

    document
        .querySelectorAll(".confetti")
        .forEach(c => c.remove());


    const colors = [

        "#F6E7A1",
        "#F7C6C7",
        "#C6DEF1",
        "#C9E4C5",
        "#E2C6F1",
        "#F9D5A7"

    ];


    for (let i = 0; i < 130; i++) {

        const confetti =
            document.createElement("div");

        confetti.classList.add("confetti");


        confetti.style.setProperty(
            "--color",
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ]
        );


        confetti.style.setProperty(
            "--width",
            (6 + Math.random() * 8) + "px"
        );


        confetti.style.setProperty(
            "--height",
            (10 + Math.random() * 14) + "px"
        );


        const angle =
            Math.random() * Math.PI * 2;


        const distance =
            220 + Math.random() * 380;


        const x =
            Math.cos(angle) * distance;


        const y =
            Math.sin(angle) * distance;


        confetti.style.setProperty(
            "--x",
            x + "px"
        );


        confetti.style.setProperty(
            "--y",
            y + "px"
        );


        confetti.style.setProperty(
            "--rotation",
            (-360 + Math.random() * 720) + "deg"
        );


        confetti.style.setProperty(
            "--duration",
            (2.5 + Math.random() * 3) + "s"
        );


        document
            .getElementById("pageB1")
            .appendChild(confetti);

    }

}


/* =====================================================
   BIRTHDAY PDF
===================================================== */

function openBirthdayLetter() {

    /*
       NANTI GANTI DENGAN LINK PDF
    */

    window.location.href =
        "https://drive.google.com";

}


/* =====================================================
   PDF BUTTONS
===================================================== */

function openPDF(link) {

    /*
       NANTI GANTI PLACEHOLDER:

       JACKET_LINK
       BOOKS_LINK
       FRAME_FOTO_LINK
       KEYCHAIN_LINK
       OUR_PHOTOS_LINK
    */

    if (
        link === "JACKET_LINK" ||
        link === "BOOKS_LINK" ||
        link === "FRAME_FOTO_LINK" ||
        link === "KEYCHAIN_LINK" ||
        link === "OUR_PHOTOS_LINK"
    ) {

        alert(
            "Link PDF belum dimasukkan."
        );

        return;

    }


    window.location.href = link;

}


/* =====================================================
   INITIALIZE
===================================================== */

createStars();

</script>

</body>
</html>
