<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Access</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet">


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #f7f5f2;

    font-family: 'Poppins', sans-serif;

    color: #333;

    overflow: hidden;
}


/* =========================
   PAGE SYSTEM
========================= */

.page {

    position: relative;

    width: 100%;
    min-height: 100vh;

    display: none;

    justify-content: center;
    align-items: center;

    text-align: center;
}

.page.active {

    display: flex;
}


/* =========================
   MAIN CONTAINER
========================= */

.content {

    width: 90%;

    max-width: 500px;

    margin: auto;
}


/* =========================
   HEADINGS
========================= */

h1 {

    font-family: 'Poppins', sans-serif;

    font-weight: 700;

    line-height: 1.4;
}


/* =========================
   BUTTON
========================= */

.main-button {

    border: none;

    border-radius: 10px;

    padding: 14px 24px;

    margin: 8px;

    background: #A6A6A6;

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.main-button:hover {

    transform: scale(1.06);

    background: #777;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {

    position: fixed;

    top: 20px;

    left: 20px;

    z-index: 9999;

    border: none;

    border-radius: 8px;

    padding: 10px 18px;

    background: rgba(54,54,54,0.7);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-weight: 700;

    cursor: pointer;

    transition: 0.25s;
}

.back-button:hover {

    transform: scale(1.08);

    background: rgba(30,30,30,0.9);
}


/* =========================
   INPUT
========================= */

.password-input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 8px;

    text-align: center;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    outline: none;
}


/* =========================
   HIDE PLACEHOLDER
========================= */

.password-input:focus::placeholder {

    color: transparent;
}


/* =========================
   MESSAGE
========================= */

#message {

    margin-top: 18px;

    font-size: 14px;
}

</style>

</head>


<body>


<!-- ==================================================
     PAGE UTAMA
================================================== -->

<section
    id="main"
    class="page active">

    <div class="content">

        <h1>
            Access Password
        </h1>

        <p>
            clue: tanggal lahir
        </p>

        <input
            id="password"
            class="password-input"
            type="password"
            placeholder="enter password"
        >

        <button
            class="main-button"
            onclick="checkPassword()">

            Unlock

        </button>

        <p id="message"></p>

    </div>

</section>


<!-- ==================================================
     B1
================================================== -->

<section
    id="b1"
    class="page">

    <button
        class="back-button"
        onclick="showPage('main')">

        BACK

    </button>

    <div class="content">

        <h1>
            SELAMAT ULANG TAHUN JAFAR
        </h1>

        <img
            src="BIRTHDAY.PNG"
            width="250"
            alt="Birthday">

        <br><br>

        <button
            class="main-button"
            onclick="openBirthdayLetter()">

            CLICK HERE TO READ
            YOUR BIRTHDAY LETTER
            FROM ALYA AUDINAR

        </button>

    </div>

</section>


<!-- ==================================================
     PAGE 1
================================================== -->

<section
    id="page1"
    class="page">

    <button
        class="back-button"
        onclick="showPage('main')">

        BACK

    </button>

    <div class="content">

        <h1>
            yey selamat jawabanmu benar!!!
        </h1>

        <img
            src="KUMISENANG.PNG"
            width="250"
            alt="Kumi senang">

        <br><br>

        <button
            class="main-button"
            onclick="showPage('page3')">

            CLICK HERE TO READ
            THE OG LETTER
            FROM ALYA AUDINAR

        </button>

    </div>

</section>


<!-- ==================================================
     PAGE 3
================================================== -->

<section
    id="page3"
    class="page">

    <button
        class="back-button"
        onclick="showPage('page1')">

        BACK

    </button>

    <div class="content">

        <h1>
            which stuffs do u want to read?
        </h1>

        <button
            class="main-button"
            onclick="openJacket()">

            JACKET

        </button>

        <button
            class="main-button"
            onclick="openBooks()">

            BOOKS

        </button>

        <button
            class="main-button"
            onclick="openFrame()">

            FRAME FOTO

        </button>

        <button
            class="main-button"
            onclick="openKeychain()">

            KEYCHAIN

        </button>

        <button
            class="main-button"
            onclick="openPhotos()">

            OUR PHOTOS

        </button>

        <button
            class="main-button"
            onclick="showPage('l1')">

            RANDOM DAY LETTER

        </button>

    </div>

</section>


<!-- ==================================================
     L1
================================================== -->

<section
    id="l1"
    class="page">

    <button
        class="back-button"
        onclick="showPage('page3')">

        BACK

    </button>

    <div class="content">

        <h1>
            pilih salah satu
        </h1>

        <button
            class="main-button"
            onclick="showPage('lt1')">

            INGIN MENULIS
            RANDOM DAY LETTER

        </button>

        <button
            class="main-button"
            onclick="showPage('lb1')">

            INGIN MEMBACA
            RANDOM DAY LETTER

        </button>

    </div>

</section>


<!-- ==================================================
     LT1
================================================== -->

<section
    id="lt1"
    class="page">

    <button
        class="back-button"
        onclick="showPage('l1')">

        BACK

    </button>

    <div class="content">

        <h1>
            WRITE YOUR LETTER
        </h1>

        <input
            id="letterDate"
            type="date">

        <br><br>

        <input
            id="letterTime"
            type="time">

        <br><br>

        <textarea
            id="letterMessage"
            placeholder="write your message..."
            rows="8"
            style="width:100%; padding:12px;">
        </textarea>

        <br><br>

        <input
            id="letterName"
            type="text"
            placeholder="your name"
            style="width:100%; padding:12px;">

        <br>

        <button
            class="main-button"
            onclick="sendLetter()">

            KIRIM

        </button>

    </div>

</section>


<!-- ==================================================
     LB1
================================================== -->

<section
    id="lb1"
    class="page">

    <button
        class="back-button"
        onclick="showPage('l1')">

        BACK

    </button>

    <div class="content">

        <h1>
            RANDOM DAY LETTERS
        </h1>

        <div id="lettersContainer">

            <p>
                Belum ada surat.
            </p>

        </div>

    </div>

</section>



<script>


/* ==================================================
   PAGE NAVIGATION
================================================== */

function showPage(pageId) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

        });

    document
        .getElementById(pageId)
        .classList.add("active");

}


/* ==================================================
   PASSWORD
================================================== */

function checkPassword() {

    const password =
        document
        .getElementById("password")
        .value;

    const message =
        document
        .getElementById("message");


    if (password === "20061215") {

        message.innerText = "";

        showPage("b1");

    }

    else if (password === "24122006") {

        message.innerText = "";

        showPage("page1");

    }

    else {

        message.innerText =
            "astaga? kok salah?";

    }

}


/* ==================================================
   GOOGLE DRIVE
================================================== */

function openBirthdayLetter() {

    window.location.href =
        "LINK_BIRTHDAY_DRIVE";

}


function openJacket() {

    window.location.href =
        "LINK_JACKET_DRIVE";

}


function openBooks() {

    window.location.href =
        "LINK_BOOKS_DRIVE";

}


function openFrame() {

    window.location.href =
        "LINK_FRAME_DRIVE";

}


function openKeychain() {

    window.location.href =
        "LINK_KEYCHAIN_DRIVE";

}


function openPhotos() {

    window.location.href =
        "LINK_OUR_PHOTOS_DRIVE";

}


/* ==================================================
   RANDOM LETTER
================================================== */

function sendLetter() {

    alert(
        "Bagian penyimpanan surat belum dipasang. Kita akan menghubungkannya ke Firebase di tahap berikutnya."
    );

}

</script>


</body>

</html>
