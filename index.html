<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;

/* =====================================================
   PAGE SYSTEM
===================================================== */

.page {

    width: 100%;

    position: relative;

    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.page.active {

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 9999;

    padding: 9px 18px;

    border: none;
    border-radius: 10px;

    background: rgba(54,69,79,0.7);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.25s ease;
}

.back-button:hover {

    background: #36454F;

    transform: scale(1.08);
}


/* =====================================================
   HOME
===================================================== */

#home {
    background: #f7f5f2;
}

.unlock-button {

    background: #A6A6A6;

    color: white;

}

#message {

/* =====================================================
   STARS
===================================================== */

.star {

    position: fixed;

    width: var(--size);
    height: var(--size);

    left: var(--left);
    top: var(--top);

    background: var(--color);

    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    opacity: 0.65;

    pointer-events: none;

    animation:
        starMovement
        var(--duration)
        ease-in-out
        infinite
        alternate;
}

@keyframes starMovement {

    0% {

        transform:
            translate(var(--x1),var(--y1))
            rotate(0deg);
    }

    50% {

        transform:
            translate(var(--x2),var(--y2))
            rotate(8deg);
    }

    100% {

        transform:
            translate(var(--x3),var(--y3))
            rotate(-8deg);
    }
}


/* =====================================================
   B1
===================================================== */

#pageB1 {

    background: #f7f5f2;

    flex-direction: column;

    text-align: center;

    position: relative;

    isolation: isolate;
}


/* =====================================================
   B1 TITLE
===================================================== */

.birthday-title {

    position: relative;

    z-index: 100;

    margin: 0 20px 25px;

    font-size: clamp(30px,7vw,58px);

    line-height: 1.2;

    font-weight: 700;

    color: #373757;

    /*
       NAVY TEXT
       BLACK SHADOW
       NON-BLUR
       20% OPACITY
    */

    text-shadow:
        2px 2px 0 rgba(0,0,0,0.20);
}


/* =====================================================
   B1 PHOTO
===================================================== */

.birthday-photo {

    position: relative;

    z-index: 100;

    width: min(620px,90vw);

    max-height: 58vh;

    height: auto;

    object-fit: contain;

    display: block;

    border: none;

    background: transparent;

    box-shadow: none;

    /*
       HEARTBEAT
    */

    animation:
        heartbeat
        2.2s
        ease-in-out
        infinite;
}


@keyframes heartbeat {

    0% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.055);
    }

    40% {
        transform: scale(1);
    }

    60% {
        transform: scale(1.065);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   B1 BUTTON
===================================================== */

.birthday-letter-button {

    position: relative;

    z-index: 120;

    margin-top: 30px;

    padding: 17px 27px;

    max-width: 90%;

    border: none;

    border-radius: 12px;

    background: rgba(20,38,70,0.5);

    color: white;

    font-family: 'Poppins',sans-serif;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    text-align: center;

    /*
       BOX SHADOW SAJA
       TIDAK ADA TEXT SHADOW
    */

    box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

    text-shadow: none;

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        font-weight 0.25s ease;
}

.birthday-letter-button:hover {

    transform: scale(1.10);

    background: rgba(20,38,70,0.70);

    font-weight: 700;
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {

    position: fixed;

    left: 50%;
    top: 50%;

    width: var(--width);
    height: var(--height);

    background: var(--color);

    border-radius: 2px;

    z-index: 20;

    pointer-events: none;

    /*
       TIDAK ADA FADE
       TIDAK ADA OPACITY ANIMATION
    */

    animation:
        confettiMovement
        var(--duration)
        cubic-bezier(0.15,0.8,0.2,1)
        infinite
        alternate;
}


/*
   CONFETTI BURST
   DARI TENGAH → MENYEBAR
   → MEMBESAR
   → MELAMBAT
*/

@keyframes confettiMovement {

    0% {

        transform:
            translate(-50%,-50%)
            translate(0,0)
            rotate(0deg)
            scale(0.35);
    }

    45% {

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--x) * 0.55),
                calc(var(--y) * 0.55)
            )
            rotate(calc(var(--rotation) * 0.45))
            scale(1.05);
    }

    75% {

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--x) * 0.85),
                calc(var(--y) * 0.85)
            )
            rotate(calc(var(--rotation) * 0.8))
            scale(1.45);
    }

    100% {

        transform:
            translate(-50%,-50%)
            translate(
                var(--x),
                var(--y)
            )
            rotate(var(--rotation))
            scale(1.75);
    }
}

<script>


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(pageId) {

    /*
       Kalau meninggalkan B1,
       hapus confetti.
    */

    if (pageId !== "pageB1") {

        document
            .querySelectorAll(".confetti")
            .forEach(c => c.remove());

    }


    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

        });


    document
        .getElementById(pageId)
        .classList.add("active");


    /*
       Kalau masuk B1,
       buat confetti baru.
    */

    if (pageId === "pageB1") {

        createConfetti();

    }

}


/* =====================================================
   HOME
===================================================== */

function goHome() {

    showPage("home");

    document
        .getElementById("password")
        .value = "";

    document
        .getElementById("message")
        .innerText = "";

}


/* =====================================================
   PASSWORD
===================================================== */

function checkPassword() {

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    /*
       PASSWORD B1
       20061215
    */

    if (password === "20061215") {

        showPage("pageB1");

        return;
    }


    /*
       PASSWORD PAGE 1
       24122006
    */

    if (password === "24122006") {

        showPage("page1");

        return;
    }


    message.innerText =
        "coba lagi ...";

}


/* =====================================================
   ENTER PASSWORD
===================================================== */

document
    .getElementById("password")
    .addEventListener("focus", function() {

        this.placeholder = "";

    });


document
    .getElementById("password")
    .addEventListener("blur", function() {

        if (!this.value) {

            this.placeholder =
                "enter password";

        }

    });


document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            checkPassword();

        }

    });


/* =====================================================
   CREATE STARS
===================================================== */

function createStars() {

    const container =
        document.getElementById("stars");

    const colors = [

        "#F6E7A1",
        "#F7C6C7",
        "#C6DEF1",
        "#C9E4C5",
        "#E2C6F1",
        "#F9D5A7"

    ];

/* =====================================================
   CONFETTI
===================================================== */

function createConfetti() {

    /*
       Bersihkan confetti lama
    */

    document
        .querySelectorAll(".confetti")
        .forEach(c => c.remove());


    const colors = [

        "#F6E7A1",
        "#F7C6C7",
        "#C6DEF1",
        "#C9E4C5",
        "#E2C6F1",
        "#F9D5A7"

    ];


    /*
       180 CONFETTI
       lebih banyak + lebih menyebar
    */

    for (let i = 0; i < 180; i++) {

        const confetti =
            document.createElement("div");

        confetti.classList.add("confetti");


        /*
           Warna pastel random
        */

        confetti.style.setProperty(
            "--color",
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ]
        );


        /*
           Ukuran confetti
        */

        confetti.style.setProperty(
            "--width",
            (5 + Math.random() * 9) + "px"
        );


        confetti.style.setProperty(
            "--height",
            (8 + Math.random() * 16) + "px"
        );


        /*
           Arah random 360 derajat
        */

        const angle =
            Math.random() * Math.PI * 2;


        /*
           Jarak dibuat sangat lebar
           supaya memenuhi layar
        */

        const distance =
            280 + Math.random() * 650;


        const x =
            Math.cos(angle) * distance;


        const y =
            Math.sin(angle) * distance;


        confetti.style.setProperty(
            "--x",
            x + "px"
        );


        confetti.style.setProperty(
            "--y",
            y + "px"
        );


        /*
           Rotasi random
        */

        confetti.style.setProperty(
            "--rotation",
            (-720 + Math.random() * 1440) + "deg"
        );


        /*
           Kecepatan random
           dibuat cukup lambat
           agar gerakan terlihat
        */

        confetti.style.setProperty(
            "--duration",
            (4 + Math.random() * 4) + "s"
        );


        /*
           Masukkan ke B1
        */

        document
            .getElementById("pageB1")
            .appendChild(confetti);

    }

}

/* =====================================================
   RANDOM DAY LETTER
===================================================== */

function sendLetter() {

    const date =
        document.getElementById("letterDate").value;

    const time =
        document.getElementById("letterTime").value;

    const message =
        document
            .getElementById("letterMessage")
            .value
            .trim();

    const author =
        document
            .getElementById("letterAuthor")
            .value
            .trim();


    if (!date || !time || !message || !author) {

        alert(
            "Tolong isi semua bagian surat terlebih dahulu."
        );

        return;
    }


    const letters =
        JSON.parse(
            localStorage.getItem("randomDayLetters")
            || "[]"
        );


    letters.push({

        id: Date.now(),

        date: date,

        time: time,

        message: message,

        author: author

    });


    localStorage.setItem(
        "randomDayLetters",
        JSON.stringify(letters)
    );


    document.getElementById("letterDate").value = "";

    document.getElementById("letterTime").value = "";

    document.getElementById("letterMessage").value = "";

    document.getElementById("letterAuthor").value = "";


    alert(
        "Surat berhasil dikirim ♡"
    );


    showPage("pageLB1");

    loadLetters();

}


/* =====================================================
   LOAD LETTERS
===================================================== */

function loadLetters() {

    const container =
        document.getElementById("lettersContainer");


    container.innerHTML = "";


    const letters =
        JSON.parse(
            localStorage.getItem("randomDayLetters")
            || "[]"
        );


    if (letters.length === 0) {

        container.innerHTML = `

            <p style="
                text-align:center;
                color:#80694F;
                font-family:Georgia,serif;
            ">
                belum ada random day letter.
            </p>

        `;

        return;
    }


    letters
        .slice()
        .reverse()
        .forEach(letter => {

            const button =
                document.createElement("button");


            button.className =
                "saved-letter-button";


            const formattedDate =
                formatDate(letter.date);


            button.innerHTML = `

                ${formattedDate}

                <span class="saved-letter-name">
                    ${escapeHTML(letter.author)}
                </span>

            `;


            button.onclick = function() {

                openLetter(letter);

            };


            container.appendChild(button);

        });

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(dateString) {

    const parts =
        dateString.split("-");


    if (parts.length !== 3) {

        return dateString;

    }


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* =====================================================
   OPEN LETTER
===================================================== */

function openLetter(letter) {

    document
        .getElementById("modalDate")
        .innerText =
            formatDate(letter.date) +
            " • " +
            letter.time;


    document
        .getElementById("modalMessage")
        .innerText =
            letter.message;


    document
        .getElementById("modalAuthor")
        .innerText =
            "— " +
            letter.author;


    document
        .getElementById("letterModal")
        .classList
        .add("active");

}


/* =====================================================
   CLOSE LETTER
===================================================== */

function closeLetter() {

    document
        .getElementById("letterModal")
        .classList
        .remove("active");

}


/* =====================================================
   BASIC HTML ESCAPE
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.innerText =
        text;


    return div.innerHTML;

}
