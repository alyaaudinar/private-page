<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access</title>

    <!-- Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <style>

        /* ===== BODY ===== */

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7f5f2;

            font-family: 'Poppins', sans-serif;
            font-weight: 400;

            color: #333;
        }


        /* ===== MAIN BOX ===== */

        .box {
            width: 90%;
            max-width: 400px;

            text-align: center;
        }


        /* ===== TITLE ===== */

        h1 {
            font-family: 'Poppins', sans-serif;

            font-size: 24px;

            font-weight: 700;
        }


        /* ===== CLUE ===== */

        .clue {
            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 400;

            color: #888;

            margin-bottom: 25px;
        }


        /* ===== PASSWORD INPUT ===== */

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

            font-size: 15px;

            font-family: 'Poppins', sans-serif;

            font-weight: 400;

            outline: none;
        }


        /* ===== BUTTON ===== */

        button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #A6A6A6;

            color: white;

            cursor: pointer;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 700;
        }


        /* ===== ERROR MESSAGE ===== */

        #message {
            margin-top: 20px;

            font-size: 15px;

            font-family: 'Poppins', sans-serif;

            font-weight: 400;
        }


        /* ===== CONFETTI ===== */

        .confetti {
            position: fixed;

            top: -10px;

            width: 8px;

            height: 8px;

            background: #F6E7A1;

            opacity: 0.9;

            pointer-events: none;

            animation: fall linear forwards;
        }


        /* ===== CONFETTI ANIMATION ===== */

        @keyframes fall {

            to {

                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }

    </style>

</head>


<body>

    <div class="box">

        <!-- LOGIN -->

        <div id="login">

            <h1>
                Access Password
            </h1>


            <p class="clue">
                clue: tanggal lahir
            </p>


            <input
                type="password"
                id="password"
                placeholder="enter password"
            >


            <button onclick="checkPassword()">
                Unlock
            </button>


            <p id="message"></p>

        </div>


        <!-- SUCCESS -->

        <div id="success" style="display: none;">

            <h1>
                yey keren kerennn! selamat membacaaaa (by dinar)
            </h1>

        </div>

    </div>


    <script>


        /* ===== CREATE CONFETTI ===== */

        function createConfetti() {

            for (let i = 0; i < 80; i++) {

                const confetti =
                    document.createElement("div");


                confetti.classList.add("confetti");


                /* RANDOM HORIZONTAL POSITION */

                confetti.style.left =
                    Math.random() * 100 + "vw";


                /* 3 SECOND FALL */

                confetti.style.animationDuration =
                    "3s";


                /* SMALL RANDOM DELAY */

                confetti.style.animationDelay =
                    Math.random() * 0.2 + "s";


                /* RANDOM ROTATION */

                confetti.style.transform =
                    "rotate("
                    + Math.random() * 360
                    + "deg)";


                document.body.appendChild(confetti);


                /* REMOVE AFTER ANIMATION */

                setTimeout(function() {

                    confetti.remove();

                }, 3200);

            }

        }


        /* ===== CHECK PASSWORD ===== */

        function checkPassword() {


            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");


            const login =
                document.getElementById("login");


            const success =
                document.getElementById("success");


            /* ===== PASSWORD ===== */

            const correctPassword =
                "24122006";


            /* ===== CORRECT PASSWORD ===== */

            if (password === correctPassword) {


                /* HIDE LOGIN */

                login.style.display =
                    "none";


                /* SHOW SUCCESS */

                success.style.display =
                    "block";


                /* START CONFETTI */

                createConfetti();


                /* OPEN PDF AFTER 3 SECONDS */

                setTimeout(function() {


                    window.location.href =
                    "https://drive.google.com/file/d/1DbNww1R67uc2PHkfKPu_JqTE2KScZ0MO/view?usp=drive_link";


                }, 3000);


            }


            /* ===== WRONG PASSWORD ===== */

            else {


                message.innerText =
                    "astaga? kok salah?";


            }

        }

    </script>

</body>

</html>
