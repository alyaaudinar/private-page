<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access</title>

    <!-- GOOGLE FONT: POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">


    <!-- ==================== CSS ==================== -->

    <style>

        /* BODY */

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7f5f2;

            font-family: 'Poppins', sans-serif;
            font-weight: 400;

            color: #333;

            overflow: hidden;
        }


        /* MAIN BOX */

        .box {
            width: 90%;
            max-width: 400px;

            text-align: center;
        }


        /* TITLE */

        h1 {
            font-family: 'Poppins', sans-serif;

            font-size: 24px;

            font-weight: 700;

            line-height: 1.5;
        }


        /* CLUE */

        .clue {
            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 400;

            color: #888;

            margin-bottom: 25px;
        }


        /* PASSWORD INPUT */

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

            font-size: 15px;

            font-family: 'Poppins', sans-serif;

            font-weight: 400;

            outline: none;
        }


        /* BUTTON */

        button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #A6A6A6;

            color: white;

            cursor: pointer;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 700;

            transition: background 0.2s ease, transform 0.2s ease;
        }


        /* BUTTON HOVER: darker + bigger */

        button:hover {

            background: #7A7A7A;

            transform: scale(1.05);

        }


        /* WRONG PASSWORD MESSAGE */

        #message {
            margin-top: 20px;

            font-size: 15px;

            font-family: 'Poppins', sans-serif;

            font-weight: 400;
        }


        /* ==================== SUCCESS STAGE ==================== */

        #success {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #success h1 {
            position: relative;
            z-index: 3;

            margin-bottom: 25px;

            color: #36454F;

            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
        }


        /* WRONG PASSWORD HEADING */

        #wrongStageWrapper h1 {
            position: relative;
            z-index: 3;

            margin-bottom: 25px;

            font-size: 24px;

            color: #36454F;

            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
        }


        /* TYPEWRITER CURSOR */

        .typewriter-cursor {

            display: inline-block;

            width: 2px;

            margin-left: 2px;

            background: #36454F;

            animation-name: cursorBlink;
            animation-duration: 0.8s;
            animation-timing-function: steps(1);
            animation-iteration-count: infinite;

        }

        @keyframes cursorBlink {

            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

        }


        /* PHOTO + CONFETTI STAGE WRAPPER */

        .photo-stage {
            position: relative;

            width: 260px;
            height: 260px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* PHOTO POP UP */

        .photo-pop {
            position: relative;
            z-index: 2;

            width: 220px;
            height: 220px;

            object-fit: cover;

            border-radius: 16px;

            opacity: 0;
            transform: scale(0);

            animation-name: photoPop;
            animation-duration: 3s;
            animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
            animation-fill-mode: forwards;
            animation-delay: 0.15s;
        }

        @keyframes photoPop {

            0% {
                opacity: 0;
                transform: scale(0) rotate(-8deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.15) rotate(4deg);
            }

            65% {
                transform: scale(0.92) rotate(-5deg);
            }

            78% {
                transform: scale(1.08) rotate(3deg);
            }

            88% {
                transform: scale(0.97) rotate(-2deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }

        }


        /* ==================== BURST CONFETTI (rectangles) ==================== */

        .confetti-burst {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 10px;
            height: 16px;

            border-radius: 2px;

            opacity: 0;

            z-index: 1;

            animation-name: burst;
            animation-timing-function: cubic-bezier(0.05, 0.85, 0.15, 1);
            animation-fill-mode: forwards;
        }


        /* BURST ANIMATION: expand outward from center, grow, rotate,
           and decelerate — no fade out, stays fully visible */

        @keyframes burst {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    translate(0, 0)
                    scale(0.3)
                    rotate(0deg);
            }

            15% {
                opacity: 1;
            }

            100% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    translate(var(--tx), var(--ty))
                    scale(var(--scale))
                    rotate(var(--rot));
            }

        }


        /* ==================== WRONG PASSWORD STAGE ==================== */

        #wrongStageWrapper {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }


        /* PHOTO POP UP (WRONG PASSWORD) - grows in over 2s */

        .photo-pop-wrong {
            position: relative;
            z-index: 2;

            width: 220px;
            height: 220px;

            object-fit: cover;

            border-radius: 16px;

            opacity: 0;
            transform: scale(0);

            animation-name: photoPopWrong;
            animation-duration: 3s;
            animation-timing-function: cubic-bezier(0.34, 1.2, 0.4, 1);
            animation-fill-mode: forwards;
        }

        @keyframes photoPopWrong {

            0% {
                opacity: 0;
                transform: scale(0) rotate(-6deg);
            }

            35% {
                opacity: 1;
                transform: scale(1.15) rotate(5deg);
            }

            50% {
                transform: scale(0.9) rotate(-6deg);
            }

            65% {
                transform: scale(1.08) rotate(4deg);
            }

            80% {
                transform: scale(0.96) rotate(-2deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }

        }


        /* QUESTION MARK SCRAPBOOK STICKERS */

        .question-mark {
            position: absolute;

            top: 50%;
            left: 50%;

            z-index: 1;

            font-family: 'Poppins', sans-serif;
            font-weight: 700;

            color: #6e0f0f;

            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.25),
                0 0 10px rgba(110, 15, 15, 0.35);

            opacity: 0;

            animation-name: scrapScatter;
            animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1.2);
            animation-fill-mode: forwards;

            pointer-events: none;
        }


        /* SCRAPBOOK-STYLE SCATTER: pieces fly from behind the photo
           outward and settle around it, slightly overshooting then
           landing at a random rotation, like tossed paper stickers */

        @keyframes scrapScatter {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    translate(0, 0)
                    scale(0.2)
                    rotate(0deg);
            }

            20% {
                opacity: 1;
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    translate(var(--tx), var(--ty))
                    scale(var(--scale))
                    rotate(var(--rot));
            }

            100% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    translate(var(--tx), var(--ty))
                    scale(calc(var(--scale) * 0.92))
                    rotate(var(--rot-settle));
            }

        }

    </style>

</head>


<!-- ==================== BODY ==================== -->

<body>


    <div class="box">


        <!-- LOGIN PAGE -->

        <div id="login">


            <h1>
                Access Password
            </h1>


            <p class="clue">
                clue: tanggal lahir
            </p>


            <input
                type="password"
                id="password"
                placeholder="enter password"
                onfocus="this.placeholder=''"
                onblur="this.placeholder='enter password'"
            >


            <button onclick="checkPassword()">
                Unlock
            </button>


            <p id="message"></p>


        </div>



        <!-- SUCCESS PAGE -->

        <div id="success" style="display: none;">

            <h1><span id="successText"></span><span class="typewriter-cursor" id="successCursor"></span></h1>

            <div class="photo-stage" id="photoStage">

                <img
                    src="KUMISENANG.png"
                    alt="foto"
                    class="photo-pop"
                >

            </div>

        </div>



        <!-- WRONG PASSWORD STAGE -->

        <div id="wrongStageWrapper" style="display: none;">

            <h1><span id="wrongText"></span><span class="typewriter-cursor" id="wrongCursor"></span></h1>

            <div class="photo-stage" id="photoStageWrong">

                <img
                    src="KUMIMARAH.png"
                    alt="foto"
                    class="photo-pop-wrong"
                    id="wrongPhoto"
                >

            </div>

        </div>


    </div>



    <!-- ==================== JAVASCRIPT ==================== -->

    <script>


        /* ====================
           PASTEL COLOR PALETTE
        ==================== */

        const pastelColors = [
            "#F6E7A1", // pastel yellow
            "#F7C6C7", // pastel pink
            "#C6DEF1", // pastel blue
            "#C9E4C5", // pastel green
            "#E2C6F1", // pastel purple
            "#F9D5A7"  // pastel peach
        ];



        /* ====================
           CREATE CONFETTI BURST
           (rectangular pieces exploding
            outward from behind the photo,
            growing larger as they go)
        ==================== */

        function createConfettiBurst() {

            const stage =
                document.getElementById("photoStage");


            const pieceCount = 60;


            for (let i = 0; i < pieceCount; i++) {


                const piece =
                    document.createElement("div");


                piece.classList.add("confetti-burst");


                /* RANDOM PASTEL COLOR */

                const color =
                    pastelColors[
                        Math.floor(Math.random() * pastelColors.length)
                    ];

                piece.style.background = color;


                /* RANDOM DIRECTION (360 DEGREES AROUND CENTER) */

                const angle =
                    Math.random() * Math.PI * 2;

                /* RANDOM DISTANCE FROM CENTER */

                const distance =
                    120 + Math.random() * 160;

                const tx =
                    Math.cos(angle) * distance;

                const ty =
                    Math.sin(angle) * distance;

                piece.style.setProperty("--tx", tx + "px");
                piece.style.setProperty("--ty", ty + "px");


                /* GROWS LARGER AS IT MOVES OUTWARD */

                const scale =
                    1.5 + Math.random() * 1.5;

                piece.style.setProperty("--scale", scale);


                /* RANDOM ROTATION WHILE BURSTING */

                const rotation =
                    (Math.random() * 720 - 360) + "deg";

                piece.style.setProperty("--rot", rotation);


                /* RANDOM SIZE (RECTANGLE) */

                const width =
                    Math.random() * 6 + 8;

                const height =
                    Math.random() * 10 + 12;

                piece.style.width = width + "px";
                piece.style.height = height + "px";


                /* RANDOM DURATION + SMALL DELAY */

                piece.style.animationDuration =
                    (0.8 + Math.random() * 0.6) + "s";

                piece.style.animationDelay =
                    (Math.random() * 0.15) + "s";


                /* ADD BEHIND THE PHOTO */

                stage.appendChild(piece);


                /* REMOVE AFTER ANIMATION ENDS */

                setTimeout(function() {

                    piece.remove();

                }, 1800);


            }

        }



        /* ====================
           CREATE QUESTION MARK SCATTER
           (scrapbook-style stickers that fly
            out from behind the wrong-password
            photo and settle around it)
        ==================== */

        function createQuestionScatter() {

            const stage =
                document.getElementById("photoStageWrong");


            const markCount = 14;


            for (let i = 0; i < markCount; i++) {


                const mark =
                    document.createElement("div");


                mark.classList.add("question-mark");

                mark.innerText = "?";


                /* RANDOM DIRECTION AROUND THE PHOTO */

                const angle =
                    (Math.PI * 2 / markCount) * i
                    + (Math.random() * 0.4 - 0.2);

                /* RANDOM DISTANCE FROM CENTER (LANDS AROUND THE PHOTO) */

                const distance =
                    110 + Math.random() * 90;

                const tx =
                    Math.cos(angle) * distance;

                const ty =
                    Math.sin(angle) * distance;

                mark.style.setProperty("--tx", tx + "px");
                mark.style.setProperty("--ty", ty + "px");


                /* RANDOM SIZE (SCALE) */

                const scale =
                    0.9 + Math.random() * 1.1;

                mark.style.setProperty("--scale", scale);


                /* RANDOM TUMBLE WHILE FLYING + FINAL SETTLED TILT */

                const rotation =
                    (Math.random() * 540 - 270) + "deg";

                const settleRotation =
                    (Math.random() * 40 - 20) + "deg";

                mark.style.setProperty("--rot", rotation);
                mark.style.setProperty("--rot-settle", settleRotation);


                /* RANDOM FONT SIZE (STICKER SIZE) */

                const fontSize =
                    Math.random() * 16 + 26;

                mark.style.fontSize =
                    fontSize + "px";


                /* RANDOM DURATION + STAGGERED DELAY */

                mark.style.animationDuration =
                    (0.9 + Math.random() * 0.5) + "s";

                mark.style.animationDelay =
                    (i * 0.03 + Math.random() * 0.1) + "s";


                /* ADD BEHIND THE PHOTO */

                stage.appendChild(mark);


                /* REMOVE AFTER STAGE CLOSES */

                setTimeout(function() {

                    mark.remove();

                }, 3200);


            }

        }



        /* ====================
           TYPEWRITER EFFECT
        ==================== */

        function typewriterEffect(elementId, text, speed) {

            const el =
                document.getElementById(elementId);


            /* RESET FOR REPEATED TRIES */

            el.innerText = "";


            let i = 0;


            function typeNextChar() {

                if (i < text.length) {

                    el.innerText += text.charAt(i);

                    i++;

                    setTimeout(typeNextChar, speed);

                }

            }


            typeNextChar();

        }



        /* ====================
           CHECK PASSWORD
        ==================== */

        function checkPassword() {


            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");


            const login =
                document.getElementById("login");


            const success =
                document.getElementById("success");


            /* PASSWORD */

            const correctPassword =
                "24122006";


            /* ====================
               CORRECT PASSWORD
            ==================== */

            if (password === correctPassword) {


                /* HIDE LOGIN */

                login.style.display =
                    "none";


                /* SHOW SUCCESS MESSAGE */

                success.style.display =
                    "flex";


                /* TYPEWRITER HEADING */

                typewriterEffect(
                    "successText",
                    "yey selamat jawabanmu benar!!! (slmt membaca y)",
                    45
                );


                /* START PHOTO POP UP + CONFETTI BURST BEHIND IT */

                createConfettiBurst();


                /* OPEN PDF AFTER 3 SECONDS */

                setTimeout(function() {


                    window.location.href =
                    "https://drive.google.com/file/d/1DbNww1R67uc2PHkfKPu_JqTE2KScZ0MO/view?usp=drive_link";


                }, 3000);


            }


            /* ====================
               WRONG PASSWORD
            ==================== */

            else {


                const wrongStageWrapper =
                    document.getElementById("wrongStageWrapper");


                /* HIDE LOGIN */

                login.style.display =
                    "none";


                /* SHOW WRONG PASSWORD PHOTO STAGE */

                wrongStageWrapper.style.display =
                    "flex";


                /* TYPEWRITER HEADING */

                typewriterEffect(
                    "wrongText",
                    "loh kok salah?",
                    45
                );


                /* START QUESTION MARK SCRAPBOOK SCATTER BEHIND PHOTO */

                createQuestionScatter();


                /* AFTER 3 SECONDS, GO BACK TO LOGIN */

                setTimeout(function() {


                    wrongStageWrapper.style.display =
                        "none";


                    login.style.display =
                        "block";


                    message.innerText =
                        "astaga? kok salah?";


                    /* RESET PHOTO ANIMATION FOR NEXT TRY */

                    const wrongPhoto =
                        document.getElementById("wrongPhoto");

                    wrongPhoto.style.animation =
                        "none";

                    void wrongPhoto.offsetWidth;

                    wrongPhoto.style.animation =
                        "";


                }, 3000);


            }

        }

    </script>


</body>

</html>
