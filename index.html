<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access</title>

<!-- GOOGLE FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: 'Poppins', sans-serif;

    background: #f7f5f2;

    color: #333;

    overflow: hidden;
}


/* =====================================================
   PAGE SYSTEM
===================================================== */

.page {

    position: relative;

    width: 100%;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 9999;

    padding: 9px 18px;

    border: none;

    border-radius: 10px;

    background: rgba(60,60,60,0.75);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.back-button:hover {

    background: rgba(30,30,30,0.9);

    transform: scale(1.08);
}


/* =====================================================
   PAGE 1
===================================================== */

#page1 {

    background: #f7f5f2;

    overflow: hidden;
}


/* =====================================================
   STAR BACKGROUND
===================================================== */

.star {

    position: absolute;

    width: var(--size);
    height: var(--size);

    background: var(--color);

    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 100%,
        50% 74%,
        21% 100%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    opacity: 0.75;

    animation: starFloat var(--duration) ease-in-out infinite alternate;

    pointer-events: none;
}


/*
   IMPORTANT:

   Stars do NOT travel from one side
   of the screen to the other.

   They only move slightly around
   their original position.
*/

@keyframes starFloat {

    0% {

        transform:
            translate(
                var(--moveX1),
                var(--moveY1)
            )
            rotate(0deg);
    }

    50% {

        transform:
            translate(
                var(--moveX2),
                var(--moveY2)
            )
            rotate(8deg);
    }

    100% {

        transform:
            translate(
                var(--moveX3),
                var(--moveY3)
            )
            rotate(-8deg);
    }
}


/* =====================================================
   LOGIN BOX
===================================================== */

.login-box {

    position: relative;

    z-index: 10;

    width: 90%;

    max-width: 400px;

    text-align: center;
}


.login-box h1 {

    margin-bottom: 15px;

    font-size: 25px;

    font-weight: 700;

    color: #333;
}


.clue {

    margin-bottom: 25px;

    color: #888;

    font-size: 14px;

    font-weight: 400;
}


/* =====================================================
   PASSWORD INPUT
===================================================== */

.password-input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 9px;

    outline: none;

    text-align: center;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;
}


.password-input:focus {

    border-color: #999;
}


/* =====================================================
   UNLOCK BUTTON
===================================================== */

.unlock-button {

    width: 100%;

    margin-top: 12px;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: #a6a6a6;

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}


.unlock-button:hover {

    background: #777;

    transform: scale(1.04);
}


.message {

    margin-top: 15px;

    font-size: 14px;

    font-weight: 400;
}


/* =====================================================
   PAGE B1
===================================================== */

#pageB1 {

    background: #f7f5f2;

    overflow: hidden;

    flex-direction: column;
}


/* =====================================================
   B1 TITLE
===================================================== */

.birthday-title {

    position: relative;

    z-index: 20;

    margin: 0 20px 25px;

    text-align: center;

    color: #e5c77a;

    font-size: clamp(28px, 7vw, 52px);

    font-weight: 700;

    line-height: 1.15;

    text-shadow:
        3px 3px 0 #ffffff,
        5px 5px 0 rgba(0,0,0,0.15);
}


/* EACH LETTER */

.title-letter {

    display: inline-block;

    opacity: 0;

    transform: scale(0);

    animation: letterPop 0.55s cubic-bezier(
        0.34,
        1.56,
        0.64,
        1
    ) forwards;
}


@keyframes letterPop {

    0% {

        opacity: 0;

        transform:
            scale(0)
            rotate(-15deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.18)
            rotate(5deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/* =====================================================
   B1 PHOTO
===================================================== */

.birthday-photo-wrapper {

    position: relative;

    z-index: 15;

    width: 280px;

    height: 280px;

    display: flex;

    justify-content: center;

    align-items: center;
}


.birthday-photo {

    position: relative;

    z-index: 20;

    width: 230px;

    height: 230px;

    object-fit: cover;

    padding: 10px;

    background: white;

    box-shadow:
        5px 7px 0 rgba(0,0,0,0.12);

    transform:
        scale(0)
        rotate(-7deg);

    opacity: 0;

    animation:
        scrapbookPop
        1.2s
        0.8s
        cubic-bezier(
            0.34,
            1.56,
            0.64,
            1
        )
        forwards;
}


@keyframes scrapbookPop {

    0% {

        opacity: 0;

        transform:
            scale(0)
            rotate(-15deg);
    }

    55% {

        opacity: 1;

        transform:
            scale(1.12)
            rotate(6deg);
    }

    75% {

        transform:
            scale(0.94)
            rotate(-4deg);
    }

    90% {

        transform:
            scale(1.04)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(-2deg);
    }
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {

    position: absolute;

    left: 50%;
    top: 50%;

    width: var(--width);
    height: var(--height);

    background: var(--color);

    border-radius: 3px;

    z-index: 10;

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(0.2);

    animation:
        confettiBurst
        var(--duration)
        var(--delay)
        cubic-bezier(
            0.12,
            0.75,
            0.18,
            1
        )
        forwards;

    pointer-events: none;
}


@keyframes confettiBurst {

    0% {

        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(0.2)
            rotate(0deg);
    }

    55% {

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x) * 0.75),
                calc(var(--y) * 0.75)
            )
            scale(
                calc(var(--scale) * 1.15)
            )
            rotate(
                calc(var(--rotation) * 0.7)
            );
    }

    100% {

        transform:
            translate(-50%, -50%)
            translate(
                var(--x),
                var(--y)
            )
            scale(var(--scale))
            rotate(var(--rotation));
    }
}


/* =====================================================
   BIRTHDAY LETTER BUTTON
===================================================== */

.birthday-letter-button {

    position: relative;

    z-index: 50;

    width: min(85%, 550px);

    margin-top: 25px;

    padding: 16px 22px;

    border: none;

    border-radius: 10px;

    background: rgba(15, 35, 65, 0.70);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    line-height: 1.5;

    text-shadow:
        2px 2px 0 #000;

    cursor: pointer;

    opacity: 0;

    transform: scale(0.85);

    animation:
        buttonAppear
        0.8s
        4.5s
        ease
        forwards;

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}


.birthday-letter-button:hover {

    transform: scale(1.06);

    background: rgba(5, 20, 45, 0.9);
}


@keyframes buttonAppear {

    to {

        opacity: 1;

        transform: scale(1);
    }
}


/* =====================================================
   PAGE 2 PLACEHOLDER
===================================================== */

#page2 {

    background: #36454f;

    color: white;

    flex-direction: column;

    text-align: center;
}


#page2 h1 {

    font-size: 30px;

    font-weight: 700;
}


#page2 p {

    font-size: 15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .birthday-photo {

        width: 190px;
        height: 190px;
    }

    .birthday-photo-wrapper {

        width: 230px;
        height: 230px;
    }

    .birthday-letter-button {

        font-size: 13px;

        padding: 14px 16px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     PAGE 1
===================================================== -->

<section id="page1" class="page">


    <!-- STARS -->

    <div
        class="star"
        style="
        --size:48px;
        --color:#F6E7A1;
        --duration:7s;
        --moveX1:-5px;
        --moveY1:4px;
        --moveX2:8px;
        --moveY2:-5px;
        --moveX3:-3px;
        --moveY3:7px;
        left:8%;
        top:12%;
        ">
    </div>


    <div
        class="star"
        style="
        --size:34px;
        --color:#F7C6C7;
        --duration:9s;
        --moveX1:5px;
        --moveY1:-4px;
        --moveX2:-7px;
        --moveY2:6px;
        --moveX3:4px;

    <div
        class="star"

    <div
        class="star"

        --moveY2:-5px;

    <div
        class="star"

    <div
        class="star"
        style="

        ">
    </div>


    <div
        class="star"
        style="
        --size:46px;

        --duration:12s;
        --moveX1:-6px;
        --moveY1:4px;
        --moveX2:6px;
        --moveY2:-6px;
        --moveX3:-4px;
        --moveY3:5px;
        left:42%;

        ">
    </div>


    <div
        class="star"
        style="
        --size:42px;
        --color:#F7C6C7;
        --duration:10s;
        --moveX1:5px;
        --moveY1:-5px;
        --moveX2:-7px;

        right:40%;

        ">
    </div>


    <!-- LOGIN -->

        <h1>

            clue: tanggal lahir pemilik website
        </p>

            id="password"
            class="password-input"
            type="password"
            placeholder="enter password"
            onfocus="this.placeholder=''"
            onblur="if(this.value==='') this.placeholder='enter password'"
        >

        <button

        </button>

</section>



<!-- =====================================================
     PAGE B1
===================================================== -->

<section
    id="pageB1"
    class="page"
    style="display:none;"
>


    <!-- BACK -->

    <button
        class="back-button"
        onclick="goToPage1()"
    >
        BACK
    </button>


    <!-- TITLE -->

    <h1
        id="birthdayTitle"
        class="birthday-title"
    ></h1>


    <!-- PHOTO -->

    <div
        id="birthdayPhotoStage"
        class="birthday-photo-wrapper"
    >

        <img
            src="BIRTHDAY.PNG"
            alt="Birthday photo"
            class="birthday-photo"
        >

    </div>


    <!-- LETTER BUTTON -->

    <button
        class="birthday-letter-button"
        onclick="openBirthdayLetter()"
    >
        click here to read YOUR BIRTHDAY LETTER from Alya Audinar
    </button>


</section>



<!-- =====================================================
     PAGE 2
===================================================== -->

<section
    id="page2"
    class="page"
    style="display:none;"
>


    <button
        class="back-button"
        onclick="goToPage1()"
    >
        BACK
    </button>


    <h1>
        PAGE 2
    </h1>


    <p>
        OG LETTER page akan kita buat di tahap berikutnya.
    </p>

</section>



<script>


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const page1 =
    document.getElementById("page1");

const pageB1 =
    document.getElementById("pageB1");

const page2 =
    document.getElementById("page2");



/* =====================================================
   PASSWORD
===================================================== */

function checkPassword() {

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    /* PASSWORD 20061215 */

    if (password === "20061215") {

        message.innerText = "";

        showB1();

        return;
    }


    /* PASSWORD 24122006 */

    if (password === "24122006") {

        message.innerText = "";

        showPage2();

        return;
    }


    /* WRONG */

    message.innerText =
        "coba lagi ...";
}



/* =====================================================
   SHOW B1
===================================================== */

function showB1() {

    page1.style.display =
        "none";

    page2.style.display =
        "none";

    pageB1.style.display =
        "flex";


    startBirthdayTitle();

    createBirthdayConfetti();

}



/* =====================================================
   SHOW PAGE 2
===================================================== */

function showPage2() {

    page1.style.display =
        "none";

    pageB1.style.display =
        "none";

    page2.style.display =
        "flex";
}



/* =====================================================
   BACK
===================================================== */

function goToPage1() {

    pageB1.style.display =
        "none";

    page2.style.display =
        "none";

    page1.style.display =
        "flex";


    document.getElementById("password").value =
        "";

    document.getElementById("message").innerText =
        "";
}



/* =====================================================
   BIRTHDAY TITLE
===================================================== */

function startBirthdayTitle() {

    const title =
        "SELAMAT ULANG TAHUN JAFAR";

    const element =
        document.getElementById("birthdayTitle");


    element.innerHTML = "";


    [...title].forEach(
        (letter, index) => {

            const span =
                document.createElement("span");

            span.classList.add(
                "title-letter"
            );


            span.innerText =
                letter === " "
                ? "\u00A0"
                : letter;


            span.style.animationDelay =
                (index * 0.08) + "s";


            element.appendChild(span);

        }
    );

}



/* =====================================================
   CREATE BIRTHDAY CONFETTI
===================================================== */

function createBirthdayConfetti() {

    const stage =
        document.getElementById(
            "birthdayPhotoStage"
        );


    const colors = [

        "#F6E7A1",
        "#F7C6C7",
        "#C6DEF1",
        "#C9E4C5",
        "#E2C6F1",
        "#F9D5A7"

    ];


    const count = 80;


    for (
        let i = 0;
        i < count;
        i++
    ) {


        const confetti =
            document.createElement("div");


        confetti.classList.add(
            "confetti"
        );


        /* COLOR */

        const color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        confetti.style.setProperty(
            "--color",
            color
        );


        /* DIRECTION */

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            170 +
            Math.random() * 250;


        const x =
            Math.cos(angle) *
            distance;


        const y =
            Math.sin(angle) *
            distance;


        confetti.style.setProperty(
            "--x",
            x + "px"
        );


        confetti.style.setProperty(
            "--y",
            y + "px"
        );


        /* SIZE */

        confetti.style.setProperty(
            "--width",
            (8 + Math.random() * 9) +
            "px"
        );


        confetti.style.setProperty(
            "--height",
            (12 + Math.random() * 13) +
            "px"
        );


        /* SCALE */

        confetti.style.setProperty(
            "--scale",
            1.3 +
            Math.random() * 1.5
        );


        /* ROTATION */

        confetti.style.setProperty(
            "--rotation",
            (
                Math.random() *
                720 -
                360
            ) + "deg"
        );


        /* ANIMATION */

        confetti.style.setProperty(
            "--duration",
            (3.5 +
            Math.random() * 1.5) +
            "s"
        );


        confetti.style.setProperty(
            "--delay",
            Math.random() * 0.4 +
            "s"
        );


        stage.appendChild(
            confetti
        );

    }

}



/* =====================================================
   OPEN BIRTHDAY LETTER
===================================================== */

function openBirthdayLetter() {

    /*
       GANTI LINK INI NANTI DENGAN
       LINK GOOGLE DRIVE SURAT BIRTHDAY
    */

    window.location.href =
        "https://drive.google.com/";

}



/* =====================================================
   ENTER KEY SUPPORT
===================================================== */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                checkPassword();

            }

        }
    );


</script>
