<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday Jafar</title>


    <!-- GOOGLE FONT: POPPINS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
        rel="stylesheet"
    >


    <style>


        /* =====================================================
           BODY
        ===================================================== */

        body {

            margin: 0;

            min-height: 100vh;

            background: #f7f5f2;

            font-family: 'Poppins', sans-serif;

            overflow: hidden;

        }



        /* =====================================================
           BIRTHDAY PAGE
        ===================================================== */

        .birthday-page {

            position: relative;

            width: 100vw;

            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            overflow: hidden;

        }



        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {

            position: fixed;

            top: 20px;

            left: 20px;

            z-index: 1000;

            width: auto;

            margin: 0;

            padding: 8px 16px;

            border: none;

            border-radius: 8px;

            background: rgba(54, 69, 79, 0.70);

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease;

        }


        .back-button:hover {

            background: rgba(54, 69, 79, 0.90);

            transform: scale(1.08);

        }



        /* =====================================================
           BIRTHDAY TITLE

           NAVY
           BLACK SHADOW
           NO YELLOW SHADOW
        ===================================================== */

        .birthday-title {

            position: relative;

            z-index: 20;

            margin: 0 20px 25px 20px;

            font-family: 'Poppins', sans-serif;

            font-size: clamp(28px, 5vw, 50px);

            font-weight: 700;

            line-height: 1.2;

            text-align: center;

            /*
                NAVY
            */

            color: #001F3F;

            /*
                BLACK SHADOW ONLY
                NO BLUR
                20% OPACITY
            */

            text-shadow:
                4px 4px 0 rgba(0, 0, 0, 0.20) !important;

            opacity: 0;

            transform: scale(0.3);

            animation:
                birthdayTitlePop
                1.5s
                0.1s
                cubic-bezier(0.34, 1.56, 0.64, 1)
                forwards;

        }


        @keyframes birthdayTitlePop {

            0% {

                opacity: 0;

                transform:
                    scale(0.3)
                    rotate(-5deg);

            }

            60% {

                opacity: 1;

                transform:
                    scale(1.12)
                    rotate(2deg);

            }

            80% {

                transform:
                    scale(0.94)
                    rotate(-1deg);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);

            }

        }



        /* =====================================================
           PHOTO CONTAINER
        ===================================================== */

        .birthday-photo-container {

            position: relative;

            z-index: 10;

            display: flex;

            justify-content: center;

            align-items: center;

            /*
                DIBESARKAN
            */

            width: min(92vw, 650px);

            height: min(62vh, 600px);

        }



        /* =====================================================
           BIRTHDAY PHOTO

           NO WHITE BACKGROUND
           NO BORDER
           NO SHADOW
        ===================================================== */

        .birthday-photo {

            position: relative;

            z-index: 10;

            display: block;

            /*
                LEBIH BESAR
            */

            width: min(85vw, 520px);

            max-width: 100%;

            max-height: 100%;

            height: auto;

            object-fit: contain;

            background: transparent !important;

            border: none !important;

            box-shadow: none !important;

            /*
                HEARTBEAT
            */

            animation:
                photoHeartbeat
                2.2s
                ease-in-out
                infinite;

        }


        @keyframes photoHeartbeat {

            0% {

                transform: scale(1);

            }

            15% {

                transform: scale(1.05);

            }

            30% {

                transform: scale(0.98);

            }

            45% {

                transform: scale(1.07);

            }

            60% {

                transform: scale(1);

            }

            100% {

                transform: scale(1);

            }

        }



        /* =====================================================
           BIRTHDAY LETTER BUTTON
        ===================================================== */

        .birthday-letter-button {

            position: relative;

            z-index: 50;

            width: auto;

            max-width: 90%;

            margin-top: 15px;

            padding: 15px 28px;

            border: none;

            border-radius: 10px;

            /*
                NAVY BOX
                50% OPACITY
            */

            background:
                rgba(0, 31, 63, 0.50);

            /*
                WHITE TEXT
            */

            color: #FFFFFF;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 700;

            line-height: 1.5;

            text-align: center;

            cursor: pointer;

            /*
                BUTTON SHADOW
            */

            box-shadow:
                5px 5px 0 rgba(0, 0, 0, 0.25);

            /*
                IMPORTANT:
                TEXT SHADOW DIHAPUS TOTAL
            */

            text-shadow: none !important;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

        }



        /* =====================================================
           BUTTON HOVER

           MEMBESAR
           LEBIH TEBAL
           TEXT TETAP TANPA SHADOW
        ===================================================== */

        .birthday-letter-button:hover {

            background:
                rgba(0, 31, 63, 0.75);

            transform:
                scale(1.10);

            font-weight: 700;

            box-shadow:
                6px 6px 0 rgba(0, 0, 0, 0.30);

            /*
                TETAP TANPA TEXT SHADOW
            */

            text-shadow: none !important;

        }



        /* =====================================================
           CONFETTI
        ===================================================== */

        .confetti {

            position: absolute;

            top: 50%;

            left: 50%;

            width: 10px;

            height: 16px;

            border-radius: 2px;

            z-index: 5;

            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(0.2);

            /*
                TERUS BERGERAK
                SELAMA B1 TERBUKA
            */

            animation:
                confettiBurst
                var(--duration)
                var(--delay)
                cubic-bezier(0.12, 0.8, 0.2, 1)
                infinite alternate;

        }



        /* =====================================================
           CONFETTI BURST
        ===================================================== */

        @keyframes confettiBurst {

            0% {

                transform:
                    translate(-50%, -50%)
                    translate(0, 0)
                    scale(0.2)
                    rotate(0deg);

            }

            25% {

                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--tx) * 0.45),
                        calc(var(--ty) * 0.45)
                    )
                    scale(1.3)
                    rotate(var(--rot1));

            }

            55% {

                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--tx) * 0.75),
                        calc(var(--ty) * 0.75)
                    )
                    scale(1.8)
                    rotate(var(--rot2));

            }

            100% {

                transform:
                    translate(-50%, -50%)
                    translate(var(--tx), var(--ty))
                    scale(var(--scale))
                    rotate(var(--rot3));

            }

        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .birthday-title {

                font-size: 30px;

            }


            .birthday-photo-container {

                width: 94vw;

                height: 55vh;

            }


            .birthday-photo {

                width: 88vw;

            }


            .birthday-letter-button {

                max-width: 88%;

                font-size: 13px;

                padding: 13px 18px;

            }

        }


    </style>

</head>



<body>


    <div class="birthday-page">


        <!-- =================================================
             BACK
        ================================================= -->

        <button
            class="back-button"
            onclick="history.back()"
        >

            BACK

        </button>



        <!-- =================================================
             TITLE
        ================================================= -->

        <h1 class="birthday-title">

            SELAMAT ULANG TAHUN JAFAR!!!

        </h1>



        <!-- =================================================
             PHOTO
        ================================================= -->

        <div
            class="birthday-photo-container"
            id="photoContainer"
        >

            <img
                src="BIRTHDAY.PNG"
                alt="Birthday photo"
                class="birthday-photo"
            >

        </div>



        <!-- =================================================
             LETTER BUTTON
        ================================================= -->

        <button
            class="birthday-letter-button"
            onclick="openBirthdayLetter()"
        >

            CLICK HERE TO READ YOUR BIRTHDAY LETTER
            FROM ALYA AUDINAR

        </button>


    </div>



    <script>


        /* =====================================================
           PASTEL COLORS
        ===================================================== */

        const pastelColors = [

            "#F6E7A1",

            "#F7C6C7",

            "#C6DEF1",

            "#C9E4C5",

            "#E2C6F1",

            "#F9D5A7",

            "#FFD6A5",

            "#BDE0FE"

        ];



        /* =====================================================
           CREATE CONFETTI
        ===================================================== */

        function createConfetti() {


            const page =
                document.querySelector(".birthday-page");


            /*
                BANYAK CONFETTI
            */

            const count = 120;


            for (
                let i = 0;
                i < count;
                i++
            ) {


                const confetti =
                    document.createElement("div");


                confetti.classList.add(
                    "confetti"
                );



                /* COLOR */

                const color =
                    pastelColors[
                        Math.floor(
                            Math.random()
                            *
                            pastelColors.length
                        )
                    ];


                confetti.style.background =
                    color;



                /* RANDOM ANGLE */

                const angle =
                    Math.random()
                    *
                    Math.PI
                    *
                    2;



                /* LARGER SPREAD */

                const distance =
                    250
                    +
                    Math.random()
                    *
                    450;



                const tx =
                    Math.cos(angle)
                    *
                    distance;


                const ty =
                    Math.sin(angle)
                    *
                    distance;



                confetti.style.setProperty(
                    "--tx",
                    tx + "px"
                );


                confetti.style.setProperty(
                    "--ty",
                    ty + "px"
                );



                /* SCALE */

                const scale =
                    1.2
                    +
                    Math.random()
                    *
                    2.3;


                confetti.style.setProperty(
                    "--scale",
                    scale
                );



                /* ROTATION */

                const rot1 =
                    (
                        Math.random()
                        *
                        360
                    ) + "deg";


                const rot2 =
                    (
                        Math.random()
                        *
                        720
                    ) + "deg";


                const rot3 =
                    (
                        Math.random()
                        *
                        1080
                    ) + "deg";


                confetti.style.setProperty(
                    "--rot1",
                    rot1
                );


                confetti.style.setProperty(
                    "--rot2",
                    rot2
                );


                confetti.style.setProperty(
                    "--rot3",
                    rot3
                );



                /* SIZE */

                const width =
                    7
                    +
                    Math.random()
                    *
                    9;


                const height =
                    10
                    +
                    Math.random()
                    *
                    14;


                confetti.style.width =
                    width + "px";


                confetti.style.height =
                    height + "px";



                /* SPEED */

                const duration =
                    3
                    +
                    Math.random()
                    *
                    4;


                confetti.style.setProperty(
                    "--duration",
                    duration + "s"
                );



                /* DELAY */

                const delay =
                    Math.random()
                    *
                    3;


                confetti.style.setProperty(
                    "--delay",
                    delay + "s"
                );



                page.appendChild(
                    confetti
                );

            }

        }



        /* =====================================================
           OPEN BIRTHDAY LETTER
        ===================================================== */

        function openBirthdayLetter() {

            /*
                GANTI DENGAN LINK PDF BIRTHDAY
            */

            window.location.href =
                "PASTE_LINK_DRIVE_BIRTHDAY_DI_SINI";

        }



        /* =====================================================
           START CONFETTI
        ===================================================== */

        createConfetti();


    </script>


</body>

</html>
