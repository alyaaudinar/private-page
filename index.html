        /* PIRINGAN HITAM — VINYL.PNG */

        .vinyl-photo {
            position: relative;

            z-index: 100;

            margin: auto 0;

            width: min(330px, 70vw);

            height: auto;

            display: block;

            cursor: pointer;

            opacity: 0;

            transform: scale(0.2);

            animation:
                vinylPop
                0.9s
                cubic-bezier(0.22, 1.4, 0.4, 1)
                forwards;
        }

        .vinyl-photo.spinning {
            opacity: 1;

            transform: none;

            animation:
                vinylSpin
                14s
                linear
                infinite;
        }

        .vinyl-photo.fade-away {
            animation:
                letterPhotoFade
                0.6s
                ease
                forwards;
        }

        @keyframes vinylPop {

            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-40deg);
            }

            60% {
                opacity: 1;
                transform: scale(1.1) rotate(10deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes vinylSpin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }


        /* FOTO LETTER.PNG */

        .letter-photo {
            position: relative;

            z-index: 100;

            margin: auto 0;

            width: min(420px, 80vw);

            height: auto;

            display: block;

            cursor: pointer;

            opacity: 0;

            transform: scale(0.2);

            animation:
                letterPhotoPop
                0.9s
                cubic-bezier(0.22, 1.4, 0.4, 1)
                forwards;
        }

        .letter-photo.beating {
            opacity: 1;

            transform: scale(1);

            animation:
                heartbeat
                2.2s
                ease-in-out
                infinite;
        }

        .letter-photo.fade-away {
            animation:
                letterPhotoFade
                0.5s
                ease
                forwards;
        }

        @keyframes letterPhotoPop {

            0% {
                opacity: 0;
                transform: scale(0.2);
            }

            60% {
                opacity: 1;
                transform: scale(1.1);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes letterPhotoFade {

            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        .special-paper {
            position: relative;

            z-index: 100;

            margin: auto 0;

            width: min(720px, 92vw);

            padding: 45px 45px 40px;

                0.8s
                ease

        @keyframes paperFadeGrow {

            0% {
                opacity: 0;
                transform: scale(0.75);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }

            animation:

       async function hashPassword(text) {
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
}


async function decodePrivateData(password) {

    const response =
        await fetch(
            "private-data.enc.json",
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error("Encrypted data gagal dimuat.");
    }

    const encrypted =
        await response.json();

    function b64(value) {
        const binary = atob(value);
        const bytes =
            new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
            bytes[i] =
                binary.charCodeAt(i);
        }

        return bytes;
    }

    const keyMaterial =
        await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

    const key =
        await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: b64(encrypted.salt),
                iterations: 310000,
                hash: "SHA-256"
            },
            keyMaterial,
            {
                name: "AES-GCM",
                length: 256
            },
            false,
            ["decrypt"]
        );

    const data = b64(encrypted.data);
    const tag = b64(encrypted.tag);

    const combined =
        new Uint8Array(
            data.length + tag.length
        );

    combined.set(data);
    combined.set(tag, data.length);

    const decrypted =
        await crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: b64(encrypted.iv),
                tagLength: 128
            },
            key,
            combined
        );

    const payload =
        JSON.parse(
            new TextDecoder().decode(decrypted)
        );

    document.body.insertAdjacentHTML(
        "beforeend",
        payload.html
    );

    const script =
        document.createElement("script");

    script.textContent =
        payload.js;

    document.body.appendChild(script);
}


async function checkPassword() {

    const password =
        document
            .getElementById("password")
            .value
            .trim();

    const hashedPassword =
        await hashPassword(password);

    if (
        hashedPassword ===
        "48b41a01d75ecc839f0a8c658bc4354426cd991a8eb623a48f0d8efbfcbb0439"
    ) {

        try {

            await decodePrivateData(password);

            showPage("x1");

        } catch (error) {

            console.error(error);

            showWrongPasswordPopup();
        }

        return;
    }

    if (
        hashedPassword ===
        "f7ad7f20ade9a977c779590638c3a30c05230681260fdd9376be6279a397fd78"
    ) {

        showPage("page1");

        return;
    }

    showWrongPasswordPopup();
}


/* =====================================================
   WRONG PASSWORD POPUP
===================================================== */

function showWrongPasswordPopup() {

    // Cegah popup menumpuk kalau tombol ditekan berulang
    if (document.querySelector(".error-overlay")) {
        return;
    }

    // Buat overlay
    const overlay =
        document.createElement("div");

    overlay.className =
        "error-overlay";

    // Buat isi popup
    const content =
        document.createElement("div");

    content.className =
        "error-content";

    // Foto KUMIMARAH
    const image =
        document.createElement("img");

    image.src =
        "KUMIMARAH.PNG";

    image.alt =
        "Password Salah";

    // Tulisan SALAH!
    const title =
        document.createElement("div");

    title.className =
        "error-title";

    title.innerText =
        "SALAH!";

    content.appendChild(image);
    content.appendChild(title);

    // Buat burst tanda tanya
    for (let i = 0; i < 12; i++) {

        const question =
            document.createElement("span");

        question.className =
            "question-mark";

        question.innerText =
            "?";

        const angle =
            (Math.PI * 2 / 12) * i;

        const distance =
            90 + Math.random() * 80;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        question.style.setProperty(
            "--tx",
            x + "px"
        );

        question.style.setProperty(
            "--ty",
            y + "px"
        );

        question.style.setProperty(
            "--rot",
            (-35 + Math.random() * 70) + "deg"
        );

        content.appendChild(question);
    }

    overlay.appendChild(content);

    document.body.appendChild(overlay);

    // Setelah 1.5 detik, mulai fade out
    setTimeout(function () {

        overlay.classList.add("fade-out");

        // Setelah fade out selesai, hapus popup & kembali ke Home
        setTimeout(function () {

            overlay.remove();

            document
                .getElementById("password")
                .value = "";

            document
                .getElementById("message")
                .innerText = "";

            showPage("home");

        }, 600);

    }, 1500);
}

                confetti.style.setProperty(

                );

                confetti.style.setProperty(
                    "--y",
                    y + "px"

                confetti.style.setProperty(

        /* =====================================================
           TYPEWRITER
        ===================================================== */

        function runTypewriter(element, text, duration, onFinish) {

            // Hentikan ketikan sebelumnya kalau ada
            if (element.typingTimer) {

                clearInterval(element.typingTimer);

            }


            element.innerText = "";


            let index = 0;


            const speed =
                Math.max(
                    12,
                    Math.round(duration / text.length)
                );


            element.typingTimer =
                setInterval(
                    function () {

                        index++;

                        element.innerText =
                            text.slice(0, index);


                        if (index >= text.length) {

                            clearInterval(element.typingTimer);

                            element.typingTimer = null;


                            if (onFinish) {

                                onFinish();

                            }

                        }

                    },
                    speed
                );

        }

        /* =====================================================
           ADD SONG

           Pencarian memakai iTunes Search API (gratis, tanpa
           kunci) lewat JSONP supaya bisa jalan dari website
           statis. Hasilnya: judul, penyanyi, cover, dan
           preview 30 detik. Tombol di surat membuka lagu
           yang sama di Spotify.
        ===================================================== */

        window.selectedSong = null;

        let songSearchToken = 0;

        let songTypingTimer = null;

        let viralSongs = [];

        let viralTitles = new Set();


        /* =====================================================
           CHART LAGU TERPOPULER (Apple Music Indonesia)
        ===================================================== */

        async function loadViralSongs() {

            if (viralSongs.length > 0) {

                return;

            }


            try {

                const response =
                    await fetch(
                        "https://rss.applemarketingtools.com/api/v2/id/music/most-played/25/songs.json"
                    );


                const data = await response.json();


                const results =
                    (data.feed && data.feed.results) || [];


                viralSongs = results.map(function (item) {

                    return {

                        id: item.id,

                        title: item.name || "",

                        artist: item.artistName || "",

                        artwork:
                            (item.artworkUrl100 || "")
                                .replace("100x100", "300x300")

                    };

                });


                viralSongs.forEach(function (song) {

                    viralTitles.add(song.title.toLowerCase());

                });

            } catch (error) {

                console.error(error);

            }

        }


        /* =====================================================
           TAMPILKAN REKOMENDASI LAGU VIRAL
        ===================================================== */

        function showViralSongs() {

            const container =
                document.getElementById("songSearchResults");


            if (viralSongs.length === 0) {

                container.innerHTML = "";

                return;

            }


            container.innerHTML =
                '<p class="song-section-label">SEDANG VIRAL</p>';


            viralSongs.slice(0, 8).forEach(function (song, index) {

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className = "song-result";


                button.innerHTML =
                    '<span class="song-rank">' +
                    (index + 1) +
                    '</span>' +
                    (song.artwork
                        ? '<img src="' + song.artwork + '" alt="">'
                        : '') +
                    '<span class="song-result-info">' +
                    '<span class="song-result-title">' +
                    escapeHTML(song.title) +
                    '</span>' +
                    '<span class="song-result-artist">' +
                    escapeHTML(song.artist) +
                    '</span>' +
                    '</span>';


                button.onclick = function () {

                    pickViralSong(song);

                };


                container.appendChild(button);

            });

        }


        /* =====================================================
           PILIH LAGU VIRAL — ambil preview lewat lookup
        ===================================================== */

        function pickViralSong(song) {

            const callbackName =
                "songLookup_" + song.id;


            const script =
                document.createElement("script");


            let finished = false;


            window[callbackName] = function (data) {

                finished = true;


                const found =
                    (data.results && data.results[0]) || null;


                chooseSong({

                    title: song.title,

                    artist: song.artist,

                    artwork: song.artwork,

                    preview: found ? (found.previewUrl || "") : ""

                });


                delete window[callbackName];

                script.remove();

            };


            script.onerror = function () {

                finished = true;

                chooseSong({

                    title: song.title,

                    artist: song.artist,

                    artwork: song.artwork,

                    preview: ""

                });

                delete window[callbackName];

                script.remove();

            };


            script.src =
                "https://itunes.apple.com/lookup?id=" +
                encodeURIComponent(song.id) +
                "&callback=" +
                callbackName;


            document.body.appendChild(script);


            setTimeout(function () {

                if (!finished) {

                    script.onerror();

                }

            }, 5000);

        }

        /* =====================================================
           CARI LAGU
        ===================================================== */

        function searchSong(isLive) {

            const keyword =
                document
                    .getElementById("songSearchInput")
                    .value
                    .trim();


            // Permintaan terbaru menang, hasil lama diabaikan
            songSearchToken++;

            const token = songSearchToken;


            if (!keyword) {

                if (isLive) {

                    showViralSongs();

                } else {

                    showSongStatus("Masukkan nama lagu terlebih dahulu.");

                }

                return;

            }


            // Saat mengetik, tunggu minimal 2 huruf
            if (isLive && keyword.length < 2) {

                showViralSongs();

                return;

            }


            showSongStatus("mencari lagu...");


            // JSONP — menghindari masalah CORS
            const callbackName =
                "songCallback_" + token;


            const script =
                document.createElement("script");


            let finished = false;


            window[callbackName] = function (data) {

                finished = true;

                // Abaikan kalau sudah ada pencarian yang lebih baru
                if (token === songSearchToken) {

                    showSongResults(data.results || [], keyword);

                }

                delete window[callbackName];

                script.remove();

            };


            script.onerror = function () {

                finished = true;

                if (token === songSearchToken) {

                    showSongStatus("gagal mencari lagu, coba lagi.");

                }

                delete window[callbackName];

                script.remove();

            };


            script.src =
                "https://itunes.apple.com/search?term=" +
                encodeURIComponent(keyword) +
                "&entity=song&country=ID&limit=20&callback=" +
                callbackName;


            document.body.appendChild(script);


            // Batas waktu kalau jaringan menggantung
            setTimeout(function () {

                if (!finished) {

                    if (token === songSearchToken) {

                        showSongStatus("gagal mencari lagu, coba lagi.");

                    }

                    delete window[callbackName];

                    script.remove();

                }

            }, 8000);

        }


        /* =====================================================
           TAMPILKAN HASIL PENCARIAN
        ===================================================== */

        function showSongResults(results, keyword) {

            const container =
                document.getElementById("songSearchResults");


            if (results.length === 0) {

                showSongStatus("lagu tidak ditemukan.");

                return;

            }


            const key =
                (keyword || "").toLowerCase();


            // Skor: lagu viral naik ke atas, lalu kecocokan judul
            const ranked =
                results
                    .map(function (item, order) {

                        const title =
                            (item.trackName || "").toLowerCase();

                        let score = 0;


                        if (viralTitles.has(title)) {

                            score += 6;

                        }


                        if (title === key) {

                            score += 4;

                        } else if (title.indexOf(key) === 0) {

                            score += 2;

                        } else if (title.indexOf(key) !== -1) {

                            score += 1;

                        }


                        return {
                            item: item,
                            score: score,
                            order: order
                        };

                    })
                    .sort(function (a, b) {

                        if (b.score !== a.score) {

                            return b.score - a.score;

                        }

                        return a.order - b.order;

                    })
                    .slice(0, 8);


            container.innerHTML = "";


            ranked.forEach(function (entry) {

                const item = entry.item;


                const song = {

                    title: item.trackName || "",

                    artist: item.artistName || "",

                    artwork:
                        (item.artworkUrl100 || "")
                            .replace("100x100", "200x200"),

                    preview: item.previewUrl || ""

                };


                const button =
                    document.createElement("button");

                button.type = "button";

                button.className = "song-result";


                button.innerHTML =
                    (song.artwork
                        ? '<img src="' + song.artwork + '" alt="">'
                        : '') +
                    '<span class="song-result-info">' +
                    '<span class="song-result-title">' +
                    escapeHTML(song.title) +
                    '</span>' +
                    '<span class="song-result-artist">' +
                    escapeHTML(song.artist) +
                    '</span>' +
                    '</span>';


                button.onclick = function () {

                    chooseSong(song);

                };


                container.appendChild(button);

            });

        }

        /* =====================================================
           FORMAT DATE
        ===================================================== */

        function formatDate(dateString) {

            const parts =
                dateString.split("-");


            if (parts.length !== 3) {

                return dateString;

            }


            return (
                parts[2] +
                "/" +
                parts[1] +
                "/" +
                parts[0]
            );

        }

                    '</a>' +
                    '</span>';


                songBox.classList.add("show");

            } else {

                songBox.innerHTML = "";

                songBox.classList.remove("show");

            }


            document
                .getElementById("letterModal")
                .classList
                .add("active");

        }


        /* =====================================================
           CLOSE LETTER
        ===================================================== */

        function closeLetter() {

            // Hentikan preview lagu kalau sedang diputar
            const audio =
                document
                    .getElementById("modalSong")
                    .querySelector("audio");


            if (audio) {

                audio.pause();

            }


            document
                .getElementById("letterModal")
                .classList
                .remove("active");

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHTML(text) {

            const div =
                document.createElement("div");


            div.innerText =
                text;


            return div.innerHTML;

        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        createStars();

    </script>

    <!-- =====================================================
         FIREBASE — 
         
    ===================================================== -->

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            query,
            orderBy,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


        /* =====================================================
           KONFIGURASI FIREBASE

           Ganti seluruh nilai "PASTE_..." dengan config dari
           Firebase Console milikmu.
        ===================================================== */

        const firebaseConfig = {
            apiKey:            "AIzaSyBneMxQUXpdQGsPbX2BWmBa7xzNyoSbqKI",
            authDomain:        "letter-f6b9f.firebaseapp.com",
            projectId:         "letter-f6b9f",
            storageBucket:     "letter-f6b9f.firebasestorage.app",
            messagingSenderId: "113568950076",
            appId:             "1:113568950076:web:743ed1c2af2318c3b12039"
        };


        const isConfigured =
            !JSON.stringify(firebaseConfig).includes("PASTE_");


        let lettersCache = [];

        let isLoaded = false;

        let db = null;


        /* =====================================================
           PESAN DI DAFTAR SURAT
        ===================================================== */

        function showListMessage(message) {

            const container =
                document.getElementById("lettersContainer");


            if (!container) {

                return;

            }


            container.innerHTML =
                '<p style="text-align:center; color:#80694F;' +
                ' font-family:Georgia, serif;">' +
                message +
                '</p>';

        }


        /* =====================================================
           TAMPILKAN DAFTAR SURAT
        ===================================================== */

        function renderLetters() {

            const container =
                document.getElementById("lettersContainer");


            if (!container) {

                return;

            }


            if (!isConfigured) {

                showListMessage(
                    "firebase belum diatur, surat belum bisa dibaca."
                );

                return;

            }


            if (!isLoaded) {

                showListMessage("memuat surat...");

                return;

            }


            if (lettersCache.length === 0) {

                showListMessage("belum ada random day letter.");

                return;

            }


            container.innerHTML = "";


            lettersCache.forEach(letter => {

                const button =
                    document.createElement("button");

                button.className =
                    "saved-letter-button";


                button.innerHTML =
                    '<span class="saved-letter-date">' +
                    window.formatDate(letter.date) +
                    '</span>' +
                    '<span class="saved-letter-name">' +
                    window.escapeHTML(letter.author) +
                    '</span>';


                button.onclick = function () {

                    window.openLetter(letter);

                };


                container.appendChild(button);

            });

        }


        /* =====================================================
           HUBUNGKAN KE FIRESTORE
        ===================================================== */

        if (isConfigured) {

            try {

                const app =
                    initializeApp(firebaseConfig);

                db = getFirestore(app);


                const lettersQuery =
                    query(
                        collection(db, "randomDayLetters"),
                        orderBy("createdAt", "desc")
                    );


                // Realtime: surat baru langsung muncul
                onSnapshot(
                    lettersQuery,
                    function (snapshot) {

                        lettersCache =
                            snapshot.docs.map(doc => doc.data());

                        isLoaded = true;

                        renderLetters();

                    },
                    function (error) {

                        console.error(error);

                        showListMessage(
                            "gagal memuat surat, coba muat ulang halaman."
                        );

                    }
                );

            } catch (error) {

                console.error(error);

            }

        }


        /* =====================================================
           LOAD LETTERS — dipanggil tombol di page L1
        ===================================================== */

        window.loadLetters = function () {

            renderLetters();

        };


        /* =====================================================
           SEND LETTER — simpan ke Firestore
        ===================================================== */

        window.sendLetter = async function () {

            const dateField =
                document.getElementById("letterDate");

            const timeField =
                document.getElementById("letterTime");

            const messageField =
                document.getElementById("letterMessage");

            const authorField =
                document.getElementById("letterAuthor");


            const date = dateField.value;
            const time = timeField.value;
            const message = messageField.value.trim();
            const author = authorField.value.trim();


            // Validasi
            if (!date || !time || !message || !author) {

                alert(
                    "Tolong isi semua bagian surat terlebih dahulu."
                );

                return;

            }


            if (!isConfigured || !db) {

                alert(
                    "Firebase belum diatur, surat belum bisa dikirim."
                );

                return;

            }


            const sendButton =
                document.querySelector(".send-letter-button");


            sendButton.disabled = true;

            sendButton.innerText = "MENGIRIM...";


            try {

                await addDoc(
                    collection(db, "randomDayLetters"),
                    {
                        date: date,
                        time: time,
                        message: message,
                        author: author,
                        song: window.selectedSong || null,
                        createdAt: serverTimestamp()
                    }
                );


                // Reset form
                dateField.value = "";
                timeField.value = "";
                messageField.value = "";
                authorField.value = "";

                window.clearSelectedSong();


                alert("Surat berhasil dikirim :D");


                window.showPage("pageLB1");

                renderLetters();

            } catch (error) {

                console.error(error);

                alert(
                    "Surat gagal dikirim, coba lagi sebentar."
                );

            } finally {

                sendButton.disabled = false;

                sendButton.innerText = "KIRIM";

            }

        };

    </script>

</body>

</html>
