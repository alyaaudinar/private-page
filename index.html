<style>

/* =====================================================
   B1 PAGE
===================================================== */

#pageB1 {

    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow: hidden;

    background: #f7f5f2;

}


/* =====================================================
   BACK BUTTON
===================================================== */

#pageB1 .back-button {

    position: fixed;

    top: 20px;
    left: 20px;

    width: auto;

    margin: 0;

    padding: 8px 18px;

    background: rgba(54, 69, 79, 0.65);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    z-index: 1000;

    transition:
        transform 0.25s ease,
        background 0.25s ease;

}


#pageB1 .back-button:hover {

    background: rgba(54, 69, 79, 0.9);

    transform: scale(1.08);

}


/* =====================================================
   TITLE
===================================================== */

.birthday-title {

    position: relative;

    z-index: 20;

    margin: 0 20px 25px 20px;

    font-family: 'Poppins', sans-serif;

    font-size: clamp(25px, 5vw, 48px);

    font-weight: 700;

    line-height: 1.2;

    text-align: center;

    color: #001F3F;

    text-shadow:
        2px 2px 0 #F6E7A1,
        4px 4px 0 rgba(0, 0, 0, 0.18);

}


/* =====================================================
   LETTER POPUP ANIMATION
===================================================== */

.birthday-title {

    opacity: 0;

    transform: scale(0.3);

    animation:
        titlePop
        1.5s
        0.2s
        cubic-bezier(0.34, 1.56, 0.64, 1)
        forwards;

}


@keyframes titlePop {

    0% {

        opacity: 0;

        transform:
            scale(0.3)
            rotate(-5deg);

    }

    60% {

        opacity: 1;

        transform:
            scale(1.12)
            rotate(2deg);

    }

    80% {

        transform:
            scale(0.94)
            rotate(-1deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


/* =====================================================
   PHOTO STAGE
===================================================== */

.birthday-stage {

    position: relative;

    width: min(650px, 90vw);

    height: min(500px, 55vh);

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: visible;

}


/* =====================================================
   BIRTHDAY PHOTO
===================================================== */

.birthday-photo {

    position: relative;

    z-index: 20;

    width: min(330px, 65vw);

    max-height: 420px;

    object-fit: contain;

    opacity: 0;

    transform:
        scale(0.3)
        rotate(-7deg);

    animation:

        photoAppear
        1.5s
        0.8s
        cubic-bezier(0.34, 1.56, 0.64, 1)
        forwards,

        heartbeat
        2.8s
        2.3s
        ease-in-out
        infinite;

    /* IMPORTANT:
       NO SHADOW */

    filter: none;

}


/* =====================================================
   PHOTO APPEAR
===================================================== */

@keyframes photoAppear {

    0% {

        opacity: 0;

        transform:
            scale(0.3)
            rotate(-7deg);

    }

    55% {

        opacity: 1;

        transform:
            scale(1.15)
            rotate(5deg);

    }

    75% {

        transform:
            scale(0.92)
            rotate(-3deg);

    }

    90% {

        transform:
            scale(1.05)
            rotate(2deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


/* =====================================================
   HEARTBEAT
===================================================== */

@keyframes heartbeat {

    0% {

        transform:
            scale(1);

    }

    10% {

        transform:
            scale(1.06);

    }

    20% {

        transform:
            scale(1);

    }

    30% {

        transform:
            scale(1.08);

    }

    45% {

        transform:
            scale(1);

    }

    100% {

        transform:
            scale(1);

    }

}


/* =====================================================
   CONFETTI
===================================================== */

.birthday-confetti {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 12px;
    height: 20px;

    border-radius: 2px;

    z-index: 5;

    pointer-events: none;

    opacity: 1;

    transform:
        translate(-50%, -50%)
        translate(0, 0)
        scale(0.2);

    animation:

        confettiBurst
        var(--burst-duration)
        var(--delay)
        cubic-bezier(0.12, 0.8, 0.2, 1)
        forwards,

        confettiFloat
        var(--float-duration)
        calc(
            var(--burst-duration) +
            var(--delay)
        )
        ease-in-out
        infinite alternate;

}


/* =====================================================
   CONFETTI BURST
===================================================== */

@keyframes confettiBurst {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(0, 0)
            scale(0.2)
            rotate(0deg);

    }

    25% {

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--tx) * 0.35),
                calc(var(--ty) * 0.35)
            )
            scale(0.9)
            rotate(
                calc(var(--rotation) * 0.25)
            );

    }

    55% {

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--tx) * 0.75),
                calc(var(--ty) * 0.75)
            )
            scale(1.5)
            rotate(
                calc(var(--rotation) * 0.65)
            );

    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(
                var(--tx),
                var(--ty)
            )
            scale(
                var(--final-scale)
            )
            rotate(
                var(--rotation)
            );

    }

}


/* =====================================================
   CONFETTI CONTINUOUS MOVEMENT
===================================================== */

@keyframes confettiFloat {

    0% {

        margin-left: 0px;

        margin-top: 0px;

    }

    25% {

        margin-left:
            var(--move-x1);

        margin-top:
            var(--move-y1);

    }

    50% {

        margin-left:
            var(--move-x2);

        margin-top:
            var(--move-y2);

    }

    75% {

        margin-left:
            var(--move-x3);

        margin-top:
            var(--move-y3);

    }

    100% {

        margin-left:
            var(--move-x4);

        margin-top:
            var(--move-y4);

    }

}


/* =====================================================
   LETTER BUTTON
===================================================== */

.birthday-letter-button {

    position: relative;

    z-index: 30;

    width: auto;

    max-width: 90%;

    margin: 25px 20px 0 20px;

    padding: 15px 25px;

    border: none;

    border-radius: 10px;

    /* 50% OPACITY */

    background: rgba(0, 32, 63, 0.50);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    line-height: 1.5;

    text-shadow:
        2px 2px 0 rgba(0, 0, 0, 0.45);

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease;

}


/* =====================================================
   BUTTON HOVER
===================================================== */

.birthday-letter-button:hover {

    background:
        rgba(0, 32, 63, 0.75);

    transform:
        scale(1.08);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .birthday-title {

        font-size: 27px;

    }


    .birthday-stage {

        height: 45vh;

    }


    .birthday-photo {

        width: 250px;

    }


    .birthday-letter-button {

        font-size: 13px;

        padding: 13px 18px;

    }

}

</style>



<script>

/* =====================================================
   CREATE BIRTHDAY CONFETTI
===================================================== */

function createBirthdayConfetti() {

    const stage =
        document.getElementById(
            "birthdayStage"
        );


    /* MORE + WIDER CONFETTI */

    const amount = 160;


    const colors = [

        "#F6E7A1",
        "#F7C6C7",
        "#C6DEF1",
        "#C9E4C5",
        "#E2C6F1",
        "#F9D5A7",
        "#FFF1B8",
        "#D8C4E8"

    ];


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const confetti =
            document.createElement(
                "div"
            );


        confetti.classList.add(
            "birthday-confetti"
        );


        /* RANDOM COLOR */

        confetti.style.background =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        /* =================================================
           RANDOM 360 DEGREE DIRECTION
        ================================================= */

        const angle =
            Math.random()
            * Math.PI
            * 2;


        /* =================================================
           MUCH LARGER DISTANCE
        ================================================= */

        const distance =
            250 +
            Math.random() * 450;


        const tx =
            Math.cos(angle)
            * distance;


        const ty =
            Math.sin(angle)
            * distance;


        confetti.style.setProperty(
            "--tx",
            tx + "px"
        );


        confetti.style.setProperty(
            "--ty",
            ty + "px"
        );


        /* =================================================
           FINAL SCALE
        ================================================= */

        confetti.style.setProperty(
            "--final-scale",
            1.3 +
            Math.random() * 2
        );


        /* =================================================
           ROTATION
        ================================================= */

        confetti.style.setProperty(
            "--rotation",
            (
                Math.random()
                * 1200
                - 600
            ) + "deg"
        );


        /* =================================================
           CONFETTI SIZE
        ================================================= */

        confetti.style.width =
            (
                8 +
                Math.random() * 10
            ) + "px";


        confetti.style.height =
            (
                12 +
                Math.random() * 16
            ) + "px";


        /* =================================================
           BURST SPEED
        ================================================= */

        const burstDuration =
            2.5 +
            Math.random() * 1.5;


        confetti.style.setProperty(
            "--burst-duration",
            burstDuration + "s"
        );


        /* =================================================
           DELAY
        ================================================= */

        const delay =
            Math.random() * 0.5;


        confetti.style.setProperty(
            "--delay",
            delay + "s"
        );


        /* =================================================
           CONTINUOUS MOVEMENT
        ================================================= */

        confetti.style.setProperty(
            "--float-duration",
            (
                3 +
                Math.random() * 4
            ) + "s"
        );


        confetti.style.setProperty(
            "--move-x1",
            (
                Math.random() * 30 - 15
            ) + "px"
        );


        confetti.style.setProperty(
            "--move-y1",
            (
                Math.random() * 30 - 15
            ) + "px"
        );


        confetti.style.setProperty(
            "--move-x2",
            (
                Math.random() * 50 - 25
            ) + "px"
        );


        confetti.style.setProperty(
            "--move-y2",
            (
                Math.random() * 50 - 25
            ) + "px"
        );


        confetti.style.setProperty(
            "--move-x3",
            (
                Math.random() * 40 - 20
            ) + "px"
        );


        confetti.style.setProperty(
            "--move-y3",
            (
                Math.random() * 40 - 20
            ) + "px"
        );


        confetti.style.setProperty(
            "--move-x4",
            (
                Math.random() * 60 - 30
            ) + "px"
        );


        confetti.style.setProperty(
            "--move-y4",
            (
                Math.random() * 60 - 30
            ) + "px"
        );


        /* ADD TO PAGE */

        stage.appendChild(
            confetti
        );

    }

}


/* =====================================================
   OPEN BIRTHDAY LETTER
===================================================== */

function openBirthdayLetter() {

    window.location.href =
        "MASUKKAN_LINK_DRIVE_BIRTHDAY_DISINI";

}


/* =====================================================
   BACK BUTTON
===================================================== */

function goBackB1() {

    if (
        typeof showPage ===
        "function"
    ) {

        showPage("login");

    }

}


/* =====================================================
   START
===================================================== */

setTimeout(
    function() {

        createBirthdayConfetti();

    },
    500
);

</script>
