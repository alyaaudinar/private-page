<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           POP-UP ERROR HOME
        ===================================================== */

        .error-overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 99999;
        }


        .error-content {
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            animation:
                popIn
                0.35s
                cubic-bezier(0.175, 0.885, 0.32, 1.275)
                forwards;
        }


        .error-content img {
            width: 180px;
            max-width: 75vw;
            height: auto;

            border-radius: 12px;

            box-shadow:
                0 8px 24px
                rgba(0, 0, 0, 0.5);

            object-fit: contain;
        }


        .error-title {
            color: #8F0B0B;

            font-size: 2.2rem;
            font-weight: 900;

            margin-top: 15px;

            letter-spacing: 3px;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.5);
        }


        /* =====================================================
           BURST TANDA TANYA
        ===================================================== */

        .question-mark {
            position: absolute;

            color: #8F0B0B;

            font-weight: 900;
            font-size: 2.5rem;

            pointer-events: none;
            user-select: none;

            text-shadow:
                0 0 6px
                rgba(143, 11, 11, 0.4);

            animation:
                burstOut
                0.85s
                cubic-bezier(0.25, 1, 0.5, 1)
                forwards;
        }


        @keyframes popIn {

            0% {
                transform: scale(0.4);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }


        @keyframes burstOut {

            0% {
                transform:
                    translate(0, 0)
                    scale(0.4)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translate(var(--tx), var(--ty))
                    scale(1.4)
                    rotate(var(--rot));

                opacity: 0;
            }

        }


        /* =====================================================
           BINTANG PAGE 3
        ===================================================== */

        #page3 {
            position: relative;
            overflow: hidden;
        }


        .star-bg {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 0;
        }


       .star {
    position: absolute;

    color: #DEC5A0;

    user-select: none;
    pointer-events: none;

    opacity: 0.8;

    animation:
        floatSlow
        var(--duration)
        ease-in-out
        infinite
        alternate;
}


@keyframes floatSlow {

    0% {
        transform:
            translateX(-20px)
            rotate(-8deg);
    }

    50% {
        transform:
            translateX(20px)
            rotate(8deg);
    }

    100% {
        transform:
            translateX(-20px)
            rotate(-8deg);
    }

}

        /* =====================================================
           RANDOM DAY LETTER BUTTON
        ===================================================== */

        .btn-random-letter {

            background-color: #B8A98A !important;

            color: #ffffff !important;

            border: none;
        }

    </style>

</head>
    <style>

        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f7f5f2;
            overflow: hidden;
        }


        /* =====================================================
           PAGE SYSTEM
        ===================================================== */

        .page {
            width: 100%;
            min-height: 100vh;

            display: none;

            position: relative;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .page.active {
            display: flex;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {
            position: fixed;

            top: 22px;
            left: 22px;

            z-index: 9999;

            padding: 0;

            border: none;
            background: transparent;

            color: #36454F;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;

            cursor: pointer;

            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.6);

            transition: 0.25s ease;
        }

        .back-button:hover {
            color: #14264A;
            transform: scale(1.12);
        }


        /* =====================================================
           HOME
        ===================================================== */

        #home {
            background: #f7f5f2;
        }

        .login-box {
            width: 90%;
            max-width: 400px;

            text-align: center;

            position: relative;
            z-index: 20;
        }

        .login-box h1 {
            margin-bottom: 10px;

            color: #333;

            font-size: 24px;
            font-weight: 700;
        }

        .clue {
            margin-bottom: 25px;

            color: #888;

            font-size: 14px;
        }

        .password-input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;

            text-align: center;

            font-family: 'Poppins', sans-serif;
            font-size: 15px;

            outline: none;
        }

        .unlock-button {
            width: 100%;

            margin-top: 12px;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #A6A6A6;

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .unlock-button:hover {
            background: #777;
            transform: scale(1.05);
        }

        #message {
            margin-top: 18px;

            color: #555;

            font-size: 14px;
        }


        /* =====================================================
           STARS
        ===================================================== */

        .star {
            position: fixed;

            width: var(--size);
            height: var(--size);

            left: var(--left);
            top: var(--top);

            background: var(--color);

            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );

            opacity: 0.65;

            pointer-events: none;

            animation:
                starMovement
                var(--duration)
                ease-in-out
                infinite
                alternate;
        }

        @keyframes starMovement {
            0% {
                transform:
                    translate(var(--x1), var(--y1))
                    rotate(0deg);
            }

            50% {
                transform:
                    translate(var(--x2), var(--y2))
                    rotate(8deg);
            }

            100% {
                transform:
                    translate(var(--x3), var(--y3))
                    rotate(-8deg);
            }
        }


        /* =====================================================
           B1 — BIRTHDAY PAGE
        ===================================================== */

        #pageB1 {
            background: #f7f5f2;

            flex-direction: column;

            text-align: center;

            position: relative;

            isolation: isolate;
        }


        /* B1 TITLE */

        .birthday-title {
            position: relative;

            z-index: 100;

            margin: 0 20px 25px;

            color: #3A488A;

            font-size: clamp(30px, 7vw, 58px);
            line-height: 1.2;

            font-weight: 700;

            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.20);
        }

        .birthday-title .letter {
            display: inline-block;

            opacity: 0;

            transform:
                translateY(25px)
                scale(0.4);

            animation:
                letterPopIn
                0.55s
                cubic-bezier(0.34, 1.56, 0.64, 1)
                forwards;
        }

        .birthday-title .letter.space {
            width: 0.3em;
        }

        @keyframes letterPopIn {

            0% {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.4);
            }

            70% {
                opacity: 1;

                transform:
                    translateY(-6px)
                    scale(1.15);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* B1 PHOTO */

        .birthday-photo {
            position: relative;

            z-index: 100;

            width: min(620px, 90vw);
            max-height: 58vh;

            height: auto;

            object-fit: contain;

            display: block;

            border: 10px solid white;

            background: white;

            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.28);

            opacity: 0;

            transform:
                scale(0.15)
                rotate(-14deg);

            animation:
                scrapbookPopIn
                0.9s
                cubic-bezier(0.22, 1.4, 0.4, 1)
                forwards;
        }

        .birthday-photo.settled {

            border: none;

            background: transparent;

            box-shadow: none;

            opacity: 1;

            transform:
                scale(1)
                rotate(0deg);

            animation:
                heartbeat
                2.2s
                ease-in-out
                infinite;
        }

        @keyframes scrapbookPopIn {

            0% {
                opacity: 0;

                transform:
                    scale(0.15)
                    rotate(-14deg);
            }

            60% {
                opacity: 1;

                transform:
                    scale(1.12)
                    rotate(4deg);
            }

            80% {
                transform:
                    scale(0.97)
                    rotate(-2deg);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);
            }
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.055);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.065);
            }

            100% {
                transform: scale(1);
            }
        }


        /* B1 BUTTON */

        .birthday-letter-button {
            position: relative;

            z-index: 120;

            margin-top: 30px;
            padding: 17px 27px;

            max-width: 90%;

            border: none;
            border-radius: 12px;

            background: rgba(20, 38, 70, 0.5);

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            text-align: center;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            text-shadow: none;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .birthday-letter-button:hover {
            transform: scale(1.10);

            background: rgba(20, 38, 70, 0.70);
        }


        /* B1 MUSIC PLAYER */

        .music-player {
            position: relative;

            z-index: 120;

            margin-top: 22px;
        }

        .music-toggle-button {
            padding: 13px 24px;

            border: none;
            border-radius: 30px;

            background: rgba(20, 38, 70, 0.5);

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .music-toggle-button:hover {
            transform: scale(1.08);

            background: rgba(20, 38, 70, 0.70);
        }


        /* =====================================================
           CONFETTI
        ===================================================== */

        .confetti {
            position: fixed;

            left: 50%;
            top: 50%;

            width: var(--width);
            height: var(--height);

            background: var(--color);

            border-radius: 2px;

            z-index: 20;

            pointer-events: none;

            animation:
                confettiMovement
                var(--duration)
                cubic-bezier(0.15, 0.8, 0.2, 1)
                infinite
                alternate;
        }

        @keyframes confettiMovement {

            0% {
                transform:
                    translate(-50%, -50%)
                    translate(0, 0)
                    rotate(0deg)
                    scale(0.35);
            }

            45% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--x) * 0.55),
                        calc(var(--y) * 0.55)
                    )
                    rotate(calc(var(--rotation) * 0.45))
                    scale(1.05);
            }

            75% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--x) * 0.85),
                        calc(var(--y) * 0.85)
                    )
                    rotate(calc(var(--rotation) * 0.8))
                    scale(1.45);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        var(--x),
                        var(--y)
                    )
                    rotate(var(--rotation))
                    scale(1.75);
            }
        }


        /* =====================================================
           PAGE 1 — OG LETTER (PAGE 2)
        ===================================================== */

        #page1 {
            background: #f7f5f2;

            flex-direction: column;

            text-align: center;

            position: relative;

            isolation: isolate;
        }


        /* PAGE2 TITLE — "YEY BENARR!!" */

        .page2-title {
            position: relative;

            z-index: 100;

            margin: 0 20px 20px;

            color: #2E3863;

            font-family: 'Poppins', sans-serif;

            font-size: clamp(28px, 6.5vw, 48px);
            line-height: 1.2;

            font-weight: 700;

            text-shadow:
                2px 2px 4px rgba(0, 0, 0, 0.20);
        }

        .page2-title .letter {
            display: inline-block;

            opacity: 0;

            transform:
                translateY(30px)
                scale(0.3);

            animation:
                letterBouncePop
                0.6s
                cubic-bezier(0.34, 1.6, 0.64, 1)
                forwards;
        }

        .page2-title .letter.space {
            width: 0.3em;
        }

        @keyframes letterBouncePop {

            0% {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.3);
            }

            65% {
                opacity: 1;

                transform:
                    translateY(-10px)
                    scale(1.25);
            }

            85% {
                transform:
                    translateY(4px)
                    scale(0.92);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* PAGE2 PHOTO — polos, tanpa frame/shadow/background */

        .page2-photo {
            position: relative;

            z-index: 100;

            width: min(480px, 85vw);
            max-height: 55vh;

            height: auto;

            object-fit: contain;

            display: block;

            border: none;

            background: transparent;

            box-shadow: none;

            outline: none;

            opacity: 0;

            transform: scale(0.3);

            animation:
                photo2PopIn
                0.7s
                ease-out
                forwards;
        }

        @keyframes photo2PopIn {

            0% {
                opacity: 0;

                transform: scale(0.3);
            }

            60% {
                opacity: 1;

                transform: scale(1.1);
            }

            100% {
                opacity: 1;

                transform: scale(1);
            }
        }


        /* PAGE2 BUTTON — muncul 3 detik kemudian */

        .page2-button {
            position: relative;

            z-index: 120;

            margin-top: 26px;
            padding: 16px 26px;

            border: none;
            border-radius: 12px;

            background: rgba(235, 235, 240, 0.5);

            color: #2E3863;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;

            cursor: pointer;

            opacity: 0;

            transform:
                translateY(12px)
                scale(0.9);

            pointer-events: none;

            transition:
                opacity 0.5s ease,
                transform 0.5s ease,
                background 0.25s ease,
                letter-spacing 0.25s ease;
        }

        .page2-button.show {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);

            pointer-events: auto;
        }

        .page2-button:hover {
            transform: scale(1.12);

            background: rgba(235, 235, 240, 0.75);

            -webkit-text-stroke: 0.5px #2E3863;
        }


        /* =====================================================
           PAGE 3 — STUFFS
        ===================================================== */

        #page3 {
            background: #f7f5f2;

            flex-direction: column;

            padding: 80px 20px 40px;

            overflow-y: auto;

            text-align: center;
        }

        .stuffs-title {
            margin-bottom: 30px;

            color: #373757;

            font-size: 30px;

            font-weight: 700;
        }

        .stuffs-container {
            width: min(500px, 90vw);

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .stuff-button {
            min-height: 70px;

            border: none;
            border-radius: 12px;

            background: rgba(54, 54, 54, 0.75);

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.2);

            transition: 0.25s ease;
        }

        .stuff-button:hover {
            background: #252525;

            transform: scale(1.07);
        }

        .random-button {
            background: rgba(120, 100, 80, 0.75);
        }

        .random-button:hover {
            background: #80694F;
        }


        /* =====================================================
           PAGE1 GROW-CONFETTI (correct answer 24122006)
        ===================================================== */

        .confetti-grow {
            position: fixed;

            left: 50%;
            top: 50%;

            width: var(--width);
            height: var(--height);

            background: var(--color);

            border-radius: 2px;

            z-index: 5;

            pointer-events: none;

            animation:
                confettiGrowSettle
                var(--duration)
                cubic-bezier(0.15, 0.8, 0.25, 1)
                forwards;
        }

        @keyframes confettiGrowSettle {

            0% {
                transform:
                    translate(-50%, -50%)
                    translate(0, 0)
                    rotate(0deg)
                    scale(0.3);
            }

            60% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--x) * 0.7),
                        calc(var(--y) * 0.7)
                    )
                    rotate(calc(var(--rotation) * 0.6))
                    scale(1.3);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        var(--x),
                        var(--y)
                    )
                    rotate(var(--rotation))
                    scale(1.9);
            }
        }

        /* Setelah membesar, confetti tetap bergerak pelan (melayang) */

        .confetti-grow.floating {

            animation:
                confettiFloat
                var(--float-duration)
                ease-in-out
                infinite
                alternate;
        }

        @keyframes confettiFloat {

            0% {
                transform:
                    translate(-50%, -50%)
                    translate(var(--x), var(--y))
                    rotate(var(--rotation))
                    scale(1.9)
                    translate(0, 0);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translate(var(--x), var(--y))
                    rotate(var(--rotation))
                    scale(1.9)
                    translate(var(--fx), var(--fy));
            }
        }


        /* =====================================================
           L1 — RANDOM DAY LETTER MENU
        ===================================================== */

        #pageL1 {
            background: #f7f5f2;

            flex-direction: column;

            text-align: center;

            gap: 15px;

            padding: 80px 20px;
        }

        .l1-title {
            margin-bottom: 15px;

            color: #373757;

            font-size: 32px;
        }

        .l1-button {
            width: min(400px, 90vw);

            padding: 18px;

            border: none;
            border-radius: 12px;

            background: rgba(54, 54, 54, 0.75);

            color: white;

            font-family: 'Poppins', sans-serif;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.2);

            transition: 0.25s ease;
        }

        .l1-button:hover {
            background: #252525;

            transform: scale(1.06);
        }


        /* =====================================================
           LT1 — WRITE LETTER
        ===================================================== */

        #pageLT1 {
            background: #eee5d8;

            flex-direction: column;

            padding: 80px 20px 40px;

            overflow-y: auto;
        }

        .letter-paper {
            width: min(650px, 92vw);

            min-height: 620px;

            padding: 35px;

            background: #f5e8cf;

            border: 1px solid #d2b98b;

            border-radius: 3px;

            color: #4a3928;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.22);
        }

        .letter-title {
            margin-bottom: 30px;

            text-align: center;

            font-family: Georgia, serif;

            font-size: 27px;
        }

        .letter-field {
            margin-bottom: 18px;
        }

        .letter-field label {
            display: block;

            margin-bottom: 6px;

            font-weight: 700;
        }

        .letter-input,
        .letter-textarea {
            width: 100%;

            padding: 8px 4px;

            border: none;
            border-bottom: 1px solid #a98c62;

            background: transparent;

            color: #4a3928;

            font-family: Georgia, serif;
            font-size: 16px;

            outline: none;
        }

        .letter-textarea {
            min-height: 260px;

            padding: 12px;

            border: 1px solid #bba47d;

            background: rgba(255, 255, 255, 0.18);

            resize: vertical;
        }

        .send-letter-button {
            display: block;

            margin: 25px auto 0;

            padding: 13px 40px;

            border: none;
            border-radius: 10px;

            background: #594534;

            color: #f8efd9;

            font-family: 'Poppins', sans-serif;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .send-letter-button:hover {
            background: #3d2e23;

            transform: scale(1.08);
        }


        /* =====================================================
           LB1 — LETTER LIST
        ===================================================== */

        #pageLB1 {
            background: #eee5d8;

            flex-direction: column;

            padding: 80px 20px 50px;

            overflow-y: auto;

            text-align: center;
        }

        .lb-title {
            margin: 0 0 30px;

            color: #594534;

            font-family: 'Poppins', sans-serif;

            font-size: clamp(26px, 6vw, 36px);

            font-weight: 700;

            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.15);
        }

        .letters-container {
            width: min(650px, 92vw);

            display: flex;

            flex-direction: column;

            gap: 18px;

            padding-bottom: 30px;
        }

        .saved-letter-button {
            width: 100%;

            min-height: 95px;

        .modal-paper {
            width: min(620px, 92vw);

            overflow-y: auto;

        @keyframes letterAppear {
            0% {
                opacity: 0;

</head>

    <script>


        /* =====================================================
           PAGE NAVIGATION
        ===================================================== */

        function showPage(pageId) {

            // Hapus confetti B1 jika meninggalkan B1
            if (pageId !== "pageB1") {

                document
                    .querySelectorAll(".confetti")
                    .forEach(confetti => confetti.remove());

            }


            // Hapus confetti page1 jika meninggalkan page1
            if (pageId !== "page1") {

                document
                    .querySelectorAll(".confetti-grow")
                    .forEach(confetti => confetti.remove());

            }


            // Sembunyikan semua page
            document
                .querySelectorAll(".page")
                .forEach(page => {

                    page.classList.remove("active");

                });


            // Tampilkan page tujuan
            document
                .getElementById(pageId)
                .classList.add("active");


            // Buat confetti ketika masuk B1
            if (pageId === "pageB1") {

                createConfetti();
                playBirthdayTitle();
                settlePhoto();
                playBackgroundMusic();

            } else {

                pauseBackgroundMusic();

            }


            // Buat confetti membesar & melambat ketika masuk page1
            if (pageId === "page1") {

                createGrowConfetti();
                playPage2Title();
                popPage2Photo();
                revealPage2Button();

            }

        }


        /* =====================================================
           BIRTHDAY TITLE — POP UP PER HURUF
        ===================================================== */

        function playBirthdayTitle() {

            const el =
                document.getElementById("birthdayTitle");


            const text =
                "SELAMAT ULANG TAHUN JAFAR!!!";


            // Jangan diulang animasinya kalau sudah pernah jalan
            if (el.dataset.played === "1") {

                return;

            }

            el.dataset.played = "1";


            el.innerHTML = "";


            text
                .split("")
                .forEach((char, index) => {

                    const span =
                        document.createElement("span");


                    span.classList.add("letter");

                    if (char === " ") {

                        span.classList.add("space");
                        span.innerHTML = "&nbsp;";

                    } else {

                        span.textContent = char;

                    }


                    span.style.animationDelay =
                        (index * 0.06) + "s";


                    el.appendChild(span);

                });

        }


        /* =====================================================
           BIRTHDAY PHOTO — SETTLE INTO HEARTBEAT
        ===================================================== */

        function settlePhoto() {

            const photo =
                document.getElementById("birthdayPhoto");


            if (photo.dataset.settled === "1") {

                photo.classList.add("settled");

                return;

            }


            photo.addEventListener(
                "animationend",
                function handler(event) {

                    if (event.animationName === "scrapbookPopIn") {

                        photo.classList.add("settled");
                        photo.dataset.settled = "1";

                        photo.removeEventListener(
                            "animationend",
                            handler
                        );

                    }

                }
            );

        }


        /* =====================================================
           BACKGROUND MUSIC
        ===================================================== */

        function playBackgroundMusic() {

            const music =
                document.getElementById("bgMusic");

            const button =
                document.getElementById("musicToggleButton");


            music
                .play()
                .then(function () {

                    button.innerText =
                        "⏸ PAUSE MUSIC";

                })
                .catch(function () {

                    // Kalau browser tetap memblokir autoplay,
                    // tombol akan tampil "PLAY MUSIC" agar user tinggal klik sekali
                    button.innerText =
                        "▶ PLAY MUSIC";

                });

        }


        function pauseBackgroundMusic() {

            const music =
                document.getElementById("bgMusic");


            music.pause();

        }


        function toggleMusic() {

            const music =
                document.getElementById("bgMusic");

            const button =
                document.getElementById("musicToggleButton");


            if (music.paused) {

                music
                    .play()
                    .then(function () {

                        button.innerText =
                            "⏸ PAUSE MUSIC";

                    });

            } else {

                music.pause();

                button.innerText =
                    "▶ PLAY MUSIC";

            }

        }


        /* =====================================================
           HOME
        ===================================================== */

        function goHome() {

            showPage("home");

            document
                .getElementById("password")
                .value = "";

            document
                .getElementById("message")
                .innerText = "";

        }


        /* =====================================================
           PASSWORD
        ===================================================== */

       function checkPassword() {
    const password =
        document.getElementById("password").value;

    // Password Birthday Page
    if (password === "20061215") {
        showPage("pageB1");
        return;
    }

    // Password OG Letter
    if (password === "24122006") {
        showPage("page1");
        return;
    }

    // Password salah
    showWrongPasswordPopup();
}

/* =====================================================
   WRONG PASSWORD POPUP
===================================================== */

function showWrongPasswordPopup() {

    // Buat overlay
    const overlay =
        document.createElement("div");

    overlay.className =
        "error-overlay";

    // Buat isi popup
    const content =
        document.createElement("div");

    content.className =
        "error-content";

    // Foto KUMIMARAH
    const image =
        document.createElement("img");

    image.src =
        "KUMIMARAH.PNG";

    image.alt =
        "Password Salah";

    // Tulisan SALAH!
    const title =
        document.createElement("div");

    title.className =
        "error-title";

    title.innerText =
        "SALAH!";

    content.appendChild(image);
    content.appendChild(title);

    // Buat burst tanda tanya
    for (let i = 0; i < 12; i++) {

        const question =
            document.createElement("span");

        question.className =
            "question-mark";

        question.innerText =
            "?";

        const angle =
            (Math.PI * 2 / 12) * i;

        const distance =
            90 + Math.random() * 80;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        question.style.setProperty(
            "--tx",
            x + "px"
        );

        question.style.setProperty(
            "--ty",
            y + "px"
        );

        question.style.setProperty(
            "--rot",
            (-35 + Math.random() * 70) + "deg"
        );

        content.appendChild(question);
    }

    overlay.appendChild(content);

    document.body.appendChild(overlay);

    // Kembali ke Home setelah popup selesai
    setTimeout(function () {

    document
        .getElementById("password")
        .value = "";

    document
        .getElementById("message")
        .innerText = "";

    showPage("home");

}, 600);
}
        /* =====================================================
           PASSWORD INPUT
        ===================================================== */

        const passwordInput =
            document.getElementById("password");


        passwordInput.addEventListener(
            "focus",
            function () {

                this.placeholder = "";

            }
        );


        passwordInput.addEventListener(
            "blur",
            function () {

                if (!this.value) {

                    this.placeholder =
                        "enter password";

                }

            }
        );


        passwordInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    checkPassword();

                }

            }
        );


        /* =====================================================
           CREATE STARS
        ===================================================== */

     function createStars() {

    /* =====================================================
       BINTANG HOME
    ===================================================== */

    const homeContainer =
        document.getElementById("stars");


    if (homeContainer) {

        const colors = [
            "#F6E7A1",
            "#F7C6C7",
            "#C6DEF1",
            "#C9E4C5",
            "#E2C6F1",
            "#F9D5A7"
        ];


        for (let i = 0; i < 30; i++) {

            const star =
                document.createElement("div");

            star.classList.add("star");


            const size =
                18 + Math.random() * 25;

            star.style.setProperty(
                "--size",
                size + "px"
            );


            star.style.setProperty(
                "--left",
                Math.random() * 100 + "vw"
            );


            star.style.setProperty(
                "--top",
                Math.random() * 100 + "vh"
            );


            star.style.setProperty(
                "--color",
                colors[
                    Math.floor(
                        Math.random() * colors.length
                    )
                ]
            );


            star.style.setProperty(
                "--x1",
                (-18 + Math.random() * 36) + "px"
            );

            star.style.setProperty(
                "--x2",
                (-35 + Math.random() * 70) + "px"
            );

            star.style.setProperty(
                "--x3",
                (-18 + Math.random() * 36) + "px"
            );


            star.style.setProperty(
                "--y1",
                (-12 + Math.random() * 24) + "px"
            );

            star.style.setProperty(
                "--y2",
                (-20 + Math.random() * 40) + "px"
            );

            star.style.setProperty(
                "--y3",
                (-12 + Math.random() * 24) + "px"
            );


            star.style.setProperty(
                "--duration",
                (10 + Math.random() * 7) + "s"
            );


            homeContainer.appendChild(star);

        }

    }


    /* =====================================================
       BINTANG PAGE 3
    ===================================================== */

    const page3Container =
        document.getElementById("starContainer");


    if (page3Container) {

        page3Container.innerHTML = "";


        const numberOfStars = 18;


        for (let i = 0; i < numberOfStars; i++) {

            const star =
                document.createElement("span");

            star.classList.add("star");


            // Bentuk bintang
            star.innerText = "✦";


            // Posisi random
            star.style.left =
                (Math.random() * 95) + "%";

            star.style.top =
                (Math.random() * 95) + "%";


            // Ukuran random
            const size =
                22 + Math.random() * 28;

            star.style.fontSize =
                size + "px";


            // Durasi random
            const duration =
                10 + Math.random() * 6;

            star.style.setProperty(
                "--duration",
                duration + "s"
            );


            // Delay random
            star.style.animationDelay =
                (-Math.random() * duration) + "s";


            page3Container.appendChild(star);

        }

    }

}


        /* =====================================================
           CREATE CONFETTI
        ===================================================== */

        function createConfetti() {

            // Bersihkan confetti lama
            document
                .querySelectorAll(".confetti")
                .forEach(confetti => confetti.remove());


            const colors = [
                "#F6E7A1",
                "#F7C6C7",
                "#C6DEF1",
                "#C9E4C5",
                "#E2C6F1",
                "#F9D5A7"
            ];


            // 180 confetti
            for (let i = 0; i < 180; i++) {

                const confetti =
                    document.createElement("div");


                confetti.classList.add("confetti");


                // Warna
                confetti.style.setProperty(
                    "--color",
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ]
                );


                // Ukuran
                confetti.style.setProperty(
                    "--width",
                    (5 + Math.random() * 9) + "px"
                );

                confetti.style.setProperty(
                    "--height",
                    (8 + Math.random() * 16) + "px"
                );


                // Arah random
                const angle =
                    Math.random() * Math.PI * 2;


                // Jarak sebaran
                const distance =
                    280 + Math.random() * 650;


                const x =
                    Math.cos(angle) * distance;


                const y =
                    Math.sin(angle) * distance;


                confetti.style.setProperty(
                    "--x",
                    x + "px"
                );

                confetti.style.setProperty(
                    "--y",
                    y + "px"
                );


                // Rotasi
                confetti.style.setProperty(
                    "--rotation",
                    (-720 + Math.random() * 1440) + "deg"
                );


                // Kecepatan
                confetti.style.setProperty(
                    "--duration",
                    (4 + Math.random() * 4) + "s"
                );


                // Masukkan ke B1
                document
                    .getElementById("pageB1")
                    .appendChild(confetti);

            }

        }


        /* =====================================================
           CREATE GROW CONFETTI (page1 — password 24122006)
        ===================================================== */

        function createGrowConfetti() {

            // Jangan buat ulang kalau sudah ada

                document.querySelector(".confetti-grow")

                return;

            }


            const colors = [
                "#F6E7A1",

                "#C9E4C5",
                "#E2C6F1",

                const confetti =
                    document.createElement("div");


                confetti.classList.add("confetti-grow");


                confetti.style.setProperty(
                    "--color",
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ]
                );


                confetti.style.setProperty(
                    "--width",
                    (5 + Math.random() * 9) + "px"
                );

                confetti.style.setProperty(
                    "--height",
                    (8 + Math.random() * 16) + "px"
                );


                const angle =
                    Math.random() * Math.PI * 2;


                const distance =
                    280 + Math.random() * 650;


                const x =
                    Math.cos(angle) * distance;


                const y =
                    Math.sin(angle) * distance;


                confetti.style.setProperty(
                    "--x",
                    x + "px"
                );

                confetti.style.setProperty(
                    "--y",
                    y + "px"
                );


                confetti.style.setProperty(
                    "--rotation",
                    (-720 + Math.random() * 1440) + "deg"
                );


                // Melambat menuju akhir animasi, lalu diam sesaat sebelum melayang pelan
                confetti.style.setProperty(
                    "--duration",
                    (2.5 + Math.random() * 1.5) + "s"
                );


                // Setelah membesar, ganti ke animasi melayang pelan
                confetti.addEventListener(
                    "animationend",
                    function handler(event) {

                        if (event.animationName === "confettiGrowSettle") {

                            confetti.style.setProperty(
                                "--fx",
                                (-18 + Math.random() * 36) + "px"
                            );

                            confetti.style.setProperty(
                                "--fy",
                                (-18 + Math.random() * 36) + "px"
                            );

                            confetti.style.setProperty(
                                "--float-duration",
                                (4 + Math.random() * 4) + "s"
                            );

                            confetti.classList.add("floating");

                            confetti.removeEventListener(
                                "animationend",
                                handler
                            );

                        }

                    }
                );


                document
                    .getElementById("page1")
                    .appendChild(confetti);

            }

        }


        /* =====================================================
           PAGE2 TITLE — "YEY BENARR!!" (bounce per huruf random)
        ===================================================== */

        function playPage2Title() {

            const el =
                document.getElementById("page2Title");


            const text =
                "YEY BENARR!!";


            if (el.dataset.played === "1") {

                return;

            }

            el.dataset.played = "1";


            el.innerHTML = "";


            text
                .split("")
                .forEach((char) => {

                    const span =
                        document.createElement("span");


                    span.classList.add("letter");

                    if (char === " ") {

                        span.classList.add("space");
                        span.innerHTML = "&nbsp;";

                    } else {

                        span.textContent = char;

                    }


                    // Delay acak per huruf (bukan berurutan)
                    span.style.animationDelay =
                        (Math.random() * 0.9) + "s";


                    el.appendChild(span);

                });

        }


        /* =====================================================
           PAGE2 PHOTO — pop up polos
        ===================================================== */

        function popPage2Photo() {

            const photo =
                document.getElementById("page2Photo");


            if (photo.dataset.played === "1") {

                return;

            }

            photo.dataset.played = "1";


            // Restart animasi (elemen sudah ada di DOM sejak awal)
            photo.style.animation = "none";

            void photo.offsetWidth;

            photo.style.animation = "";

        }


        /* =====================================================
           PAGE2 BUTTON — muncul 3 detik kemudian
        ===================================================== */

        function revealPage2Button() {

            const button =
                document.getElementById("page2Button");


            button.classList.remove("show");


            setTimeout(
                function () {

                    button.classList.add("show");

                },
                3000
            );

        }


        /* =====================================================
           BIRTHDAY LETTER
        ===================================================== */

        function openBirthdayLetter() {

            // Ganti URL ini dengan link PDF birthday letter
            window.location.href =
                "https://drive.google.com";

        }


        /* =====================================================
           PDF BUTTONS
        ===================================================== */

        function openPDF(link) {

            const emptyLinks = [
                "JACKET_LINK",
                "BOOKS_LINK",
                "FRAME_FOTO_LINK",
                "KEYCHAIN_LINK",
                "OUR_PHOTOS_LINK"
            ];


            if (emptyLinks.includes(link)) {

                alert(
                    "Link PDF belum dimasukkan."
                );

                return;

            }


            window.location.href = link;

        }


        /* =====================================================
           SEND RANDOM DAY LETTER
        ===================================================== */

        function sendLetter() {

            const date =
                document
                    .getElementById("letterDate")
                    .value;


            const time =
                document
                    .getElementById("letterTime")
                    .value;


            const message =
                document
                    .getElementById("letterMessage")
                    .value
                    .trim();


            const author =
                document
                    .getElementById("letterAuthor")
                    .value
                    .trim();


            // Validasi
            if (!date || !time || !message || !author) {

                alert(
                    "Tolong isi semua bagian surat terlebih dahulu."
                );

                return;

            }


            // Ambil surat lama
            const letters =
                JSON.parse(
                    localStorage.getItem(
                        "randomDayLetters"
                    ) || "[]"
                );


            // Tambahkan surat baru
            letters.push({

                id: Date.now(),

                date: date,

                time: time,

                message: message,

                author: author

            });


            // Simpan
            localStorage.setItem(
                "randomDayLetters",
                JSON.stringify(letters)
            );


            // Reset form
            document
                .getElementById("letterDate")
                .value = "";

            document
                .getElementById("letterTime")
                .value = "";

            document
                .getElementById("letterMessage")
                .value = "";

            document
                .getElementById("letterAuthor")
                .value = "";


            alert(
                "Surat berhasil dikirim ♡"
            );


            // Tampilkan daftar surat
            showPage("pageLB1");

            loadLetters();

        }


        /* =====================================================
           LOAD LETTERS
        ===================================================== */

        function loadLetters() {

            const container =
                document.getElementById(
                    "lettersContainer"
                );


            container.innerHTML = "";


            const letters =
                JSON.parse(
                    localStorage.getItem(
                        "randomDayLetters"
                    ) || "[]"
                );


            // Belum ada surat
            if (letters.length === 0) {

                container.innerHTML = `

                    <p style="
                        text-align: center;
                        color: #80694F;
                        font-family: Georgia, serif;
                    ">
                        belum ada random day letter.
                    </p>

                `;

                return;

            }


            // Surat terbaru berada di atas
            letters
                .slice()
                .reverse()
                .forEach(letter => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "saved-letter-button";


                    const formattedDate =
                        formatDate(letter.date);


                    button.innerHTML = `

                        <span class="saved-letter-date">
                            ${formattedDate}
                        </span>

                        <span class="saved-letter-name">
                            ${escapeHTML(letter.author)}
                        </span>

                    `;


                    button.onclick =
                        function () {

                            openLetter(letter);

                        };


                    container.appendChild(button);

                });

        }


        /* =====================================================
           FORMAT DATE
        ===================================================== */

        function formatDate(dateString) {

            const parts =
                dateString.split("-");


            if (parts.length !== 3) {

                return dateString;

            }


            return (
                parts[2] +
                "/" +
                parts[1] +
                "/" +
                parts[0]
            );

        }


        /* =====================================================
           OPEN LETTER
        ===================================================== */

        function openLetter(letter) {

            document
                .getElementById("modalDate")
                .innerText =
                    formatDate(letter.date) +
                    " • " +
                    letter.time;


            document
                .getElementById("modalMessage")
                .innerText =
                    letter.message;


            document
                .getElementById("modalAuthor")
                .innerText =
                    "— " +
                    letter.author;


            document
                .getElementById("letterModal")
                .classList
                .add("active");

        }


        /* =====================================================
           CLOSE LETTER
        ===================================================== */

        function closeLetter() {

            document
                .getElementById("letterModal")
                .classList
                .remove("active");

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHTML(text) {

            const div =
                document.createElement("div");


            div.innerText =
                text;


            return div.innerHTML;

        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        createStars();

    </script>

</body>
