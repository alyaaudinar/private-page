    <style>

        /* =====================================================
           POP-UP ERROR HOME
        ===================================================== */

        .error-overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 99999;
        }


        /* FADE OUT SEBELUM KEMBALI KE HOME */

        .error-overlay.fade-out {
            animation:
                overlayFadeOut
                0.6s
                ease
                forwards;
        }


        @keyframes overlayFadeOut {

            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }

        }


        .error-content {
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            animation:
                popIn
                0.35s
                cubic-bezier(0.175, 0.885, 0.32, 1.275)
                forwards;
        }


      .error-content img {
    width: 180px;
    max-width: 75vw;
    height: auto;
}


        .error-title {
            color: #8F0B0B;

            font-size: 2.2rem;
            font-weight: 900;

            margin-top: 15px;

            letter-spacing: 3px;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.5);
        }


        /* =====================================================
           BURST TANDA TANYA
        ===================================================== */

        .question-mark {
            position: absolute;

            color: #8F0B0B;

            font-weight: 900;
            font-size: 2.5rem;

            pointer-events: none;
            user-select: none;

            text-shadow:
                0 0 6px
                rgba(143, 11, 11, 0.4);

            animation:
                burstOut
                0.85s
                cubic-bezier(0.25, 1, 0.5, 1)
                forwards;
        }


        @keyframes popIn {

            0% {
                transform: scale(0.4);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }


              @keyframes burstOut {

            0% {
                transform:
                    translate(0, 0)
                    scale(0.4)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform:
                    translate(var(--tx), var(--ty))
                    scale(1.8)
                    rotate(var(--rot));

                opacity: 1;
            }

        }


        /* =====================================================
           BINTANG PAGE 3
        ===================================================== */

        #page3 {
            position: relative;
            overflow: hidden;
        }


        .star-bg {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 0;
        }


       /* BINTANG 5 SISI — PAGE 3 */

        .star-p3 {
            position: absolute;

            width: var(--size);
            height: var(--size);

            left: var(--left);
            top: var(--top);

            background: #DEC5A0;

            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );

            opacity: var(--opacity);

            filter: blur(var(--blur));

            user-select: none;
            pointer-events: none;

            animation:
                starDrift
                var(--duration)
                ease-in-out
                infinite
                alternate;
        }


        @keyframes starDrift {

            0% {
                transform:
                    translateX(var(--x1))
                    rotate(var(--r1));
            }

            100% {
                transform:
                    translateX(var(--x2))
                    rotate(var(--r2));
            }

        }

        /* =====================================================
           RANDOM DAY LETTER BUTTON
        ===================================================== */

        .btn-random-letter {

            background-color: #B8A98A !important;

            color: #ffffff !important;

            border: none;
        }


        /* =====================================================
           LOCK MODAL — PASSWORD TIAP STUFF
        ===================================================== */

        .lock-modal {
            position: fixed;

            inset: 0;

            z-index: 10001;

            display: none;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background: rgba(25, 25, 25, 0.72);

            backdrop-filter: blur(4px);
        }


        .lock-modal.active {
            display: flex;
        }


        .lock-modal.fade-out {
            animation:
                overlayFadeOut
                0.6s
                ease
                forwards;
        }


        .lock-box {
            position: relative;

            width: min(400px, 92vw);

            padding: 38px 28px 30px;

            background: #f7f5f2;

            border-radius: 14px;

            text-align: center;

            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.35);

            animation:
                popIn
                0.35s
                cubic-bezier(0.175, 0.885, 0.32, 1.275)
                forwards;
        }


        .lock-box h2 {
            margin: 0 0 10px;

            color: #333;

            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }


        .lock-message {
            min-height: 22px;

            margin: 16px 0 0;

            color: #8F0B0B;

            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
        }


        .close-lock {
            position: absolute;

            top: 8px;
            right: 14px;

            width: 32px;
            height: 32px;

            border: none;

            background: transparent;

            color: #777;

            font-family: Arial, sans-serif;
            font-size: 26px;

            line-height: 32px;

            cursor: pointer;

            transition: transform 0.2s ease;
        }


        .close-lock:hover {
            transform: scale(1.2);

            color: #333;
        }

    </style>

    <style>

           STARS
        ===================================================== */

        .star {

            height: var(--size);

            left: var(--left);
            top: var(--top);

            background: var(--color);

            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );

            opacity: 0.65;

            pointer-events: none;

            animation:
                starMovement
                var(--duration)
                ease-in-out
                infinite
                alternate;
        }

        @keyframes starMovement {
            0% {
                transform:
                    translate(var(--x1), var(--y1))
                    rotate(0deg);
            }

            50% {
                transform:
                    translate(var(--x2), var(--y2))
                    rotate(8deg);
            }

            100% {
                transform:
                    translate(var(--x3), var(--y3))
                    rotate(-8deg);
            }
        }

           B1 
        ===================================================== */

            text-align: center;

            font-weight: 700;

            text-shadow:
                2px 2px 0 rgba(0, 0, 0, 0.20);
        }

        .birthday-title .letter {
            display: inline-block;

            opacity: 0;

            transform:
                translateY(25px)
                scale(0.4);

            animation:
                letterPopIn
                0.55s

                forwards;
        }

        .birthday-title .letter.space {
            width: 0.3em;
        }

        @keyframes letterPopIn {

            0% {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.4);
            }

            70% {
                opacity: 1;

                transform:
                    translateY(-6px)
                    scale(1.15);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* B1 PHOTO */

        .birthday-photo {
            position: relative;

            z-index: 100;

            width: min(620px, 90vw);
            max-height: 58vh;

            height: auto;

            object-fit: contain;

            display: block;

            border: none;

            background: transparent;

            box-shadow: none;

            opacity: 0;

            transform:
                scale(0.15)
                rotate(-14deg);

            animation:
                scrapbookPopIn
                0.9s
                cubic-bezier(0.22, 1.4, 0.4, 1)
                forwards;
        }

        .birthday-photo.settled {

            border: none;

            background: transparent;

            box-shadow: none;

            opacity: 1;

            transform:
                scale(1)
                rotate(0deg);

            animation:
                heartbeat
                2.2s
                ease-in-out
                infinite;
        }

        @keyframes scrapbookPopIn {

            0% {
                opacity: 0;

                transform:
                    scale(0.15)
                    rotate(-14deg);
            }

            60% {
                opacity: 1;

                transform:
                    scale(1.12)
                    rotate(4deg);
            }

            80% {
                transform:
                    scale(0.97)
                    rotate(-2deg);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);
            }
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.055);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.065);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =====================================================
           CONFETTI
        ===================================================== */

        .confetti {
            position: fixed;

            left: 50%;
            top: 50%;

            width: var(--width);
            height: var(--height);

            background: var(--color);

            border-radius: 2px;

            z-index: 20;

            pointer-events: none;

            animation:
                confettiMovement
                var(--duration)
                cubic-bezier(0.15, 0.8, 0.2, 1)
                infinite
                alternate;
        }

        @keyframes confettiMovement {

            0% {
                transform:
                    translate(-50%, -50%)
                    translate(0, 0)
                    rotate(0deg)
                    scale(0.35);
            }

            45% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--x) * 0.55),
                        calc(var(--y) * 0.55)
                    )
                    rotate(calc(var(--rotation) * 0.45))
                    scale(1.05);
            }

            75% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--x) * 0.85),
                        calc(var(--y) * 0.85)
                    )
                    rotate(calc(var(--rotation) * 0.8))
                    scale(1.45);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        var(--x),
                        var(--y)
                    )
                    rotate(var(--rotation))
                    scale(1.75);
            }
        }

        /* =====================================================
           PAGE1 GROW-CONFETTI (correct answer 24122006)
        ===================================================== */

        .confetti-grow {
            position: fixed;

            left: 50%;
            top: 50%;

            width: var(--width);
            height: var(--height);

            background: var(--color);

            border-radius: 2px;

            z-index: 5;

            pointer-events: none;

            animation:
                confettiGrowSettle
                var(--duration)
                cubic-bezier(0.15, 0.8, 0.25, 1)
                forwards;
        }

        @keyframes confettiGrowSettle {

            0% {
                transform:
                    translate(-50%, -50%)
                    translate(0, 0)
                    rotate(0deg)
                    scale(0.3);
            }

            60% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        calc(var(--x) * 0.7),
                        calc(var(--y) * 0.7)
                    )
                    rotate(calc(var(--rotation) * 0.6))
                    scale(1.3);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translate(
                        var(--x),
                        var(--y)
                    )
                    rotate(var(--rotation))
                    scale(1.9);
            }
        }

        /* Setelah membesar, confetti tetap bergerak pelan (melayang) */

        .confetti-grow.floating {

            animation:
                confettiFloat
                var(--float-duration)
                ease-in-out
                infinite
                alternate;
        }

        @keyframes confettiFloat {

            0% {
                transform:
                    translate(-50%, -50%)
                    translate(var(--x), var(--y))
                    rotate(var(--rotation))
                    scale(1.9)
                    translate(0, 0);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translate(var(--x), var(--y))
                    rotate(var(--rotation))
                    scale(1.9)
                    translate(var(--fx), var(--fy));
            }
        }

            animation:
                letterPhotoPop
                0.9s
                cubic-bezier(0.22, 1.4, 0.4, 1)
                forwards;
        }

        .letter-photo.beating {
            opacity: 1;

            transform: scale(1);

            animation:
                heartbeat
                2.2s
                ease-in-out
                infinite;
        }

        .letter-photo.fade-away {
            animation:
                letterPhotoFade
                0.5s
                ease
                forwards;
        }

        @keyframes letterPhotoPop {

            0% {
                opacity: 0;
                transform: scale(0.2);
            }

            60% {
                opacity: 1;
                transform: scale(1.1);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes letterPhotoFade {

            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0.9);
            }
        }

            display: block;

                ease

        }

        @keyframes paperFadeGrow {

            0% {
                opacity: 0;
                transform: scale(0.75);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* B3 — pop up membesar */

            display: block;

            animation:
                paperPopIn
                0.8s
                cubic-bezier(0.22, 1.4, 0.4, 1)

        /* =====================================================

        function showPage(pageId) {

            // Hapus confetti B1 jika meninggalkan B1
            if (pageId !== "pageB1") {

                document
                    .querySelectorAll(".confetti")
                    .forEach(confetti => confetti.remove());

            }


            // Hapus confetti page1 jika meninggalkan page1
            if (pageId !== "page1") {

                document
                    .querySelectorAll(".confetti-grow")
                    .forEach(confetti => confetti.remove());

            }


            // Hapus confetti B3 jika meninggalkan B3
            if (pageId !== "pageB3") {

                document
                    .querySelectorAll(".confetti-b3")
                    .forEach(confetti => confetti.remove());

            }


            // Sembunyikan semua page
            document
                .querySelectorAll(".page")
                .forEach(page => {

                    page.classList.remove("active");

                });


            // Tampilkan page tujuan
            document
                .getElementById(pageId)
                .classList.add("active");


            // Buat confetti ketika masuk B1
            if (pageId === "pageB1") {

                createConfetti();
                playBirthdayTitle();
                settlePhoto();

            }


            // Musik tetap berjalan di seluruh rangkaian birthday
            if (
                pageId === "pageB1" ||
                pageId === "pageB2" ||
                pageId === "pageB3"
            ) {

                playBackgroundMusic();

            } else {

                pauseBackgroundMusic();

            }


            // Special letter
            if (pageId === "pageB2") {

                playPageB2();

            }


            // Petunjuk hadiah
            if (pageId === "pageB3") {

                playPageB3();

            }


            // Buat confetti membesar & melambat ketika masuk page1
            if (pageId === "page1") {

                createGrowConfetti();
                playPage2Title();
                popPage2Photo();
                revealPage2Button();

            }

        }


        /* =====================================================
           BDY TITLE — POP UP PER HURUF
        ===================================================== */

        function playBirthdayTitle() {

            const el =
                document.getElementById("birthdayTitle");


            const text =
                "SELAMAT ULANG TAHUN JAFAR!!!";


            // Jangan diulang animasinya kalau sudah pernah jalan
            if (el.dataset.played === "1") {

                return;

            }

            el.dataset.played = "1";


            el.innerHTML = "";


            text
                .split("")
                .forEach((char, index) => {

                    const span =
                        document.createElement("span");


                    span.classList.add("letter");

                    if (char === " ") {

                        span.classList.add("space");
                        span.innerHTML = "&nbsp;";

                    } else {

                        span.textContent = char;

                    }


                    span.style.animationDelay =
                        (index * 0.06) + "s";


                    el.appendChild(span);

                });

        }


        /* =====================================================
           BDY PHOTO — SETTLE INTO HEARTBEAT
        ===================================================== */

        function settlePhoto() {

            const photo =
                document.getElementById("birthdayPhoto");


            if (photo.dataset.settled === "1") {

                photo.classList.add("settled");

                return;

            }


            photo.addEventListener(
                "animationend",
                function handler(event) {

                    if (event.animationName === "scrapbookPopIn") {

                        photo.classList.add("settled");
                        photo.dataset.settled = "1";

                        photo.removeEventListener(
                            "animationend",
                            handler
                        );

                    }

                }
            );

        }


        /* =====================================================
           BACKGROUND MUSIC
        ===================================================== */

        function playBackgroundMusic() {

            const music =
                document.getElementById("bgMusic");

            const button =
                document.getElementById("musicToggleButton");


            music
                .play()
                .then(function () {

                    button.innerText =
                        "⏸ PAUSE MUSIC";

                })
                .catch(function () {

                    // Kalau browser tetap memblokir autoplay,
                    // tombol akan tampil "PLAY MUSIC" agar user tinggal klik sekali
                    button.innerText =
                        "▶ PLAY MUSIC";

                });

        }


        function pauseBackgroundMusic() {

            const music =
                document.getElementById("bgMusic");


            music.pause();

        }


        function toggleMusic() {

            const music =
                document.getElementById("bgMusic");

            const button =
                document.getElementById("musicToggleButton");


            if (music.paused) {

                music
                    .play()
                    .then(function () {

                        button.innerText =
                            "⏸ PAUSE MUSIC";

                    });

            } else {

                music.pause();

                button.innerText =
                    "▶ PLAY MUSIC";

            }

        }

function showWrongPasswordPopup() {

    // Cegah popup menumpuk kalau tombol ditekan berulang
    if (document.querySelector(".error-overlay")) {
        return;
    }

    // Buat overlay
    const overlay =
        document.createElement("div");

    overlay.className =
        "error-overlay";

    // Buat isi popup
    const content =
        document.createElement("div");

    content.className =
        "error-content";

    // Foto KUMIMARAH
    const image =
        document.createElement("img");

    image.src =
        "KUMIMARAH.PNG";

    image.alt =
        "Password Salah";

    // Tulisan SALAH!
    const title =
        document.createElement("div");

    title.className =
        "error-title";

    title.innerText =
        "SALAH!";

    content.appendChild(image);
    content.appendChild(title);

    // Buat burst tanda tanya
    for (let i = 0; i < 12; i++) {

        const question =
            document.createElement("span");

        question.className =
            "question-mark";

        question.innerText =
            "?";

        const angle =
            (Math.PI * 2 / 12) * i;

        const distance =
            90 + Math.random() * 80;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        question.style.setProperty(
            "--tx",
            x + "px"
        );

        question.style.setProperty(
            "--ty",
            y + "px"
        );

        question.style.setProperty(
            "--rot",
            (-35 + Math.random() * 70) + "deg"
        );

        content.appendChild(question);
    }

    overlay.appendChild(content);

    document.body.appendChild(overlay);

    // Setelah 1.5 detik, mulai fade out
    setTimeout(function () {

        overlay.classList.add("fade-out");

        // Setelah fade out selesai, hapus popup & kembali ke Home
        setTimeout(function () {

            overlay.remove();

            document
                .getElementById("password")
                .value = "";

            document
                .getElementById("message")
                .innerText = "";

            showPage("home");

        }, 600);

    }, 1500);
}

            );

    /* =====================================================

    ===================================================== */

        document.getElementById("starContainer");


    if (page3Container) {

        page3Container.innerHTML = "";


        const columns = 5;
        const rows = 4;

        const numberOfStars = columns * rows;


        for (let i = 0; i < numberOfStars; i++) {

            const star =
                document.createElement("div");

            star.classList.add("star-p3");


            // Ukuran kecil & berbeda-beda
            const size =
                20 + Math.random() * 28;

            star.style.setProperty(
                "--size",
                size + "px"
            );


            // Sebar merata: satu bintang per sel grid,
            // dengan sedikit pergeseran acak di dalam selnya
            const column = i % columns;
            const row = Math.floor(i / columns);

            const cellWidth = 100 / columns;
            const cellHeight = 100 / rows;

            const left =
                (column * cellWidth) +
                (cellWidth * 0.15) +
                (Math.random() * cellWidth * 0.55);

            const top =
                (row * cellHeight) +
                (cellHeight * 0.15) +
                (Math.random() * cellHeight * 0.55);

            star.style.setProperty(
                "--left",
                left + "%"
            );

            star.style.setProperty(
                "--top",
                top + "%"
            );


            // Blur random
            star.style.setProperty(
                "--blur",
                (Math.random() * 2.5) + "px"
            );


            // Transparansi random
            star.style.setProperty(
                "--opacity",
                (0.35 + Math.random() * 0.45).toFixed(2)
            );


            // Gerak kiri-kanan random
            star.style.setProperty(
                "--x1",
                (-25 - Math.random() * 20) + "px"
            );

            star.style.setProperty(
                "--x2",
                (25 + Math.random() * 20) + "px"
            );


            // Rotasi halus
            star.style.setProperty(
                "--r1",
                (-12 - Math.random() * 10) + "deg"
            );

            star.style.setProperty(
                "--r2",
                (12 + Math.random() * 10) + "deg"
            );


            // Durasi lambat & random
            const duration =
                12 + Math.random() * 10;

            star.style.setProperty(
                "--duration",
                duration + "s"
            );


            // Delay random supaya tidak serempak
            star.style.animationDelay =
                (-Math.random() * duration) + "s";


            page3Container.appendChild(star);

        }

    }

}

        /* =====================================================
           TYPEWRITER
        ===================================================== */

        function runTypewriter(element, text, duration, onFinish) {

            // Hentikan ketikan sebelumnya kalau ada
            if (element.typingTimer) {

                clearInterval(element.typingTimer);

            }


            element.innerText = "";


            let index = 0;


            const speed =
                Math.max(
                    12,
                    Math.round(duration / text.length)
                );


            element.typingTimer =
                setInterval(
                    function () {

                        index++;

                        element.innerText =
                            text.slice(0, index);


                        if (index >= text.length) {

                            clearInterval(element.typingTimer);

                            element.typingTimer = null;


                            if (onFinish) {

                                onFinish();

                            }

                        }

                    },
                    speed
                );

        }

            const colors = [
                "#F6E7A1",
                "#F7C6C7",
                "#C6DEF1",
                "#C9E4C5",
                "#E2C6F1",
                "#F9D5A7"
            ];

                const confetti =
                    document.createElement("div");

                confetti.classList.add("confetti-b3");


                const inner =
                    document.createElement("div");

                inner.classList.add("confetti-b3-inner");

                confetti.appendChild(inner);


                confetti.style.setProperty(
                    "--color",
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ]
                );


                confetti.style.setProperty(
                    "--width",
                    (5 + Math.random() * 9) + "px"
                );

                confetti.style.setProperty(
                    "--height",
                    (8 + Math.random() * 16) + "px"
                );


                const angle =
                    Math.random() * Math.PI * 2;


                const distance =
                    280 + Math.random() * 650;


                confetti.style.setProperty(
                    "--x",
                    (Math.cos(angle) * distance) + "px"
                );

                confetti.style.setProperty(
                    "--y",
                    (Math.sin(angle) * distance) + "px"
                );


                confetti.style.setProperty(
                    "--rotation",
                    (-720 + Math.random() * 1440) + "deg"
                );


                confetti.style.setProperty(
                    "--duration",
                    (2.5 + Math.random() * 1.5) + "s"
                );


                // Setelah menyebar, melayang pelan
                confetti.addEventListener(
                    "animationend",
                    function handler(event) {

                        if (event.animationName === "confettiGrowSettle") {

                            confetti.style.setProperty(
                                "--fx",
                                (-18 + Math.random() * 36) + "px"
                            );

                            confetti.style.setProperty(
                                "--fy",
                                (-18 + Math.random() * 36) + "px"
                            );

                            confetti.style.setProperty(
                                "--float-duration",
                                (4 + Math.random() * 4) + "s"
                            );

                            confetti.classList.add("floating");

                            confetti.removeEventListener(
                                "animationend",
                                handler
                            );

                        }

                    }
                );


                document
                    .getElementById("pageB3")
                    .appendChild(confetti);

            }

        }

        /* =====================================================

        ===================================================== */

        function formatDate(dateString) {

            const parts =
                dateString.split("-");


            if (parts.length !== 3) {

                return dateString;

            }


            return (
                parts[2] +
                "/" +
                parts[1] +
                "/" +
                parts[0]
            );

        }

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            query,
            orderBy,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


        /* =====================================================
           KONFIGURASI FIREBASE

        ===================================================== */

        const firebaseConfig = {
            apiKey:            "AIzaSyBneMxQUXpdQGsPbX2BWmBa7xzNyoSbqKI",
            authDomain:        "letter-f6b9f.firebaseapp.com",
            projectId:         "letter-f6b9f",
            storageBucket:     "letter-f6b9f.firebasestorage.app",
            messagingSenderId: "113568950076",
            appId:             "1:113568950076:web:743ed1c2af2318c3b12039"
        };


        const isConfigured =
            !JSON.stringify(firebaseConfig).includes("PASTE_");


        let lettersCache = [];

        let isLoaded = false;

        let db = null;


        /* =====================================================
           PESAN DI DAFTAR SURAT
        ===================================================== */

        function showListMessage(message) {

            const container =
                document.getElementById("lettersContainer");


            if (!container) {

                return;

            }


            container.innerHTML =
                '<p style="text-align:center; color:#80694F;' +
                ' font-family:Georgia, serif;">' +
                message +
                '</p>';

        }


        /* =====================================================
           TAMPILKAN DAFTAR SURAT
        ===================================================== */

        function renderLetters() {

            const container =
                document.getElementById("lettersContainer");


            if (!container) {

                return;

            }


            if (!isConfigured) {

                showListMessage(
                    "firebase belum diatur, surat belum bisa dibaca."
                );

                return;

            }


            if (!isLoaded) {

                showListMessage("memuat surat...");

                return;

            }


            if (lettersCache.length === 0) {

                showListMessage("belum ada random day letter.");

                return;

            }


            container.innerHTML = "";


            lettersCache.forEach(letter => {

                const button =
                    document.createElement("button");

                button.className =
                    "saved-letter-button";


                button.innerHTML =
                    '<span class="saved-letter-date">' +
                    window.formatDate(letter.date) +
                    '</span>' +
                    '<span class="saved-letter-name">' +
                    window.escapeHTML(letter.author) +
                    '</span>';


                button.onclick = function () {

                    window.openLetter(letter);

                };


                container.appendChild(button);

            });

        }


        /* =====================================================
           HUBUNGKAN KE FIRESTORE
        ===================================================== */

        if (isConfigured) {

            try {

                const app =
                    initializeApp(firebaseConfig);

                db = getFirestore(app);


                const lettersQuery =
                    query(
                        collection(db, "randomDayLetters"),
                        orderBy("createdAt", "desc")
                    );


                // Realtime: surat baru langsung muncul
                onSnapshot(
                    lettersQuery,
                    function (snapshot) {

                        lettersCache =
                            snapshot.docs.map(doc => doc.data());

                        isLoaded = true;

                        renderLetters();

                    },
                    function (error) {

                        console.error(error);

                        showListMessage(
                            "gagal memuat surat, coba muat ulang halaman."
                        );

                    }
                );

            } catch (error) {

                console.error(error);

            }

        }


        /* =====================================================
           LOAD LETTERS — dipanggil tombol di page L1
        ===================================================== */

        window.loadLetters = function () {

            renderLetters();

        };


        /* =====================================================
           SEND LETTER — simpan ke Firestore
        ===================================================== */

        window.sendLetter = async function () {

            const dateField =
                document.getElementById("letterDate");

            const timeField =
                document.getElementById("letterTime");

            const messageField =
                document.getElementById("letterMessage");

            const authorField =
                document.getElementById("letterAuthor");


            const date = dateField.value;
            const time = timeField.value;
            const message = messageField.value.trim();
            const author = authorField.value.trim();


            // Validasi
            if (!date || !time || !message || !author) {

                alert(
                    "Tolong isi semua bagian surat terlebih dahulu."
                );

                return;

            }


            if (!isConfigured || !db) {

                alert(
                    "Firebase belum diatur, surat belum bisa dikirim."
                );

                return;

            }


            const sendButton =
                document.querySelector(".send-letter-button");


            sendButton.disabled = true;

            sendButton.innerText = "MENGIRIM...";


            try {

                await addDoc(
                    collection(db, "randomDayLetters"),
                    {
                        date: date,
                        time: time,
                        message: message,
                        author: author,
                        createdAt: serverTimestamp()
                    }
                );


                // Reset form
                dateField.value = "";
                timeField.value = "";
                messageField.value = "";
                authorField.value = "";


                alert("Surat berhasil dikirim ♡");


                window.showPage("pageLB1");

                renderLetters();

            } catch (error) {

                console.error(error);

                alert(
                    "Surat gagal dikirim, coba lagi sebentar."
                );

            } finally {

                sendButton.disabled = false;

                sendButton.innerText = "KIRIM";

            }

        };

    </script>
