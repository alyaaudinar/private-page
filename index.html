<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: 'Poppins', sans-serif;

    background: #f7f5f2;

    color: #333;

    overflow: hidden;

}


/* =====================================================
   PAGE SYSTEM
===================================================== */

.page {

    min-height: 100vh;

    width: 100%;

    display: none;

    position: relative;

    justify-content: center;

    align-items: center;

}

.page.active {

    display: flex;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    position: fixed;

    top: 20px;

    left: 20px;

    z-index: 9999;

    width: auto;

    padding: 9px 18px;

    margin: 0;

    border: none;

    border-radius: 10px;

    background: rgba(54, 69, 79, 0.7);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease;

}

.back-button:hover {

    background: #36454F;

    transform: scale(1.08);

}


/* =====================================================
   MAIN LOGIN PAGE
===================================================== */

.login-box {

    width: 90%;

    max-width: 400px;

    text-align: center;

    position: relative;

    z-index: 10;

}

.login-box h1 {

    font-size: 24px;

    font-weight: 700;

    margin-bottom: 10px;

}

.clue {

    color: #888;

    font-size: 14px;

    margin-bottom: 25px;

}

.password-input {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    text-align: center;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    outline: none;

}

.unlock-button {

    width: 100%;

    margin-top: 12px;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #A6A6A6;

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        background 0.25s ease;

}

.unlock-button:hover {

    background: #777;

    transform: scale(1.05);

}

#message {

    font-size: 14px;

    margin-top: 15px;

}


/* =====================================================
   STARS
===================================================== */

.star {

    position: fixed;

    width: var(--size);

    height: var(--size);

    background: var(--color);

    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    opacity: 0.7;

    pointer-events: none;

    z-index: 1;

    animation:
        starFloat var(--duration) ease-in-out infinite alternate;

}


/*
   Gerakan random kiri-kanan,
   bukan dari ujung kiri ke kanan.
*/

@keyframes starFloat {

    0% {

        transform:
            translate(
                var(--move1),
                var(--moveY1)
            )
            rotate(0deg);

    }

    50% {

        transform:
            translate(
                var(--move2),
                var(--moveY2)
            )
            rotate(8deg);

    }

    100% {

        transform:
            translate(
                var(--move3),
                var(--moveY3)
            )
            rotate(-8deg);

    }

}


/* =====================================================
   B1
===================================================== */

#pageB1 {

    background: #f7f5f2;

    overflow: hidden;

    flex-direction: column;

}


/* TITLE */

.birthday-title {

    position: relative;

    z-index: 20;

    margin: 0 20px 15px;

    text-align: center;

    font-size: clamp(28px, 7vw, 52px);

    line-height: 1.2;

    color: #373757;

    font-weight: 700;

    text-shadow:
        2px 2px 0 rgba(0,0,0,0.2);

}


/* =====================================================
   BIRTHDAY PHOTO
===================================================== */

.birthday-photo {

    position: relative;

    z-index: 20;

    width: min(500px, 75vw);

    height: auto;

    max-height: 55vh;

    object-fit: contain;

    display: block;

    background: transparent;

    border: none;

    box-shadow: none;

    animation: heartbeat 2.2s ease-in-out infinite;

}


/*
   Foto membesar-kecil seperti heartbeat
*/

@keyframes heartbeat {

    0% {

        transform: scale(1);

    }

    25% {

        transform: scale(1.035);

    }

    40% {

        transform: scale(1);

    }

    60% {

        transform: scale(1.045);

    }

    100% {

        transform: scale(1);

    }

}


/* =====================================================
   BIRTHDAY LETTER BUTTON
===================================================== */

.birthday-letter-button {

    position: relative;

    z-index: 30;

    margin-top: 25px;

    padding: 16px 25px;

    max-width: 90%;

    border: none;

    border-radius: 12px;

    background: rgba(20, 38, 70, 0.5);

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    text-align: center;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

    transition:
        transform 0.25s ease,
        font-weight 0.25s ease,
        background 0.25s ease;

    text-shadow: none;

}


/* Hover */

.birthday-letter-button:hover {

    transform: scale(1.08);

    font-weight: 700;

    background: rgba(20, 38, 70, 0.75);

}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {

    position: fixed;

    left: 50%;

    top: 50%;

    width: var(--width);

    height: var(--height);

    background: var(--color);

    border-radius: 2px;

    pointer-events: none;

    z-index: 10;

    animation:
        confettiBurst var(--duration) cubic-bezier(0.15,0.8,0.2,1) infinite alternate;

}


/*
   Burst keluar dari tengah,
   lalu perlahan kembali sedikit.
   Tidak fade.
*/

@keyframes confettiBurst {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(0,0)
            rotate(0deg)
            scale(0.5);

    }

    60% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(var(--x), var(--y))
            rotate(var(--rotation))
            scale(1.5);

    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x) * 1.12),
                calc(var(--y) * 1.12)
            )
            rotate(var(--rotation))
            scale(1.8);

    }

}


/* =====================================================
   PAGE 1
===================================================== */

#page1 {

    background: #f7f5f2;

    flex-direction: column;

    text-align: center;

}

.page1-title {

    font-size: 30px;

    font-weight: 700;

}

.page1-text {

    font-size: 16px;

    color: #555;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 600px) {

    .birthday-title {

        font-size: 30px;

    }

    .birthday-photo {

        width: 78vw;

        max-height: 48vh;

    }

    .birthday-letter-button {

        font-size: 13px;

        padding: 14px 18px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     PAGE UTAMA
===================================================== -->

<section id="home" class="page active">


    <!-- BINTANG -->

    <div id="stars"></div>


    <div class="login-box">

        <h1>
            Access Password
        </h1>


        <p class="clue">
            tanggal lahir pemilik website
        </p>


        <input
            id="password"
            class="password-input"
            type="password"
            placeholder="enter password"
        >


        <button
            class="unlock-button"
            onclick="checkPassword()"
        >
            Unlock
        </button>


        <p id="message"></p>

    </div>

</section>



<!-- =====================================================
     B1
===================================================== -->

<section id="pageB1" class="page">


    <button
        class="back-button"
        onclick="goHome()"
    >
        BACK
    </button>


    <h1 class="birthday-title">

        SELAMAT ULANG TAHUN JAFAR!!!

    </h1>


    <img
        src="BIRTHDAY.PNG"
        alt="Birthday"
        class="birthday-photo"
    >


    <button
        class="birthday-letter-button"
        onclick="openBirthdayLetter()"
    >

        CLICK HERE TO READ YOUR BIRTHDAY LETTER FROM ALYA AUDINAR

    </button>


</section>



<!-- =====================================================
     PAGE 1
===================================================== -->

<section id="page1" class="page">


    <button
        class="back-button"
        onclick="goHome()"
    >
        BACK
    </button>


    <h1 class="page1-title">

        PAGE 1

    </h1>


    <p class="page1-text">

        OG LETTER PAGE

    </p>


</section>



<script>


/* =====================================================
   PASSWORD
===================================================== */

function checkPassword() {


    const password =
        document.getElementById("password").value;


    const message =
        document.getElementById("message");


    /*
       PASSWORD B1
    */

    if (password === "20061215") {

        showPage("pageB1");

        createConfetti();

        return;

    }


    /*
       PASSWORD PAGE 1
    */

    if (password === "24122006") {

        showPage("page1");

        return;

    }


    /*
       SALAH
    */

    message.innerText =
        "coba lagi ...";

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(pageId) {


    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

        });


    document
        .getElementById(pageId)
        .classList.add("active");

}


/* =====================================================
   BACK HOME
===================================================== */

function goHome() {


    showPage("home");


    document
        .getElementById("password")
        .value = "";


    document
        .getElementById("message")
        .innerText = "";

}


/* =====================================================
   ENTER PASSWORD PLACEHOLDER
===================================================== */

document
    .getElementById("password")
    .addEventListener("focus", function() {

        this.placeholder = "";

    });


document
    .getElementById("password")
    .addEventListener("blur", function() {

        if (this.value === "") {

            this.placeholder =
                "enter password";

        }

    });


/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            checkPassword();

        }

    });


/* =====================================================
   CREATE STARS
===================================================== */

function createStars() {


    const container =
        document.getElementById("stars");


    const colors = [

        "#F6E7A1",

        "#F7C6C7",

        "#C6DEF1",

        "#C9E4C5",

        "#E2C6F1",

        "#F9D5A7"

    ];


    for (let i = 0; i < 30; i++) {


        const star =
            document.createElement("div");


        star.classList.add("star");


        const size =
            15 + Math.random() * 25;


        star.style.setProperty(
            "--size",
            size + "px"
        );


        star.style.left =
            Math.random() * 100 + "vw";


        star.style.top =
            Math.random() * 100 + "vh";


        star.style.setProperty(
            "--color",
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ]
        );


        /*
           Gerakan kecil random
           di sekitar posisi awal.
        */

        star.style.setProperty(
            "--move1",
            (-15 + Math.random() * 30) + "px"
        );


        star.style.setProperty(
            "--move2",
            (-30 + Math.random() * 60) + "px"
        );


        star.style.setProperty(
            "--move3",
            (-15 + Math.random() * 30) + "px"
        );


        star.style.setProperty(
            "--moveY1",
            (-10 + Math.random() * 20) + "px"
        );


        star.style.setProperty(
            "--moveY2",
            (-15 + Math.random() * 30) + "px"
        );


        star.style.setProperty(
            "--moveY3",
            (-10 + Math.random() * 20) + "px"
        );


        star.style.setProperty(
            "--duration",
            (7 + Math.random() * 7) + "s"
        );


        container.appendChild(star);

    }

}


/* =====================================================
   CREATE CONFETTI
===================================================== */

function createConfetti() {


    /*
       Hapus confetti lama
    */

    document
        .querySelectorAll(".confetti")
        .forEach(c => c.remove());


    const colors = [

        "#F6E7A1",

        "#F7C6C7",

        "#C6DEF1",

        "#C9E4C5",

        "#E2C6F1",

        "#F9D5A7"

    ];


    /*
       Banyak confetti
    */

    for (let i = 0; i < 100; i++) {


        const confetti =
            document.createElement("div");


        confetti.classList.add("confetti");


        /*
           Warna
        */

        confetti.style.setProperty(
            "--color",
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ]
        );


        /*
           Ukuran
        */

        confetti.style.setProperty(
            "--width",
            (6 + Math.random() * 8) + "px"
        );


        confetti.style.setProperty(
            "--height",
            (10 + Math.random() * 14) + "px"
        );


        /*
           Arah burst
        */

        const angle =
            Math.random() * Math.PI * 2;


        const distance =
            180 + Math.random() * 300;


        const x =
            Math.cos(angle) * distance;


        const y =
            Math.sin(angle) * distance;


        confetti.style.setProperty(
            "--x",
            x + "px"
        );


        confetti.style.setProperty(
            "--y",
            y + "px"
        );


        /*
           Rotasi
        */

        confetti.style.setProperty(
            "--rotation",
            (-360 + Math.random() * 720) + "deg"
        );


        /*
           Kecepatan berbeda
        */

        confetti.style.setProperty(
            "--duration",
            (2.5 + Math.random() * 2.5) + "s"
        );


        document
            .getElementById("pageB1")
            .appendChild(confetti);

    }

}


/* =====================================================
   BIRTHDAY LETTER
===================================================== */

function openBirthdayLetter() {


    /*
       GANTI LINK INI NANTI
       dengan link Google Drive PDF
    */

    window.location.href =
        "https://drive.google.com";


}


/* =====================================================
   INITIALIZE
===================================================== */

createStars();

</script>


</body>

</html>
