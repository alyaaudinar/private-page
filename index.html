<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access</title>


    <!-- =========================
         GOOGLE FONT - POPPINS
    ========================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
          rel="stylesheet">


    <!-- =========================
         CSS
    ========================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================== */

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f7f5f2;

            font-family: 'Poppins', sans-serif;

            color: #333;

            overflow: hidden;

        }


        /* =========================
           MAIN BOX
        ========================== */

        .box {

            width: 90%;

            max-width: 400px;

            text-align: center;

            position: relative;

            z-index: 10;

        }


        /* =========================
           TITLE
        ========================== */

        h1 {

            margin: 0 0 18px 0;

            font-family: 'Poppins', sans-serif;

            font-size: 24px;

            font-weight: 700;

            line-height: 1.5;

        }


        /* =========================
           CLUE
        ========================== */

        .clue {

            margin: 0 0 25px 0;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 400;

            color: #888;

        }


        /* =========================
           PASSWORD INPUT
        ========================== */

        input {

            width: 100%;

            padding: 12px 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            background: white;

            text-align: center;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 400;

            outline: none;

        }


        input:focus {

            border-color: #999;

        }


        /* =========================
           UNLOCK BUTTON
        ========================== */

        button {

            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #A6A6A6;

            color: white;

            cursor: pointer;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        button:hover {

            background: #7A7A7A;

            transform: scale(1.05);

        }


        /* =========================
           WRONG PASSWORD MESSAGE
        ========================== */

        #message {

            margin-top: 20px;

            min-height: 23px;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 400;

            color: #555;

        }


        /* =========================
           PASTEL STARS
        ========================== */

        .star {

            position: fixed;

            z-index: 1;

            pointer-events: none;

            user-select: none;

            opacity: 0.65;

            font-family: Arial, sans-serif;

            animation-name: starMove;

            animation-timing-function: ease-in-out;

            animation-iteration-count: infinite;

        }


        /* =========================
           SLOW RANDOM MOVEMENT
           
           Bintang bergerak di sekitar
           posisi awalnya.
           
           Tidak bergerak lurus
           kiri → kanan.
        ========================== */

        @keyframes starMove {

            0% {

                transform:
                    translate(0px, 0px)
                    rotate(0deg);

            }

            20% {

                transform:
                    translate(15px, -10px)
                    rotate(8deg);

            }

            40% {

                transform:
                    translate(-12px, 12px)
                    rotate(-8deg);

            }

            60% {

                transform:
                    translate(10px, 16px)
                    rotate(6deg);

            }

            80% {

                transform:
                    translate(-15px, -8px)
                    rotate(-7deg);

            }

            100% {

                transform:
                    translate(0px, 0px)
                    rotate(0deg);

            }

        }


        /* =========================
           OTHER PAGES
        ========================== */

        .page {

            display: none;

            width: 100%;

            min-height: 100vh;

            position: fixed;

            inset: 0;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;

            z-index: 20;

        }


        /* =========================
           BACK BUTTON
        ========================== */

        .back-button {

            position: fixed;

            top: 20px;

            left: 20px;

            width: auto;

            margin: 0;

            padding: 8px 16px;

            background: #555;

            color: white;

            border-radius: 8px;

            font-family: 'Poppins', sans-serif;

            font-size: 13px;

            font-weight: 700;

            z-index: 100;

        }


        .back-button:hover {

            background: #333;

        }

    </style>

</head>


<body>


    <!-- =========================
         CREATE STARS
    ========================== -->

    <script>

        const starColors = [

            "#F6E7A1",

            "#F7C6C7",

            "#C6DEF1",

            "#C9E4C5",

            "#E2C6F1",

            "#F9D5A7"

        ];


        function createStars() {

            const starCount = 18;


            for (
                let i = 0;
                i < starCount;
                i++
            ) {


                const star =
                    document.createElement("div");


                star.classList.add("star");


                /*
                 * BINTANG 5 SISI
                 */

                star.innerHTML = "★";


                /*
                 * RANDOM PASTEL COLOR
                 */

                star.style.color =
                    starColors[
                        Math.floor(
                            Math.random()
                            * starColors.length
                        )
                    ];


                /*
                 * RANDOM SIZE
                 *
                 * 28px - 50px
                 */

                star.style.fontSize =
                    (
                        28 +
                        Math.random() * 22
                    ) + "px";


                /*
                 * RANDOM POSITION
                 *
                 * MEMENUHI SELURUH LAYAR
                 */

                star.style.left =
                    (
                        3 +
                        Math.random() * 94
                    ) + "%";


                star.style.top =
                    (
                        3 +
                        Math.random() * 94
                    ) + "%";


                /*
                 * RANDOM SPEED
                 *
                 * 8 - 14 DETIK
                 *
                 * semakin besar = semakin lambat
                 */

                star.style.animationDuration =
                    (
                        8 +
                        Math.random() * 6
                    ) + "s";


                /*
                 * RANDOM START TIME
                 */

                star.style.animationDelay =
                    (
                        Math.random() * 8
                    ) + "s";


                document.body.appendChild(star);

            }

        }


        createStars();

    </script>



    <!-- =========================
         MAIN PAGE
    ========================== -->

    <div
        class="box"
        id="mainPage"
    >


        <div id="login">


            <h1>
                Access Password
            </h1>


            <p class="clue">
                clue: tanggal lahir pemilik website
            </p>


            <input
                type="password"
                id="password"
                placeholder="enter password"

                onfocus="
                    this.placeholder=''
                "

                onblur="
                    if(this.value === '')
                    this.placeholder='enter password'
                "

                onkeydown="
                    if(event.key === 'Enter')
                    checkPassword()
                "
            >


            <button
                onclick="checkPassword()"
            >
                Unlock
            </button>


            <p id="message"></p>


        </div>


    </div>



    <!-- =========================
         PAGE 1
         
         PASSWORD:
         24122006
    ========================== -->

    <div
        class="page"
        id="page1"
    >


        <button
            class="back-button"
            onclick="goBack()"
        >
            Back
        </button>


        <div>

            <h1>
                OG LETTER
            </h1>


            <p>
                Page 1
            </p>

        </div>


    </div>



    <!-- =========================
         B1
         
         PASSWORD:
         20061215
    ========================== -->

    <div
        class="page"
        id="B1"
    >


        <button
            class="back-button"
            onclick="goBack()"
        >
            Back
        </button>


        <div>

            <h1>
                SELAMAT ULANG TAHUN JAFAR
            </h1>


            <p>
                B1
            </p>

        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        /* =========================
           CHECK PASSWORD
        ========================== */

        function checkPassword() {


            const passwordInput =
                document.getElementById(
                    "password"
                );


            const password =
                passwordInput.value.trim();


            const message =
                document.getElementById(
                    "message"
                );


            /*
             * PASSWORD 24122006
             *
             * → PAGE 1
             */

            if (
                password === "24122006"
            ) {

                showPage("page1");

                return;

            }


            /*
             * PASSWORD 20061215
             *
             * → B1
             */

            if (
                password === "20061215"
            ) {

                showPage("B1");

                return;

            }


            /*
             * PASSWORD SALAH
             */

            message.innerText =
                "astaga? kok salah?";


            passwordInput.value = "";

        }



        /* =========================
           SHOW PAGE
        ========================== */

        function showPage(pageId) {


            /*
             * HIDE MAIN PAGE
             */

            document.getElementById(
                "mainPage"
            ).style.display = "none";


            /*
             * HIDE ALL OTHER PAGES
             */

            const pages =
                document.querySelectorAll(
                    ".page"
                );


            pages.forEach(
                function(page) {

                    page.style.display =
                        "none";

                }
            );


            /*
             * SHOW SELECTED PAGE
             */

            const selectedPage =
                document.getElementById(
                    pageId
                );


            selectedPage.style.display =
                "flex";

        }



        /* =========================
           BACK TO MAIN PAGE
        ========================== */

        function goBack() {


            /*
             * HIDE ALL PAGES
             */

            const pages =
                document.querySelectorAll(
                    ".page"
                );


            pages.forEach(
                function(page) {

                    page.style.display =
                        "none";

                }
            );


            /*
             * SHOW MAIN PAGE
             */

            document.getElementById(
                "mainPage"
            ).style.display =
                "block";


            /*
             * RESET INPUT
             */

            document.getElementById(
                "password"
            ).value = "";


            /*
             * RESET MESSAGE
             */

            document.getElementById(
                "message"
            ).innerText = "";

        }

    </script>


</body>

</html>
