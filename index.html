<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access</title>

<!-- POPPINS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
rel="stylesheet">


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {

    background: #f7f5f2;

    font-family: 'Poppins', sans-serif;

    color: #333;

    overflow: hidden;
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

.page {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    justify-content: center;
    align-items: center;

    text-align: center;
}

.page.active {
    display: flex;
}


/* =========================================================
   PAGE 0 — LOGIN
========================================================= */

#pageHome {

    background: #f7f5f2;

}


/* LOGIN CONTENT */

.login-box {

    position: relative;

    z-index: 20;

    width: 90%;

    max-width: 400px;

    text-align: center;
}


/* TITLE */

.login-box h1 {

    margin-bottom: 12px;

    font-family: 'Poppins', sans-serif;

    font-size: 24px;

    font-weight: 700;

}


/* CLUE */

.clue {

    margin-top: 0;

    margin-bottom: 25px;

    color: #888;

    font-size: 14px;

    font-weight: 400;

}


/* INPUT */

input {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    outline: none;

    background: white;

    text-align: center;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 400;
}


input:focus {

    border-color: #999;

}


/* UNLOCK BUTTON */

.unlock-button {

    width: 100%;

    margin-top: 12px;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #A6A6A6;

    color: white;

    cursor: pointer;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}


.unlock-button:hover {

    background: #777;

    transform: scale(1.04);

}


/* =========================================================
   HOME STARS
========================================================= */

.star {

    position: absolute;

    z-index: 1;

    width: var(--size);

    height: var(--size);

    background: var(--color);

    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 95%,
        50% 72%,
        21% 95%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    opacity: 0.7;

    animation:
        starFloat
        var(--duration)
        ease-in-out
        infinite
        alternate;
}


/*
    IMPORTANT:

    Bintang tidak bergerak dari ujung kiri
    ke ujung kanan.

    Mereka tetap berada di area masing-masing
    dan hanya bergerak random kecil
    kiri-kanan + atas-bawah.
*/

@keyframes starFloat {

    0% {

        transform:
            translate(
                var(--x1),
                var(--y1)
            )
            rotate(0deg);

    }

    50% {

        transform:
            translate(
                var(--x2),
                var(--y2)
            )
            rotate(12deg);

    }

    100% {

        transform:
            translate(
                var(--x3),
                var(--y3)
            )
            rotate(-8deg);

    }

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {

    position: fixed;

    top: 20px;

    left: 20px;

    z-index: 1000;

    border: none;

    border-radius: 8px;

    padding: 9px 18px;

    background: rgba(54,69,79,0.8);

    color: white;

    cursor: pointer;

    font-family: 'Poppins', sans-serif;

    font-size: 13px;

    font-weight: 700;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}


.back-button:hover {

    background: #36454F;

    transform: scale(1.08);

}


/* =========================================================
   PAGE 1 — 24122006
========================================================= */

#page1 {

    flex-direction: column;

    background: #f7f5f2;

}


.page-title {

    font-size: 30px;

    font-weight: 700;

    color: #36454F;

    text-shadow:
        3px 3px 0 white;

}


/* =========================================================
   B1 — 20061215
========================================================= */

#pageB1 {

    flex-direction: column;

    background: #f7f5f2;

}


/* B1 TITLE */

#birthdayTitle {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    max-width: 90vw;

    margin-bottom: 20px;

    font-size: clamp(25px, 5vw, 45px);

    font-weight: 700;

    color: #e5b5c0;

    text-shadow:
        3px 3px 0 white,
        5px 5px 0 rgba(54,69,79,0.25);

}


/* LETTER ANIMATION */

.letter {

    display: inline-block;

    opacity: 0;

    transform: scale(0);

    animation:
        letterPop
        0.6s
        cubic-bezier(0.34,1.56,0.64,1)
        forwards;
}


@keyframes letterPop {

    0% {

        opacity: 0;

        transform:
            scale(0)
            rotate(-15deg);

    }

    70% {

        opacity: 1;

        transform:
            scale(1.2)
            rotate(5deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


/* =========================================================
   BIRTHDAY PHOTO
========================================================= */

.birthday-stage {

    position: relative;

    width: min(85vw, 500px);

    height: min(60vh, 450px);

    display: flex;

    justify-content: center;

    align-items: center;
}


#birthdayPhoto {

    position: relative;

    z-index: 10;

    width: min(65vw, 300px);

    height: min(65vw, 300px);

    object-fit: cover;

    border-radius: 10px;

    box-shadow:
        8px 8px 0 #d6c7b8,
        12px 12px 20px rgba(0,0,0,0.15);

    opacity: 0;

    transform:
        scale(0)
        rotate(-10deg);

    animation:
        scrapbookPop
        1.5s
        0.9s
        cubic-bezier(0.34,1.56,0.64,1)
        forwards;
}


@keyframes scrapbookPop {

    0% {

        opacity: 0;

        transform:
            scale(0)
            rotate(-12deg);

    }

    45% {

        opacity: 1;

        transform:
            scale(1.15)
            rotate(5deg);

    }

    65% {

        transform:
            scale(0.92)
            rotate(-3deg);

    }

    80% {

        transform:
            scale(1.05)
            rotate(2deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


/* =========================================================
   B1 CONFETTI
========================================================= */

.confetti {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 10px;

    height: 16px;

    border-radius: 2px;

    z-index: 5;

    opacity: 1;

    animation:
        confettiBurst
        var(--duration)
        var(--delay)
        cubic-bezier(0.15,0.8,0.2,1)
        forwards;
}


@keyframes confettiBurst {

    0% {

        transform:
            translate(-50%,-50%)
            translate(0,0)
            scale(0.2)
            rotate(0deg);

    }

    45% {

        transform:
            translate(-50%,-50%)
            translate(
                calc(var(--x) * 0.65),
                calc(var(--y) * 0.65)
            )
            scale(1.7)
            rotate(var(--rotation));

    }

    100% {

        transform:
            translate(-50%,-50%)
            translate(
                var(--x),
                var(--y)
            )
            scale(2.5)
            rotate(var(--rotation));

    }

}


/* =========================================================
   BIRTHDAY LETTER BUTTON
========================================================= */

.birthday-letter-button {

    position: relative;

    z-index: 20;

    margin-top: 5px;

    padding: 15px 25px;

    max-width: 90vw;

    border: none;

    border-radius: 10px;

    background: rgba(20,39,74,0.7);

    color: white;

    cursor: pointer;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;

    font-weight: 700;

    line-height: 1.5;

    box-shadow:
        3px 3px 0 rgba(0,0,0,0.3);

    opacity: 0;

    transform: scale(0.8);

    animation:
        buttonAppear
        0.8s
        5s
        cubic-bezier(0.34,1.56,0.64,1)
        forwards;

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}


.birthday-letter-button:hover {

    background: rgba(10,25,55,0.95);

    transform: scale(1.08);

}


@keyframes buttonAppear {

    0% {

        opacity: 0;

        transform: scale(0.8);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .login-box h1 {

        font-size: 22px;

    }

    #birthdayTitle {

        font-size: 25px;

        padding: 0 15px;

    }

    #birthdayPhoto {

        width: 240px;

        height: 240px;

    }

    .birthday-letter-button {

        font-size: 13px;

        padding: 13px 18px;

    }

}

</style>

</head>


<body>


<!-- =====================================================

===================================================== -->

<div

    <!-- STARS -->

    <div class="star"

===================================================== -->

<div
    id="page1"
    class="page"
>


    <button
        class="back-button"
        onclick="showPage('pageHome')"
    >
        BACK
    </button>


    <h1 class="page-title">
        PAGE 1
    </h1>

</div>



<!-- =====================================================
     B1
     PASSWORD: 20061215
===================================================== -->

<div
    id="pageB1"
    class="page"
>


    <button
        class="back-button"
        onclick="showPage('pageHome')"
    >
        BACK
    </button>


    <!-- TITLE -->

    <div id="birthdayTitle"></div>


    <!-- PHOTO -->

    <div
        class="birthday-stage"
        id="birthdayStage"
    >

        <img
            id="birthdayPhoto"
            src="BIRTHDAY.PNG"
            alt="Birthday"
        >

    </div>


    <!-- LETTER -->

    <button
        class="birthday-letter-button"
        onclick="openBirthdayLetter()"
    >

        CLICK HERE TO READ YOUR BIRTHDAY LETTER
        FROM ALYA AUDINAR

    </button>


</div>



<script>


/* =========================================================
   SHOW PAGE
========================================================= */

function showPage(pageId) {


    document
        .querySelectorAll('.page')
        .forEach(function(page) {

            page.classList.remove('active');

        });


    document
        .getElementById(pageId)
        .classList.add('active');


}


/* =========================================================
   CHECK PASSWORD
========================================================= */

function checkPassword() {


    const password =
        document.getElementById("password").value;


    const message =
        document.getElementById("message");


    /* PASSWORD 1 */

    if (password === "24122006") {

        message.innerText = "";

        showPage("page1");

        return;

    }


    /* PASSWORD 2 */

    if (password === "20061215") {

        message.innerText = "";

        showPage("pageB1");

        startB1();

        return;

    }


    /* WRONG */

    message.innerText =
        "astaga? kok salah?";

}


/* =========================================================
   CREATE BIRTHDAY TITLE
========================================================= */

function createBirthdayTitle() {


    const title =
        "SELAMAT ULANG TAHUN JAFAR";


    const container =
        document.getElementById("birthdayTitle");


    container.innerHTML = "";


    title.split("").forEach(
        function(character, index) {


            const span =
                document.createElement("span");


            span.classList.add("letter");


            span.innerText =
                character === " "
                ? "\u00A0"
                : character;


            span.style.animationDelay =
                (index * 0.08) + "s";


            container.appendChild(span);

        }
    );

}


/* =========================================================
   CREATE B1 CONFETTI
========================================================= */

function createB1Confetti() {


    const stage =
        document.getElementById("birthdayStage");


    const colors = [

        "#F6E7A1",
        "#F7C6C7",
        "#C6DEF1",
        "#C9E4C5",
        "#E2C6F1",
        "#F9D5A7",
        "#F5B7C8"

    ];


    for (
        let i = 0;
        i < 90;
        i++
    ) {


        const confetti =
            document.createElement("div");


        confetti.classList.add(
            "confetti"
        );


        /* COLOR */

        confetti.style.background =
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ];


        /* DIRECTION */

        const angle =
            Math.random()
            * Math.PI
            * 2;


        const distance =
            150
            + Math.random() * 230;


        const x =
            Math.cos(angle)
            * distance;


        const y =
            Math.sin(angle)
            * distance;


        confetti.style.setProperty(
            "--x",
            x + "px"
        );


        confetti.style.setProperty(
            "--y",
            y + "px"
        );


        /* ROTATION */

        confetti.style.setProperty(
            "--rotation",
            (Math.random() * 1000 - 500)
            + "deg"
        );


        /* SPEED */

        confetti.style.setProperty(
            "--duration",
            (3.5 + Math.random() * 1.5)
            + "s"
        );


        /* DELAY */

        confetti.style.setProperty(
            "--delay",
            (Math.random() * 0.3)
            + "s"
        );


        /* SIZE */

        confetti.style.width =
            (7 + Math.random() * 7)
            + "px";


        confetti.style.height =
            (10 + Math.random() * 10)
            + "px";


        stage.appendChild(
            confetti
        );

    }

}


/* =========================================================
   START B1
========================================================= */

function startB1() {


    createBirthdayTitle();


    createB1Confetti();

}


/* =========================================================
   OPEN BIRTHDAY LETTER
========================================================= */

function openBirthdayLetter() {


    /*
       GANTI LINK DI BAWAH INI
       DENGAN LINK PDF GOOGLE DRIVE
       SURAT BIRTHDAY.
    */


    window.location.href =
        "https://drive.google.com/";

}

</script>
