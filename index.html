<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f5f2;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .box {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
        }

        .clue {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 15px;
        }
    </style>
</head>


<body>

    <div class="box">

        <div id="login">

            <h1>Access Password</h1>

            <p class="clue">
                clue: the day everything started
            </p>

            <input
                type="password"
                id="password"
                placeholder="enter password"
            >

            <button onclick="checkPassword()">
                Unlock
            </button>

            <p id="message"></p>

        </div>


        <div id="success" style="display:none;">

            <h1>ure doin great</h1>

        </div>

    </div>


    <script>

        function checkPassword() {

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            const login =
                document.getElementById("login");

            const success =
                document.getElementById("success");


            // PASSWORD
            const correctPassword = "123456";


            if (password === correctPassword) {

                login.style.display = "none";

                success.style.display = "block";


                // PDF GOOGLE DRIVE
                setTimeout(function() {

                    window.location.href =
                    "MASUKKAN_LINK_GOOGLE_DRIVE_DI_SINI";

                }, 1500);


            } else {

                message.innerText = "yah coba lagi";

            }

        }

    </script>

</body>

</html>
