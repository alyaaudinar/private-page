<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access</title>


    <!-- GOOGLE FONT - POPPINS -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
          rel="stylesheet">


    <!-- =========================
         CSS
    ========================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================== */

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f7f5f2;

            font-family: 'Poppins', sans-serif;

            color: #333;

            overflow: hidden;

        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .box {

            width: 90%;

            max-width: 400px;

            text-align: center;

            position: relative;

            z-index: 5;

        }


        /* =========================
           TITLE
        ========================== */

        h1 {

            margin: 0 0 18px 0;

            font-family: 'Poppins', sans-serif;

            font-size: 24px;

            font-weight: 700;

            line-height: 1.5;

        }


        /* =========================
           CLUE
        ========================== */

        .clue {

            margin: 0 0 25px 0;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 400;

            color: #888;

        }


        /* =========================
           PASSWORD INPUT
        ========================== */

        input {

            width: 100%;

            padding: 12px 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            background: white;

            text-align: center;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 400;

            outline: none;

        }


        input:focus {

            border-color: #999;

        }


        /* =========================
           UNLOCK BUTTON
        ========================== */

        button {

            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #A6A6A6;

            color: white;

            cursor: pointer;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        button:hover {

            background: #7A7A7A;

            transform: scale(1.05);

        }


        /* =========================
           WRONG PASSWORD MESSAGE
        ========================== */

        #message {

            margin-top: 20px;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 400;

            color: #555;

            min-height: 23px;

        }


        /* =========================
           STARS
        ========================== */

        .star {

            position: fixed;

            z-index: 1;

            pointer-events: none;

            user-select: none;

            opacity: 0.75;

            animation-name: starMove;

            animation-timing-function: ease-in-out;

            animation-iteration-count: infinite;

        }


        /* =========================
           STAR MOVEMENT

           Bergerak random di sekitar
           posisi masing-masing.
        ========================== */

        @keyframes starMove {

            0% {

                transform:
                    translate(0, 0)
                    rotate(0deg);

            }

            20% {

                transform:
                    translate(18px, -13px)
                    rotate(10deg);

            }

            40% {

                transform:
                    translate(-15px, 15px)
                    rotate(-9deg);

            }

            60% {

                transform:
                    translate(13px, 20px)
                    rotate(7deg);

            }

            80% {

                transform:
                    translate(-20px, -10px)
                    rotate(-10deg);

            }

            100% {

                transform:
                    translate(0, 0)
                    rotate(0deg);

            }

        }


        /* =========================
           HIDDEN PAGES
        ========================== */

        .page {

            display: none;

            width: 100%;

            min-height: 100vh;

            position: fixed;

            inset: 0;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;

        }


        /* =========================
           BACK BUTTON
        ========================== */

        .back-button {

            position: fixed;

            top: 20px;

            left: 20px;

            width: auto;

            margin: 0;

            padding: 8px 16px;

            background: #555;

            color: white;

            border-radius: 8px;

            font-size: 13px;

            z-index: 100;

        }


        .back-button:hover {

            background: #333;

        }

    </style>

</head>


<body>


    <!-- =========================
         STARS
    ========================== -->

    <script>

        const starColors = [

            "#F6E7A1",

            "#F7C6C7",

            "#C6DEF1",

            "#C9E4C5",

            "#E2C6F1"

        ];


        function createStars() {

            const starCount = 5;


            for (let i = 0; i < starCount; i++) {

                const star =
                    document.createElement("div");


                star.classList.add("star");


                star.innerHTML = "★";


                /* RANDOM COLOR */

                star.style.color =
                    starColors[
                        Math.floor(
                            Math.random()
                            * starColors.length
                        )
                    ];


                /* LEBIH BESAR */

                star.style.fontSize =
                    (25 + Math.random() * 25)
                    + "px";


                /* MEMENUHI SELURUH LAYAR */

                star.style.left =
                    (2 + Math.random() * 94)
                    + "%";


                star.style.top =
                    (2 + Math.random() * 94)
                    + "%";


                /* RANDOM SPEED */

                star.style.animationDuration =
                    (3 + Math.random() * 4)
                    + "s";


                /* RANDOM START */

                star.style.animationDelay =
                    (Math.random() * 3)
                    + "s";


                document.body.appendChild(star);

            }

        }


        createStars();

    </script>



    <!-- =========================
         MAIN PAGE
    ========================== -->

    <div class="box" id="mainPage">


        <div id="login">


            <h1>
                Access Password
            </h1>


            <p class="clue">
                clue: tanggal lahir pemilik website
            </p>


            <input
                type="password"
                id="password"
                placeholder="enter password"
                onfocus="this.placeholder=''"
                onblur="if(this.value==='') this.placeholder='enter password'"
                onkeydown="if(event.key==='Enter') checkPassword()"
            >


            <button
                onclick="checkPassword()"
            >
                Unlock
            </button>


            <p id="message"></p>


        </div>


    </div>



    <!-- =========================
         PAGE 1
    ========================== -->

    <div
        class="page"
        id="page1"
    >

        <button
            class="back-button"
            onclick="goBack()"
        >
            Back
        </button>


        <div>

            <h1>
                OG LETTER
            </h1>

            <p>
                Page 1
            </p>

        </div>

    </div>



    <!-- =========================
         B1
    ========================== -->

    <div
        class="page"
        id="B1"
    >

        <button
            class="back-button"
            onclick="goBack()"
        >
            Back
        </button>


        <div>

            <h1>
                SELAMAT ULANG TAHUN JAFAR
            </h1>

            <p>
                B1
            </p>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        /* =========================
           CHECK PASSWORD
        ========================== */

        function checkPassword() {


            const passwordInput =
                document.getElementById(
                    "password"
                );


            const password =
                passwordInput.value.trim();


            const message =
                document.getElementById(
                    "message"
                );


            /*
             * 24122006
             * → PAGE 1
             */

            if (
                password === "24122006"
            ) {

                showPage("page1");

                return;

            }


            /*
             * 20061215
             * → B1
             */

            if (
                password === "20061215"
            ) {

                showPage("B1");

                return;

            }


            /*
             * PASSWORD SALAH
             */

            message.innerText =
                "astaga? kok salah?";


            passwordInput.value = "";

        }



        /* =========================
           SHOW PAGE
        ========================== */

        function showPage(pageId) {


            document.getElementById(
                "mainPage"
            ).style.display = "none";


            const pages =
                document.querySelectorAll(
                    ".page"
                );


            pages.forEach(function(page) {

                page.style.display = "none";

            });


            const selectedPage =
                document.getElementById(
                    pageId
                );


            selectedPage.style.display =
                "flex";

        }



        /* =========================
           BACK
        ========================== */

        function goBack() {


            const pages =
                document.querySelectorAll(
                    ".page"
                );


            pages.forEach(function(page) {

                page.style.display = "none";

            });


            document.getElementById(
                "mainPage"
            ).style.display = "block";


            document.getElementById(
                "password"
            ).value = "";


            document.getElementById(
                "message"
            ).innerText = "";

        }

    </script>


</body>

</html>
